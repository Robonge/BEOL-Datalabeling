:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4;
  --bg-base:#F3F5F9; --bg-grid:#C8D4E4; --surface:#F6F8FC;
  --text-strong:#1E2D4A; --text-muted:#3F4B60; --accent:#B23A0A; --accent-soft:#FFF0E6;
  --radius-sm:8px; --radius:12px;
  --font:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  --hero-cream:#F3EBDD; --hero-ink:#1D1A1A;
  --hero-serif:'Sitka Banner','Didot','Bodoni 72','Bodoni MT',Georgia,serif;
  --hero-script:'Edwardian Script ITC','Snell Roundhand','Apple Chancery','Gabriola',Georgia,serif;
}
*{box-sizing:border-box}
input::placeholder,textarea::placeholder{color:#4B566B;opacity:1}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-0.02em;color:var(--text-strong);background:var(--bg-base)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--primary-deep);outline-offset:2px}
/* 히어로: 첫 화면 전체. 스크롤하거나 버튼을 누르면 아래 대화 화면으로 내려간다 */
html{scroll-snap-type:y mandatory}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
html.lock{overflow:hidden}
.hero,.app{scroll-snap-align:start}
.hero{height:100vh;height:100svh;padding:12px;background:var(--bg-base)}
.hero-frame{position:relative;isolation:isolate;height:100%;overflow:hidden;border-radius:20px;background:#5E6774 50% 38%/cover no-repeat;color:var(--hero-cream);letter-spacing:0}
.hero-frame::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(20,18,20,.34),rgba(20,18,20,0) 20%),linear-gradient(to top,rgba(20,18,20,.66),rgba(20,18,20,.3) 34%,rgba(20,18,20,0) 60%)}
.hero-top{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 28px}
.hero-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(243,235,221,.8);border-radius:50%;font-family:var(--hero-serif);font-size:17px;line-height:1}
.hero-brand{font-family:var(--hero-serif);font-size:21px;line-height:1}
.hero-demo{justify-self:end;border:1px solid rgba(243,235,221,.75);background:rgba(40,44,56,.4);padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.2em}
.hero-copy{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px clamp(28px,6svh,64px)}
.hero-kicker{position:relative;z-index:1;margin:0 0 -.32em;font-family:var(--hero-script);font-size:clamp(30px,3.6vw,56px);line-height:1}
.hero-title{margin:0;font-family:var(--hero-serif);font-weight:400;font-size:clamp(52px,min(10.4vw,17svh),190px);line-height:.95;letter-spacing:-0.025em;text-shadow:0 2px 24px rgba(0,0,0,.18)}
.hero-lead{margin:18px 0 0;max-width:34em;font-size:13px;line-height:1.7;color:rgba(243,235,221,.92);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.hero-go{display:inline-flex;align-items:center;gap:10px;margin-top:22px;border:1px solid rgba(243,235,221,.8);border-radius:2px;background:rgba(40,44,56,.35);color:var(--hero-cream);padding:10px 20px;font-size:13px;font-weight:700;letter-spacing:.04em;transition:background .2s,color .2s}
.hero-go:hover{background:var(--hero-cream);color:var(--hero-ink)}
.hero-go svg{transition:transform .2s}
.hero-go:hover svg{transform:translateY(2px)}
.hero :focus-visible{outline:2px solid var(--hero-cream);outline-offset:3px}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:14px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--bg-grid)}
.top h2{margin:0;font-size:22px;letter-spacing:-0.05em}
.badge{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px}
.badge[hidden]{display:none}
/* 필터 바 */
.fbar{background:var(--surface);border-bottom:1px solid var(--bg-grid);padding:8px 24px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:12px;color:var(--text-muted);margin-right:2px}
.grp{display:flex;align-items:center;gap:5px;padding-right:10px;margin-right:4px;border-right:1px solid var(--bg-grid);flex-wrap:wrap}
.grp .gn{font-size:14px;font-weight:700;color:var(--primary-deep)}
.chip{border:1px solid var(--bg-grid);background:#fff;border-radius:999px;padding:1px 10px;font-size:12px;white-space:nowrap}
.chip small{font-size:12px;color:var(--text-muted);margin-left:3px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on small{color:#fff}
.lnk[hidden]{display:none}
.gcount{font-size:12px;color:var(--accent);font-weight:700}
.lnk{font-size:12px;color:var(--text-muted);background:none;border:0;text-decoration:underline;padding:0 2px}
.more{margin-left:auto;border:1px solid var(--primary);color:var(--primary-deep);background:#fff;border-radius:var(--radius-sm);padding:2px 12px;font-size:12px;font-weight:700}
.fmore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 24px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bg-grid)}
.fmore[hidden]{display:none}
.fmore .grp{border:0;margin:0;align-items:flex-start}
.fmore .gn{width:100%}
.fmsg{font-size:12px;color:var(--accent);font-weight:700}
.clearall{margin-left:2px}
/* 대화 */
main{overflow:auto;overscroll-behavior:contain;padding:22px 0}
.thread{max-width:980px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:18px}
.empty{align-self:center;text-align:center;color:var(--text-muted);padding:40px 0}
.empty button{border:1px dashed var(--primary);background:#fff;color:var(--primary-deep);border-radius:var(--radius-sm);padding:6px 14px;margin-top:6px}
.q{align-self:flex-end;max-width:70%;background:var(--primary-deep);color:#fff;border-radius:14px 14px 2px 14px;padding:9px 14px;white-space:pre-wrap;word-break:break-word}
.a{background:#fff;border:1px solid var(--bg-grid);border-radius:14px 14px 14px 2px;padding:14px 18px;box-shadow:0 2px 8px rgba(53,70,144,.06)}
.a p{margin:0 0 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.rq{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.err{color:var(--accent);font-weight:700}
.retry{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:var(--radius-sm);padding:2px 12px;font-weight:700;margin-top:4px}
.cite{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:700;padding:0 5px;margin:0 1px}
.src{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.sc{flex:0 0 auto;width:150px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--surface);padding:6px;text-align:left}
.sc.cited{border:2px solid var(--accent);padding:5px;background:var(--accent-soft)}
.th{aspect-ratio:16/9;background:#D5DAE2;border-radius:5px;margin-bottom:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#3F4B60;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.sc span{display:block;font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{color:var(--accent);font-family:var(--mono);margin-right:4px}
.fb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fb button{border:1px solid var(--bg-grid);background:#fff;border-radius:var(--radius-sm);padding:2px 10px}
.fb button.on{border-color:var(--primary);background:rgba(74,95,168,.12)}
.fb input{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:3px 8px;background:var(--surface);min-width:220px;flex:1;max-width:420px}
.fb .fnote{font-size:12px;color:var(--text-muted)}
.dock{border-top:1px solid var(--bg-grid);background:#fff;padding:12px 24px}
.dock form{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.dock textarea{flex:1;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);resize:none;max-height:140px;line-height:1.5}
.send{background:var(--accent);color:#fff;border:0;border-radius:var(--radius-sm);padding:10px 22px;font-weight:700}
/* 팝업 */
.ov{position:fixed;inset:0;background:rgba(30,45,74,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov[hidden]{display:none}
.modal{background:#fff;border-radius:var(--radius);width:min(660px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(30,45,74,.35);padding:16px 18px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh h2{margin:0;font-size:18px;letter-spacing:-0.045em}
.x{border:1px solid var(--bg-grid);background:#fff;border-radius:var(--radius-sm);width:30px;height:30px;flex:0 0 auto}
.ph{aspect-ratio:16/9;background:#D5DAE2;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#3F4B60;font-weight:700;margin:12px 0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tag{font-size:12px;border:1px solid var(--primary-soft);color:var(--primary-deep);border-radius:999px;padding:0 9px;background:rgba(107,130,196,.1)}
.tag.na{opacity:.55;border-style:dashed}
.tag i{font-style:normal;color:var(--text-muted);margin-right:3px}
.meta{font-size:12px;color:var(--text-muted)}
.mono{font-family:var(--mono);font-size:12px}
details.body{margin-top:10px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface)}
details.body summary{font-size:12px;cursor:pointer}
details.body p{white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.nav button{border:1px solid var(--bg-grid);background:#fff;border-radius:var(--radius-sm);padding:5px 14px;font-weight:700}
@media (max-width:900px){.fmore{grid-template-columns:1fr 1fr}.q{max-width:92%}.thread{padding:0 14px}.fbar,.top,.dock{padding-left:14px;padding-right:14px}

  /* ---------- 필터 ---------- */
  var facets = {};          // axis -> [{value, n}]

  var moreOpen = false;

  function orderAxes(list) {
    var rank = function (a) { var i = AXIS_ORDER.indexOf(a); return i < 0 ? 1000 : i; };
    return list.map(function (a, i) { return { a: a, i: i }; })
      .sort(function (x, y) { return (rank(x.a) - rank(y.a)) || (x.i - y.i); })
      .map(function (o) { return o.a; });

  var countRefs = {};       // axis -> 선택 개수 표시 요소
  var clearAllBtn = null;
  function isOn(axis, v) { return (selected[axis] || []).indexOf(v) >= 0; }
  function toggle(axis, v) {

    else if (arr.length < MAX_PER_AXIS) arr.push(v);

  }
  function clearAxis(axis) { selected[axis] = []; refreshFilters(); }
  function clearAll() { selected = {}; refreshFilters(); }
  function anySelected() { return Object.keys(selected).some(function (k) { return selected[k].length; }); }
  function activeFilters() {
    var f = {};
    Object.keys(selected).forEach(function (k) { if (selected[k].length) f[k] = selected[k].slice(); });
    return f;
  }

  function buildGroup(axis) {
    var g = el("div", "grp");
    g.appendChild(el("span", "gn", axis));
    var cnt = el("span", "gcount");
    countRefs[axis] = cnt;
    g.appendChild(cnt);
    chipRefs[axis] = [];
    (facets[axis] || []).forEach(function (it) {

    var c = el("button", "lnk", "모두 해제");
    c.type = "button";
    c.addEventListener("click", function () { clearAxis(axis); });

    return g;
  }

  // 칩 상태만 갱신한다(DOM을 다시 만들지 않아 키보드 포커스가 유지된다)
  function refreshFilters() {
    axes.forEach(function (a) {
      (chipRefs[a] || []).forEach(function (r) {

    });
    if (clearAllBtn) clearAllBtn.hidden = !anySelected();
  }

  function renderFilters() {
    var row = $("frow"), more = $("fmore");
    row.textContent = ""; more.textContent = "";
    row.appendChild(el("span", "flabel", "필터"));
    axes.slice(0, 3).forEach(function (a) { row.appendChild(buildGroup(a)); });
    clearAllBtn = el("button", "lnk clearall", "전체 해제");
    clearAllBtn.type = "button";
    clearAllBtn.hidden = true;
    clearAllBtn.addEventListener("click", clearAll);
    row.appendChild(clearAllBtn);
    var rest = axes.slice(3);
    if (rest.length) {
      var moreBtn = el("button", "more");
      moreBtn.type = "button";
      var syncMore = function () {
        moreBtn.textContent = "더보기 " + (moreOpen ? "▴" : "▾") + " (축 " + rest.length + "개 더)";
        moreBtn.setAttribute("aria-expanded", moreOpen ? "true" : "false");
        more.hidden = !moreOpen;
      };

  function filterError(code) {
    var row = $("frow");
    row.textContent = "";
    row.appendChild(el("span", "flabel", "필터"));
    row.appendChild(el("span", "fmsg", "라벨 목록을 불러오지 못했습니다(" + code + ")"));
  }

  function loadFacets() {
    fetch(SUPABASE_URL + "/rest/v1/beol_rag_facets?select=axis,value,n&order=axis,n.desc", { headers: authHeaders() })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP_" + r.status);
        return r.json();
      })
      .then(function (rows) {
        if (!Array.isArray(rows)) throw new Error("BAD_FACETS");
        var seen = [];
        rows.forEach(function (r) {
          if (!facets[r.axis]) { facets[r.axis] = []; seen.push(r.axis); }
          facets[r.axis].push({ value: r.value, n: r.n });
        });
        axes = orderAxes(seen);
        renderFilters();
      })
      .catch(function (e) {
        var m = String(e && e.message || "");
        filterError(/^HTTP_|^BAD_/.test(m) ? m : "NETWORK_OR_AUTH");
      });
  }

  function loadBadge() {
    fetch(SUPABASE_URL + "/rest/v1/beol_rag_chunks?select=chunk_id", {
      headers: authHeaders({ "Prefer": "count=exact", "Range": "0-0" })
    }).then(function (r) {
      var cr = r.headers.get("Content-Range");
      var m = cr && cr.match(/\/(\d+)$/);
      if (!r.ok && r.status !== 206) throw new Error("x");
      if (!m) throw new Error("x");
      var b = $("badge");
      b.textContent = "완전한 슬라이드 " + m[1] + "장";
      b.hidden = false;
    }).catch(function () { /* 배지 생략 */ });
  }

  /* ---------- 그림 로딩 ---------- */
  var imgSeq = 0;
  function loadImage(box, ev, altText) {
    box.textContent = "";
    var tok = box._tok = ++imgSeq;
    function stale() { return box._tok !== tok; }
    function none() { if (stale()) return; box.textContent = ""; box.appendChild(document.createTextNode("그림 없음")); }
    function show(img) { box.textContent = ""; box.appendChild(img); }
    function viaStorage() {
      if (stale()) return;
      if (!ev.image_path) return none();
      var path = String(ev.image_path).split("/").map(encodeURIComponent).join("/");
      var url = SUPABASE_URL + "/storage/v1/object/authenticated/" + encodeURIComponent("BEOL-labeling") + "/" + path;
      fetch(url, { headers: authHeaders() })
        .then(function (r) { if (!r.ok) throw new Error("x"); return r.blob(); })
        .then(function (blob) {
          if (stale()) return;
          var img = new Image(); img.alt = altText;
          var blobUrl = URL.createObjectURL(blob);
          img.onload = function () { URL.revokeObjectURL(blobUrl); if (stale()) return; show(img); };
          img.onerror = function () { URL.revokeObjectURL(blobUrl); none(); };
          img.src = blobUrl;
        })
        .catch(none);
    }
    if (ev.image_url) {
      var img = new Image(); img.alt = altText;
      img.onload = function () { if (stale()) return; show(img); };
      img.onerror = function () { if (stale()) return; viaStorage(); };
      img.src = ev.image_url;
      box.appendChild(document.createTextNode("불러오는 중…"));
    } else { viaStorage(); }
  }

  /* ---------- 팝업 ---------- */
  var modalList = [], modalIdx = 0, lastFocus = null;
  function fmt(v) { return (v === null || v === undefined || v === "" ) ? "—" : String(v); }

  function renderModal() {
    var ev = modalList[modalIdx];
    if (!ev) return;
    $("mTitle").textContent = "[" + ev.n + "] " + fmt(ev.title);
    loadImage($("mImg"), ev, fmt(ev.title));
    var tags = $("mTags"); tags.textContent = "";
    var ax = (ev.labels && ev.labels.axes) || {};
    Object.keys(ax).forEach(function (k) {
      var vals = Array.isArray(ax[k]) ? ax[k] : [ax[k]];
      vals.forEach(function (v) {
        if (v === null || v === undefined || v === "") return;
        var t = el("span", "tag" + (String(v) === NA_VALUE ? " na" : ""));
        t.appendChild(el("i", null, k));
        t.appendChild(document.createTextNode(String(v)));
        tags.appendChild(t);
      });
    });
    var dm = ev.doc_meta || {};
    var lots = Array.isArray(dm.lots) ? dm.lots : [];
    var lotTxt = lots.map(function (l) { return l && l.lot; }).filter(Boolean).join(", ");
    var wfTxt = lots.map(function (l) {
      if (!l || l.wf === undefined || l.wf === null) return "";
      return Array.isArray(l.wf) ? l.wf.join(", ") : String(l.wf);
    }).filter(Boolean).join(" / ");
    $("mMeta").textContent = "Lot " + fmt(lotTxt) + " / WF " + fmt(wfTxt) + " / 작성자 " + fmt(dm.author) + " / " + fmt(dm.date);
    var s = ev.scores || {};
    var vs = (typeof s.vector_similarity === "number") ? s.vector_similarity.toFixed(3) : "—";
    var rr = (typeof s.rrf === "number") ? s.rrf.toFixed(4) : "—";
    $("mScore").textContent = (ev.kind === "sibling")
      ? "같은 파일 — [" + fmt(ev.sibling_of) + "]과 같은 파일의 다른 슬라이드 · file_id " + fmt(ev.file_id16)
      : "cosine " + vs + " · rrf " + rr + " · file_id " + fmt(ev.file_id16);
    $("mBody").textContent = fmt(ev.content);
    $("mPrev").disabled = modalIdx <= 0;
    $("mNext").disabled = modalIdx >= modalList.length - 1;
  }
  function openModal(list, n) {
    modalList = list;
    modalIdx = Math.max(0, list.findIndex(function (e) { return e.n === n; }));
    lastFocus = document.activeElement;
    $("ov").hidden = false;
    document.documentElement.classList.add("lock");   // 팝업 뒤 페이지가 히어로로 스크롤되지 않게
    renderModal();
    $("mClose").focus();
  }
  function closeModal() {
    $("ov").hidden = true;
    document.documentElement.classList.remove("lock");
    $("mImg")._tok = ++imgSeq;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  $("mClose").addEventListener("click", closeModal);
  $("ov").addEventListener("mousedown", function (e) { if (e.target === $("ov")) closeModal(); });
  $("mPrev").addEventListener("click", function () { if (modalIdx > 0) { modalIdx--; renderModal(); } });
  $("mNext").addEventListener("click", function () { if (modalIdx < modalList.length - 1) { modalIdx++; renderModal(); } });
  document.addEventListener("keydown", function (e) {
    if ($("ov").hidden) return;
    if (e.key === "Tab") {
      var f = Array.prototype.filter.call(
        $("modal").querySelectorAll("button, summary, input, a[href]"),
        function (x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], cur = document.activeElement;
      if (!$("modal").contains(cur)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && cur === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
    }
    else if (e.key === "Escape") closeModal();
    else if (e.key === "ArrowLeft") $("mPrev").click();
    else if (e.key === "ArrowRight") $("mNext").click();
  });

  /* ---------- 대화 ---------- */
  var chatHistory = [];   // 성공한 {role, content} 쌍만 쌓는다
  var pendingRetry = null;
  var busy = false;
  var thread = $("thread"), main = $("main"), input = $("input"), sendBtn = $("send");

  function scrollDown() { main.scrollTop = main.scrollHeight; }
  function setBusy(b) { busy = b; sendBtn.disabled = b; input.disabled = b; if (!b && $("ov").hidden) input.focus(); }

  function renderAnswerText(p, text, evidence) {
    var parts = String(text).split(/(\[\d+\])/);
    parts.forEach(function (seg) {
      var m = seg.match(/^\[(\d+)\]$/);
      var n = m ? parseInt(m[1], 10) : 0;
      // 근거 목록에 없는 번호는 버튼으로 만들지 않는다(엉뚱한 슬라이드가 열리지 않게).
      if (m && evidence.some(function (e) { return e.n === n; })) {
        var b = el("button", "cite", String(n));
        b.type = "button";
        b.setAttribute("aria-label", "근거 " + n + " 보기");
        b.addEventListener("click", function () { openModal(evidence, n); });
        p.appendChild(b);
      } else if (seg) { p.appendChild(document.createTextNode(seg)); }
    });
  }

  // items: 이 줄에 보여 줄 카드, all: 팝업에서 앞뒤로 넘길 전체 근거(같은 파일 슬라이드 포함)
  function buildSources(items, cited, all) {
    var box = el("div", "src");
    var evidence = all || items;
    items.forEach(function (ev) {
      var isCited = cited.indexOf(ev.n) >= 0;
      var c = el("button", "sc" + (isCited ? " cited" : ""));
      c.type = "button";
      c.setAttribute("aria-label", "근거 " + ev.n + " " + fmt(ev.title) + (isCited ? " (답에서 인용됨)" : ""));
      var th = el("div", "th");
      c.appendChild(th);
      var sp = el("span");
      sp.appendChild(el("b", null, String(ev.n)));
      sp.appendChild(document.createTextNode(fmt(ev.title)));
      sp.title = fmt(ev.title);
      c.appendChild(sp);
      c.addEventListener("click", function () { openModal(evidence, ev.n); });
      box.appendChild(c);
      loadImage(th, ev, "근거 " + ev.n);
    });
    return box;
  }

  function buildFeedback(question, answer, evidence, rewritten) {
    var wrap = el("div", "fb");
    var up = el("button", null, "👍"); up.type = "button"; up.setAttribute("aria-label", "도움이 됐어요");
    var down = el("button", null, "👎"); down.type = "button"; down.setAttribute("aria-label", "도움이 안 됐어요");
    var note = el("span", "fnote");
    var cBox = null, sending = false, goBtn = null;
    function setLocked(v) {
      up.disabled = v; down.disabled = v;
      if (goBtn) goBtn.disabled = v;
    }
    function lock(verdictBtn) {
      setLocked(true);
      verdictBtn.classList.add("on");
      if (cBox) { cBox.remove(); cBox = null; goBtn = null; }
    }
    function submit(verdict, comment, btn) {
      if (sending) return;
      sending = true; setLocked(true);
      var ev = evidence.slice(0, 8).map(function (e) { return { n: e.n, chunk_id: e.chunk_id, scores: e.scores }; });
      if (typeof rewritten === "string" && rewritten) ev.push({ rewritten_query: rewritten });
      var body = {
        session_id: sessionId, question: question, answer: answer,
        evidence: ev, verdict: verdict, comment: comment || null
      };
      note.textContent = "보내는 중…";
      fetch(SUPABASE_URL + "/rest/v1/beol_rag_feedback", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
        body: JSON.stringify(body)
      }).then(function (r) {
        if (r.status === 201) { lock(btn); note.textContent = "고마워요, 기록했어요"; }
        else { sending = false; setLocked(false); note.textContent = "기록하지 못했어요(상태 " + r.status + ")"; }
      }).catch(function () { sending = false; setLocked(false); note.textContent = "기록하지 못했어요(NETWORK_OR_AUTH)"; });
    }
    up.addEventListener("click", function () { submit("good", null, up); });
    down.addEventListener("click", function () {
      if (cBox || sending) return;
      cBox = el("span");
      var ci = el("input"); ci.type = "text"; ci.maxLength = 300;
      ci.placeholder = "아쉬운 점 한 줄 (선택)"; ci.setAttribute("aria-label", "아쉬운 점");
      goBtn = el("button", null, "보내기"); goBtn.type = "button";
      goBtn.addEventListener("click", function () { submit("bad", ci.value.trim() || null, down); });
      ci.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (!e.isComposing && e.keyCode !== 229) goBtn.click(); }
      });
      cBox.appendChild(ci); cBox.appendChild(document.createTextNode(" ")); cBox.appendChild(goBtn);
      wrap.insertBefore(cBox, note);
      ci.focus();
    });
    wrap.appendChild(up); wrap.appendChild(down); wrap.appendChild(note);
    return wrap;
  }

  var NO_RETRY = ["BAD_INPUT", "BAD_REQUEST_JSON", "CONFIG_MISSING", "METHOD_NOT_ALLOWED", "EMBED_DIM_MISMATCH"];
  var WARN_TEXT = {
    SIGN_FAILED: "일부 그림을 바로 불러오지 못해 다른 방법으로 불러옵니다",
    TRUNCATED: "답이 길어 일부가 잘렸습니다",
    SIBLINGS_FAILED: "같은 파일의 다른 슬라이드를 불러오지 못해 검색된 슬라이드만으로 답했습니다"
  };

  function errorBox(box, code, retryFn) {
    box.textContent = "";
    box.appendChild(el("p", "err", "답을 받지 못했습니다(" + code + ")"));
    if (NO_RETRY.indexOf(code) >= 0) return;
    var rb = el("button", "retry", "다시 시도"); rb.type = "button";
    rb.addEventListener("click", function () { if (!busy) retryFn(); });
    box.appendChild(rb);
    pendingRetry = rb;
  }

  // snapshot: 이 질문까지의 성공한 대화 + 이 질문. 재시도도 같은 snapshot·filters만 보낸다.
  function ask(question, snapshot, filters, box) {
    var msgs = snapshot.slice(-HISTORY_MAX).map(function (m) {
      return { role: m.role, content: m.role === "assistant" ? m.content.slice(0, ASSISTANT_MAX_CHARS) : m.content };
    });
    setBusy(true);
    pendingRetry = null;
    box.textContent = "";
    box.appendChild(el("p", "meta", "찾는 중…"));
    scrollDown();
    var ok = false;
    var retry = function () { ask(question, snapshot, filters, box); };
    var signal, timer = null;
    if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) signal = AbortSignal.timeout(TIMEOUT_MS);
    else { var ctrl = new AbortController(); timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS); signal = ctrl.signal; }
    fetch(FUNCTION_URL, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ messages: msgs, filters: filters, k: TOP_K }),
      signal: signal
    }).then(function (r) {
      // 게이트웨이 오류(401·5xx)는 본문에 error가 없으므로 상태 코드를 사유로 쓴다.
      return r.json().catch(function () { return null; }).then(function (d) {
        if (!r.ok && !(d && d.error)) return { error: "HTTP_" + r.status };
        return d || { error: "BAD_RESPONSE_" + r.status };
      });
    }).then(function (d) {
      if (!d || d.error || typeof d.answer !== "string") {
        errorBox(box, (d && d.error) || "BAD_RESPONSE", retry);
        return;
      }
      try {
        var evidence = Array.isArray(d.evidence) ? d.evidence : [];
        var cited = Array.isArray(d.cited) ? d.cited : [];
        box.textContent = "";
        if (d.rewritten_query && d.rewritten_query !== question) {
          box.appendChild(el("div", "rq", "검색한 질문: " + d.rewritten_query));
        }
        var p = el("p");
        renderAnswerText(p, d.answer, evidence);
        box.appendChild(p);
        // 검색된 슬라이드(hit)는 늘 보여 주고, 같은 파일 슬라이드(sibling)는 답에 인용된 것만 아랫줄에 보여 준다.
        var hits = evidence.filter(function (e) { return e.kind !== "sibling"; });
        var sibs = evidence.filter(function (e) { return e.kind === "sibling" && cited.indexOf(e.n) >= 0; });
        if (hits.length && String(d.answer).indexOf("자료에 없음") === 0) {
          box.appendChild(el("div", "rq", "가장 비슷한 슬라이드 (참고용 — 질문의 답은 자료에 없음)"));
        } else if (hits.length && !cited.length) {
          box.appendChild(el("div", "rq", "가장 비슷한 슬라이드 (참고용, 답의 근거 아님)"));
        }
        if (hits.length) box.appendChild(buildSources(hits, cited, evidence));
        if (sibs.length) {
          box.appendChild(el("div", "rq", "같은 파일의 다른 슬라이드 (답에 인용됨)"));
          box.appendChild(buildSources(sibs, cited, evidence));
        }
        box.appendChild(buildFeedback(question, d.answer, evidence, d.rewritten_query));
        var seen = {};
        [].concat(d.warnings || []).forEach(function (w) {
          var t = WARN_TEXT[w];
          if (t && !seen[w]) { seen[w] = 1; box.appendChild(el("div", "rq", "참고: " + t)); }
        });
        chatHistory.push({ role: "user", content: question }, { role: "assistant", content: d.answer });
        ok = true;
      } catch (e) {
        errorBox(box, "RENDER_ERROR", retry);
      }
    }).catch(function (e) {
      var name = e && e.name;
      var code = (name === "TimeoutError" || name === "AbortError") ? "TIMEOUT" : "NETWORK_OR_AUTH";
      errorBox(box, code, retry);
    }).then(function () {
      if (timer) clearTimeout(timer);
      setBusy(false);
      if (ok) box.scrollIntoView({ block: "start", behavior: "smooth" });
      else scrollDown();
    });
  }

  function send() {
    if (busy) return;
    var text = input.value.trim();
    if (!text) return;
    var em = $("empty"); if (em) em.remove();
    if (pendingRetry) { pendingRetry.remove(); pendingRetry = null; }
    input.value = ""; autosize();
    thread.appendChild(el("div", "q", text));
    var keep = HISTORY_MAX - 1; keep -= keep % 2;   // user로 시작하는 쌍만 남긴다
    var snapshot = (keep > 0 ? chatHistory.slice(-keep) : []).concat([{ role: "user", content: text }]);
    var box = el("div", "a");
    thread.appendChild(box);
    ask(text, snapshot, activeFilters(), box);
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
  $("example").addEventListener("click", function () {
    input.value = "M2 RSBM TaN ALD cycle window 평가 결과 어때?";
    autosize(); input.focus();
  });
  /* ---------- 히어로 ---------- */
  // 버튼·아래로 굴리기·위로 쓸어 올리기 모두 대화 화면으로 한 번에 내려간다.
  // 터치패드처럼 조금씩 굴리면 스냅이 히어로로 되돌리므로 여기서 직접 내린다(동작 줄이기 설정이면 html이 바로 이동).
  var hero = document.querySelector(".hero");
  var heroMoving = false;
  function toApp(focusInput) {
    if (!heroMoving) {
      heroMoving = true;
      $("app").scrollIntoView({ block: "start" });
      setTimeout(function () { heroMoving = false; }, 800);
    }
    if (focusInput) input.focus({ preventScroll: true });
  }
  $("heroGo").addEventListener("click", function () { toApp(true); });
  hero.addEventListener("wheel", function (e) {
    if (e.ctrlKey || e.deltaY <= 0 || window.scrollY >= hero.offsetHeight - 2) return;
    e.preventDefault();
    toApp(false);
  }, { passive: false });
  var touchY = null;
  hero.addEventListener("touchstart", function (e) {
    touchY = e.touches.length === 1 ? e.touches[0].clientY : null;
  }, { passive: true });
  hero.addEventListener("touchend", function (e) {
    if (touchY !== null && e.changedTouches.length && touchY - e.changedTouches[0].clientY > 40) toApp(false);
    touchY = null;
  }, { passive: true });

  loadFacets();
  loadBadge();
})();
</script>
</body>
</html>
