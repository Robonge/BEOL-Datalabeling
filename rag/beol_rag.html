<style>
:root{
  /* 셸은 히어로의 벽(슬레이트), 작업면은 아치 안쪽처럼 밝게, 도장은 노을빛 주홍 */
  --shell:#3A4048; --shell-2:#454C55; --shell-3:#515963; --shell-line:#58606A;
  --shell-text:#F2EFEA; --shell-muted:#C4C9D0;
  --ground:#EBEBE8; --tray:#F3F3F1; --sheet:#FFFFFF; --line:#D4D5D4; --line-2:#E3E3E1;
  --ink:#1E2227; --ink-2:#4B5159; --ink-3:#626972;
  --action:#2C3238; --action-hover:#3A4048;
  --stamp:#D2452B; --stamp-ink:#B4361F; --stamp-soft:rgba(210,69,43,.09);
  --tag:#E6D6B8; --tag-soft:#F3EADB; --tag-ink:#2A2318;
  --hold:#EBA33A; --hold-soft:#FBE8C4; --hold-ink:#2A1A00;
  --radius:10px;
  --font:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --mono:Consolas,'D2Coding','SF Mono',Menlo,monospace;
  --hero-cream:#F3EBDD; --hero-ink:#1D1A1A;
  --hero-serif:'Sitka Banner','Didot','Bodoni 72','Bodoni MT',Georgia,serif;
  --hero-script:'Edwardian Script ITC','Snell Roundhand','Apple Chancery','Gabriola',Georgia,serif;
}
*{box-sizing:border-box}
::selection{background:rgba(230,214,184,.8);color:var(--ink)}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
html.lock{overflow:hidden}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-0.01em;color:var(--ink);background:var(--shell);caret-color:var(--action);font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.fn{font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ico{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* 대화 화면: 슬레이트 셸(위 막대 + 왼쪽 STEP 레일)과 밝은 회벽색 작업면 */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;background:var(--shell)}
.bar{position:relative;z-index:6;display:flex;align-items:center;gap:18px;min-width:0;min-height:60px;padding:10px 18px 10px 22px;color:var(--shell-text)}
.bar :focus-visible,.rail :focus-visible{outline-color:var(--tag)}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap;font-family:var(--hero-serif);font-size:19px;line-height:1}
.brand .mk{display:grid;place-items:center;width:28px;height:28px;border:1px solid rgba(242,239,234,.7);border-radius:50%;font-size:14px}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.fw{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 13px;border:1px solid var(--shell-line);border-radius:999px;background:var(--shell-2);color:var(--shell-text);font-size:13px;white-space:nowrap}
.fbtn:hover{background:var(--shell-3)}
.fbtn[aria-expanded="true"]{background:var(--sheet);border-color:var(--sheet);color:var(--ink)}
.fbtn .n{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font:700 11px/1 var(--mono)}
.fbtn .n[hidden]{display:none}
.fbtn .ico{width:14px;height:14px;opacity:.85}
.fmsg{font-size:12.5px;color:var(--shell-muted)}
.bar .meta{display:flex;align-items:center;gap:12px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.count{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--shell-muted)}
.count .fn{color:var(--shell-muted)}
.count[hidden]{display:none}
.count b{font:700 13px var(--mono);color:var(--shell-text)}
/* 필터 드롭다운 */
.pop{position:absolute;z-index:20;top:calc(100% + 8px);left:0;width:270px;padding:8px;border-radius:12px;background:var(--sheet);color:var(--ink);box-shadow:0 18px 44px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12)}
.pop[hidden]{display:none}
.pop.wide{width:min(720px,calc(100vw - 40px))}
.phd{display:flex;align-items:baseline;gap:10px;padding:4px 6px 8px;font-size:12px;color:var(--ink-3)}
.phd b{font-size:13px;color:var(--ink)}
.phd .lnk{margin-left:auto}
.lnk[hidden]{display:none}
.scrim{display:none}
.plist{max-height:300px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;text-align:left;font-size:13px;color:var(--ink)}
.opt:hover{background:var(--tray)}
.opt .box{display:grid;place-items:center;flex:0 0 16px;height:16px;border:1.5px solid var(--ink-3);border-radius:4px;color:transparent}
.opt .box .ico{width:12px;height:12px;stroke-width:2.2}
.opt[aria-pressed="true"] .box{background:var(--action);border-color:var(--action);color:#fff}
.opt .c{margin-left:auto;font:12px var(--mono);color:var(--ink-3)}
.opt.na .v{color:var(--ink-3)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;max-height:min(62vh,540px);overflow:auto;scrollbar-width:thin}
.pgrid .plist{max-height:200px}
.ahd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px 4px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.lnk{border:0;background:none;padding:2px 4px;color:var(--action);font-size:12px;font-weight:400;text-decoration:underline;text-underline-offset:3px}
.body{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0}
/* 왼쪽 레일 */
.rail{min-height:0;overflow:auto;padding:6px 10px 16px 14px;color:var(--shell-text);scrollbar-width:thin;scrollbar-color:var(--shell-line) transparent}
.rail h2{margin:10px 6px 12px;color:var(--shell-muted)}
.steps{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.rail-empty{margin:4px 6px;font-size:12.5px;color:var(--shell-muted)}
.rail-empty[hidden]{display:none}
/* 작업면 */
.work{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;border-top-left-radius:18px;background:var(--ground)}
/* 범위 줄이 숨겨져도(필터 없음) 대화는 늘어나는 칸, 입력창은 맨 아래 칸에 머물도록 칸을 고정한다 */
.work>.scope{grid-row:1}.work>main{grid-row:2}.work>.dock{grid-row:3}
.scope{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 28px 0}
.scope[hidden]{display:none}
.scope .lab{margin-right:4px;color:var(--ink-2)}
.chipx{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 7px 0 10px;border:0;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:12px}
.chipx i{font-style:normal;opacity:.72}
.chipx .ico{width:12px;height:12px}
main{min-height:0;overflow:auto;overscroll-behavior:contain;padding:22px 28px 28px;scrollbar-width:thin;scrollbar-color:#B3B6B9 transparent}
.thread{display:flex;flex-direction:column;gap:22px;max-width:940px;margin:0 auto}
.step,.empty{scroll-margin-top:12px}
.sheet{min-width:0;padding:16px 22px 16px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--sheet);box-shadow:0 1px 2px rgba(20,22,26,.05),0 8px 24px rgba(20,22,26,.06)}
.strip{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;margin:-2px -4px 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--tray)}
.strip>div{display:flex;align-items:baseline;gap:8px;min-width:0;padding:7px 10px;border-left:1px solid var(--line-2)}
.strip>div:first-child{border-left:0}
.strip .v{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:12.5px var(--mono);color:var(--ink)}
.strip .v.ko{font-family:var(--font)}
.strip .v.held{font-weight:700;color:var(--hold-ink)}
.qh,.empty h3{margin:0 0 4px;font-size:17px;line-height:1.5;font-weight:700;letter-spacing:-0.02em;word-break:keep-all;overflow-wrap:anywhere}
.ans{padding-top:10px}
.ans>p{margin:0 0 14px;max-width:46em;font-size:15.5px;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.rq{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.loading{display:flex;align-items:center;gap:12px;padding:4px 0 6px;font-size:13.5px;color:var(--ink-2)}
.loading b{font:700 12px var(--mono);color:var(--ink-3)}
/* 도장: 답의 출처 번호 */
.stamp{position:relative;top:-1px;display:inline-grid;place-items:center;width:22px;height:22px;margin:0 2px;padding:0;border:2px solid var(--stamp);border-radius:50%;background:var(--stamp-soft);color:var(--stamp-ink);font:700 11px/1 var(--mono);vertical-align:middle;transform:rotate(var(--r,0deg));transition:background .15s,color .15s}
.stamp:hover,.stamp.hot{background:var(--stamp);color:#fff}
@media (prefers-reduced-motion:no-preference){.fresh .stamp,.fresh .cs{animation:press .46s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 90ms)}}
@keyframes press{from{transform:rotate(var(--r,0deg)) scale(1.7);opacity:.3}to{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
/* 근거 첨부: 회색 트레이 위 흰 슬라이드, 칸 위치 고정 */
.tray{margin:6px -8px 0;padding:12px 12px 14px;border-radius:12px;background:var(--tray)}
.tray+.tray{margin-top:10px}
.tray-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin:0 2px 12px;font-size:12.5px;color:var(--ink-2)}
.tray-h b{margin-right:4px;font:700 12.5px var(--mono);color:var(--ink)}
.atts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.att{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:0;border:0;background:none;text-align:left;color:var(--ink)}
.att .th{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(20,22,26,.08);font-size:11.5px;color:var(--ink-3);transition:box-shadow .15s}
.att .th img{display:block;width:100%;height:100%;object-fit:cover}
/* 후보 슬라이드: 썸네일 자리를 낮은 점선 칸으로 두고, 누르면 썸네일을 연다 */
.att .th.lazy{aspect-ratio:auto;min-height:44px;padding:6px 10px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--line);border:1px dashed var(--ink-3);border-radius:6px;font-size:12px;font-weight:700;line-height:1.4;text-align:center;color:var(--ink-2)}
.att .th.lazy .lt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.att .ptitle{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;font-weight:700}
.att:hover .th.lazy{box-shadow:inset 0 0 0 1px var(--ink-3);color:var(--ink)}
.att:hover .th,.att.hot .th{box-shadow:0 0 0 2px var(--stamp),0 6px 16px rgba(20,22,26,.14)}
.att:focus-visible{outline-offset:4px}
.cs{position:absolute;top:-9px;right:-7px;display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--stamp);border-radius:50%;background:#fff;color:var(--stamp-ink);font:700 11px/1 var(--mono);transform:rotate(var(--r,0deg));box-shadow:0 2px 6px rgba(20,22,26,.15)}
.att.hot .cs{background:var(--stamp);color:#fff}
.plate{display:flex;flex-direction:column;gap:3px;min-width:0}
.pt{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:12.5px;font-weight:700}
.pt .no{flex:0 0 auto;font:700 11px var(--mono);color:var(--ink-3)}
.pt .tt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:11.5px var(--mono);color:var(--ink-3)}
.pr{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.att.cited .pr{color:var(--ink)}
.rel{display:flex;align-items:center;gap:8px;margin-top:2px}
.rel .trk{flex:1;height:3px;border-radius:2px;background:var(--line)}
.rel .trk i{display:block;height:100%;border-radius:2px;background:var(--ink-2)}
.rel em{font:normal 11px var(--mono);color:var(--ink-3)}
.rel .d{flex:0 0 auto}
/* 평가 줄 */
.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.fb>.fn{margin-right:4px}
.fbb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink-2);font-size:12.5px}
.fbb:hover{border-color:var(--ink-3);color:var(--ink)}
.fbb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbb .ico{width:14px;height:14px}
.fb input{flex:1;min-width:200px;max-width:420px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--tray)}
.fb input::placeholder{color:var(--ink-3);opacity:1}
.sendc{height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--action);color:#fff;font-size:12.5px;font-weight:700}
.fnote{font-size:12px;color:var(--ink-3)}
/* HOLD: 답을 받지 못함 */
.hold{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--hold-soft);color:var(--hold-ink);font-size:13.5px}
.hold .ht{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:4px;background:var(--hold);font:700 11px/1 var(--mono);letter-spacing:.08em}
.retry{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--hold-ink);border-radius:6px;background:var(--sheet);color:var(--hold-ink);font-size:12.5px;font-weight:700}
/* 첫 화면 안내 */
.empty .sheet{padding:16px 22px 22px}
.empty p{max-width:44em;margin:0 0 16px;font-size:14px;color:var(--ink-2);word-break:keep-all}
.ex{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 14px;border:1px dashed var(--action);border-radius:10px;background:var(--tray);color:var(--action);font-size:13.5px;text-align:left}
.ex:hover{background:#E9E9E5}
/* 입력창: 다음 STEP */
.dock{padding:10px 28px 18px}
.dock form{max-width:940px;margin:0 auto}
/* 이어서 질문 / 새 질문: 지금 질문이 앞 대화를 참고하는지 알려 주고 끊을 수 있게 한다 */
.mode{display:flex;align-items:center;gap:10px;margin:0 2px 8px;font-size:12.5px;color:var(--ink-2)}
.mode[hidden]{display:none}
.mode .dot{width:7px;height:7px;border-radius:50%;background:var(--stamp)}
.newq{display:inline-flex;align-items:center;gap:6px;height:28px;margin-left:auto;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);font-size:12.5px;font-weight:700}
.newq:hover{border-color:var(--ink-3)}
/* 왼쪽 대화 목록: 대화 하나가 항목 하나, 새 채팅을 열 때만 항목이 생긴다 */
.newchat{display:flex;align-items:center;gap:8px;width:100%;margin:8px 0 6px;padding:9px 10px;border:1px solid var(--shell-line);border-radius:10px;background:none;color:var(--shell-text);font-size:13px;font-weight:700;text-align:left}
.newchat:hover{background:var(--shell-2)}
.chatbtn{display:flex;flex-direction:column;gap:2px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:left;color:var(--shell-text)}
.chatbtn:hover{background:var(--shell-2)}
.chatbtn.cur{background:var(--shell-2)}
.chatbtn.cur .sq{font-weight:700}
.chatbtn .sq{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;line-height:1.45}
.chatbtn .ss{font-size:11.5px;color:var(--shell-muted)}
.conv[hidden]{display:none}
/* 답 안의 표 */
.tw{max-width:100%;margin:0 0 14px;overflow-x:auto;border:1px solid var(--line-2);border-radius:8px}
.atab{min-width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}
.atab th,.atab td{padding:8px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
.atab th{background:var(--tray);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.atab tr:last-child td{border-bottom:0}
/* 답의 HTML 표가 달고 오는 클래스(허용한 것만 남는다) */
.atab.border-collapse{border-collapse:collapse}
.atab .border,.atab.border{border:1px solid var(--line)}
.atab .px-3{padding-left:12px;padding-right:12px}
.atab .py-2{padding-top:8px;padding-bottom:8px}
.atab .text-left{text-align:left}.atab .text-center{text-align:center}.atab .text-right{text-align:right}
.nstep{flex:0 0 auto;align-self:center;padding-right:10px;border-right:1px solid var(--line-2);white-space:nowrap}
.nstep b{margin-left:4px;font:700 12px var(--mono);color:var(--ink)}
.in{display:flex;align-items:flex-end;gap:10px;padding:7px 7px 7px 14px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);box-shadow:0 6px 18px rgba(20,22,26,.08)}
.in:focus-within{border-color:var(--action);box-shadow:0 0 0 3px rgba(44,50,56,.16),0 6px 18px rgba(20,22,26,.08)}
.in textarea{flex:1;min-height:40px;max-height:140px;padding:9px 0;border:0;background:transparent;resize:none;line-height:1.5;scrollbar-width:none}
.in textarea:focus-visible{outline:none}
.in textarea::placeholder{color:var(--ink-3);opacity:1}
.send{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--action);color:#fff;font-weight:700}
.send:hover{background:var(--action-hover)}
/* 근거 팝업 */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,22,26,.55)}
.ov[hidden]{display:none}
.modal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);width:min(1000px,100%);max-height:94vh;overflow:auto;overscroll-behavior:contain;border-radius:16px;background:var(--sheet);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mfig{padding:18px;border-radius:16px 0 0 16px;background:var(--tray)}
.mfig .ph{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink-3);font-weight:700}
.mfig .ph img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
/* 팝업 그림을 누르면 화면 가득 크게, 다시 누르거나 Esc면 돌아온다 */
.mfig .ph.zoomable{cursor:zoom-in}
.mfig .ph.zoomed{position:fixed;inset:0;z-index:40;aspect-ratio:auto;padding:20px;border-radius:0;background:rgba(14,16,19,.94);box-shadow:none;cursor:zoom-out}
.mfig .ph.zoomed img{background:transparent}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.mnav button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);font-size:13px;font-weight:700}
.mpos{font:12px var(--mono);color:var(--ink-3)}
.minfo{display:flex;flex-direction:column;gap:12px;min-width:0;padding:18px 20px 20px}
.mh{display:flex;align-items:flex-start;gap:10px}
.mh .stamp{flex:0 0 auto;margin:1px 0 0}
.mh h2{flex:1;margin:0;font-size:16.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.x{display:grid;place-items:center;flex:0 0 auto;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th{width:72px;padding:8px 8px 6px 0;text-align:left;vertical-align:top}
.mtable td{padding:6px 0;border-bottom:1px solid var(--line-2);font-family:var(--mono);overflow-wrap:anywhere}
.mtable .rel{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:1px 9px;border:1px solid var(--line);border-radius:999px;background:var(--tray);font-size:12px}
.tag.na{opacity:.6;border-style:dashed}
.tag i{margin-right:4px;font-style:normal;color:var(--ink-3)}
details.mbody summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--action)}
details.mbody summary::-webkit-details-marker{display:none}
details.mbody summary .ico{width:14px;height:14px;transition:transform .15s}
details.mbody[open] summary .ico{transform:rotate(180deg)}
details.mbody p{max-height:240px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;color:var(--ink-2)}
@media (max-width:900px){
  .bar{flex-wrap:wrap;gap:10px;padding:10px 12px}
  .filters{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .fw{position:static}
  .scrim:not([hidden]){display:block;position:fixed;inset:0;z-index:15;background:rgba(20,22,26,.42)}
  .pop,.pop.wide{position:fixed;top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:70vh;overflow:auto}
  .pgrid{grid-template-columns:1fr}
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .work{border-top-right-radius:18px}
  .scope{padding:10px 12px 0}
  main{padding:14px 10px 18px}
  .strip{grid-template-columns:auto minmax(0,1fr) auto}
  .strip .tm{display:none}
  .nstep{display:none}
  .sheet{padding:14px 14px 12px}
  .atts{grid-template-columns:repeat(5,150px);overflow-x:auto;padding:10px 4px 6px}
  .dock{padding:8px 10px 10px}
  .modal{grid-template-columns:minmax(0,1fr)}
  .mfig{border-radius:16px 16px 0 0}
}

/* ===== 2026-10-08 Gemini식 다크(시안 A): gemini.google.com 레이아웃·색(바탕 #0F0F0F, 입력창 #1E1F20, 남색 빛번짐)을 따른다.
   위 규칙의 색 변수를 아래 --g-* 팔레트로 다시 묶고, 배치는 이 묶음에서만 덮어쓴다. ===== */
:root{--g-side:#1B1B1C;--g-bg:#0F0F0F;--g-surf:#1E1F20;--g-surf-2:#282A2C;--g-bubble:#282A2C;--g-tray:rgba(255,255,255,.028);
  --g-line:#333537;--g-line-2:#232425;--g-tx:#E3E3E3;--g-tx-2:#C4C7C5;--g-tx-3:#8E918F;
  --g-acc:#A8C7FA;--g-acc-ink:#A8C7FA;--g-acc-soft:rgba(168,199,250,.12);--g-chip:#1F3760;--g-chip-ink:#D3E3FD;
  --g-glow:radial-gradient(ellipse 60% 58% at 52% 58%,rgba(38,44,112,.9),rgba(28,32,84,.5) 45%,transparent 76%);
  --g-glow-soft:radial-gradient(ellipse 75% 45% at 50% 100%,rgba(38,44,112,.28),transparent 72%)}
:root{
  --shell:var(--g-side); --shell-2:var(--g-surf); --shell-3:var(--g-surf-2); --shell-line:var(--g-line);
  --shell-text:var(--g-tx); --shell-muted:var(--g-tx-3);
  --ground:var(--g-bg); --tray:var(--g-tray); --sheet:var(--g-surf); --line:var(--g-line); --line-2:var(--g-line-2);
  --ink:var(--g-tx); --ink-2:var(--g-tx-2); --ink-3:var(--g-tx-3);
  --action:var(--g-tx); --action-hover:var(--g-tx-2);
  --stamp:var(--g-acc); --stamp-ink:var(--g-acc-ink); --stamp-soft:var(--g-acc-soft);
  --tag:var(--g-chip); --tag-soft:var(--g-chip); --tag-ink:var(--g-chip-ink);
  --hold-soft:rgba(235,163,58,.13); --hold-ink:#F2C57C;
}
body{background:var(--g-side);caret-color:var(--g-tx)}
::selection{background:var(--g-acc-soft);color:var(--g-tx)}
:focus-visible{outline-color:var(--g-acc)}
.app{background:var(--g-side)}
.body{grid-template-columns:272px minmax(0,1fr)}
/* 작업면: 바탕 + 가운데 빛번짐. 첫 화면은 진하게, 대화 중에는 옅게 */
.work{position:relative;isolation:isolate;border-top-left-radius:22px;background:var(--g-glow-soft),var(--g-bg)}
.work::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:var(--g-glow);opacity:0;transition:opacity .9s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
.work:has(#empty:not([hidden]))::before{opacity:1}
main{scrollbar-color:var(--g-line) transparent}
.thread{max-width:780px;gap:34px}
/* 첫 화면: 인사 한 줄 + 알약 입력창을 화면 가운데에 */
.work:has(#empty:not([hidden])){grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
.work:has(#empty:not([hidden]))>main{align-self:end;overflow:visible;padding-bottom:6px}
.work:has(#empty:not([hidden]))>.dock{align-self:start}
.empty .sheet{padding:0;border:0;background:none;box-shadow:none;text-align:center}
.empty h3{margin:0 0 18px;font-size:clamp(26px,2.6vw,34px);font-weight:400;letter-spacing:-.01em;color:var(--g-tx)}
.ex{min-height:34px;padding:6px 14px;border:1px solid var(--g-line);border-radius:999px;background:transparent;color:var(--g-tx-2);font-size:13px}
.ex:hover{background:var(--g-surf);color:var(--g-tx)}
/* STEP 한 개: 카드 대신 맨바탕. 진행표 줄은 작은 한 줄로, 질문은 오른쪽 말풍선 */
.step>.sheet{padding:0;border:0;background:none;box-shadow:none}
.step .strip{display:flex;justify-content:flex-end;gap:14px;margin:0 4px 8px;border:0;background:none}
.step .strip>div{padding:0;border:0;gap:5px}
.step .strip .fn{font-size:9.5px;letter-spacing:.1em;color:var(--g-tx-3);opacity:.8}
.step .strip .v{font-size:11.5px;color:var(--g-tx-3)}
.step .strip .v.held{color:var(--hold-ink)}
.qh{width:fit-content;max-width:78%;margin:0 0 22px auto;padding:12px 20px;border-radius:24px 6px 24px 24px;background:var(--g-bubble);font-size:15.5px;font-weight:400;line-height:1.6;color:var(--g-tx)}
.ans{padding-top:0}
.ans>p{color:var(--g-tx);font-size:15.5px}
.rq{color:var(--g-tx-3)}
.stamp{border-width:1.5px;color:var(--g-acc-ink)}
.stamp:hover,.stamp.hot{background:var(--g-acc);color:var(--g-bg)}
/* 근거 트레이: 어두운 판 위 흰 슬라이드 */
.tray{margin:8px 0 0;padding:14px 14px 16px;border:1px solid var(--g-line-2);border-radius:18px;background:var(--g-tray)}
.tray-h{color:var(--g-tx-3)}
.tray-h b{color:var(--g-tx)}
.att .th{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35)}
.att .th.lazy{background:transparent;border-color:var(--g-tx-3);box-shadow:none;color:var(--g-tx-2)}
.att:hover .th.lazy{border-color:var(--g-tx-2);color:var(--g-tx);box-shadow:none}
.att:hover .th,.att.hot .th{box-shadow:0 0 0 2px var(--g-acc),0 8px 20px rgba(0,0,0,.4)}
.cs{background:var(--g-bg);color:var(--g-acc-ink)}
.att.hot .cs{background:var(--g-acc);color:var(--g-bg)}
.rel .trk{background:var(--g-line)}
.rel .trk i{background:var(--g-tx-3)}
/* 표 */
.tw{border-color:var(--g-line)}
.atab th{background:var(--g-surf)}
.atab .border,.atab.border{border-color:var(--g-line)}
/* 평가 줄 */
.fb{border-top-color:var(--g-line-2)}
.fbb{background:transparent;border-color:var(--g-line)}
.fbb.on{background:var(--g-tx);border-color:var(--g-tx);color:var(--g-bg)}
.fb input{background:var(--g-surf);border-color:var(--g-line)}
.sendc{background:var(--g-tx);color:var(--g-bg)}
.retry{background:transparent}
/* 입력창: 알약 */
.dock{padding:10px 28px 20px}
.dock form{max-width:780px}
.mode{color:var(--g-tx-3)}
.mode .dot{background:var(--g-acc)}
.newq{border:0;background:var(--g-surf);color:var(--g-tx)}
.newq:hover{background:var(--g-surf-2)}
.in{align-items:center;min-height:64px;padding:8px 8px 8px 22px;border:0;border-radius:32px;background:var(--g-surf);box-shadow:none}
.in:focus-within{box-shadow:0 0 0 1px var(--g-line)}
.in textarea{font-size:16px;color:var(--g-tx)}
.in textarea::placeholder{color:var(--g-tx-3)}
.nstep{border-right-color:var(--g-line)}
.nstep b{color:var(--g-tx-2)}
.send{height:44px;border-radius:999px;background:var(--g-tx);color:var(--g-bg)}
.send:hover{background:var(--g-tx-2)}
.send:disabled{opacity:.35}
/* 위 막대 + 왼쪽 목록: 사이드바 색 하나로 */
.fbtn{border:0;background:var(--g-surf)}
.fbtn:hover{background:var(--g-surf-2)}
.fbtn[aria-expanded="true"]{background:var(--g-tx);color:var(--g-bg)}
.rail{padding:4px 12px 16px 12px}
.rail h2{margin:16px 12px 8px}
.newchat{border:0;border-radius:999px;background:var(--g-surf);padding:10px 16px}
.newchat:hover{background:var(--g-surf-2)}
.chatbtn{padding:8px 14px;border-radius:18px}
.chatbtn:hover{background:var(--g-surf)}
.chatbtn.cur{background:var(--g-chip)}
.chatbtn.cur .sq{color:var(--g-chip-ink)}
/* 팝업 */
.ov{background:rgba(0,0,0,.62)}
.mfig{background:var(--g-bg)}
.mnav button,.x{background:var(--g-surf-2);border-color:var(--g-line)}
.opt[aria-pressed="true"] .box{color:var(--g-bg)}
.pop{border:1px solid var(--g-line)}
.rail-empty{margin:4px 12px}
@media (prefers-reduced-motion:no-preference){
  .app.anim .empty,.app.anim .dock{transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
  .app.anim .dock{transition-delay:.1s}

}
/* 인트로: 탭마다 한 번 showreel(15초)을 음소거로 틀고, 끝나거나 건너뛰면 대화 화면이 떠오른다 */

  // 근거 번호마다 그 번호가 처음 붙은 답 문장(인용 이유)
  function reasons(answer) {
    var out = {};
    // HTML 표는 행을 한 줄로, 칸은 " · "로 이어 읽는다
    var plainText = String(answer).replace(/<\/t[dh]\s*>/gi, " · ").replace(/<\/tr\s*>/gi, "\n").replace(/<[^>]*>/g, " ");
    plainText.split(/\n+|(?<=[.!?。])\s+/).forEach(function (s) {
      var clean = s.replace(/\[(\d+)\](?=에서|에|은|는|이|가|을|를|의|와|과|으로|로)/g, "근거 $1")
        .replace(/\s*\[\d+\]/g, "").replace(/\s+/g, " ").trim();
      var re = /\[(\d+)\]/g, m;
      while ((m = re.exec(s))) { var n = +m[1]; if (!out[n] && clean) out[n] = clean; }
    });
    return out;
  }

  // 화면 번호를 다시 매긴다: 답에 인용된 슬라이드가 답에 처음 나온 순서대로 1번부터,
  // 그다음 인용 안 된 검색 슬라이드, 마지막에 인용 안 된 같은 파일 슬라이드. 답 글의 [n]도 같은 번호로 바꾼다.
  function renumber(answer, evidence, cited) {
    var byN = {}, order = [], seen = {};
    evidence.forEach(function (e) { byN[e.n] = e; });
    function take(n) { if (byN[n] && !seen[n]) { seen[n] = 1; order.push(n); } }
    var re = /\[(\d+)\]/g, m;
    while ((m = re.exec(String(answer)))) { if (cited.indexOf(+m[1]) >= 0) take(+m[1]); }
    cited.forEach(take);
    var nCited = order.length;
    evidence.forEach(function (e) { if (e.kind !== "sibling") take(e.n); });
    evidence.forEach(function (e) { take(e.n); });
    var map = {};
    order.forEach(function (n, i) { map[n] = i + 1; });
    return {
      answer: String(answer).replace(/\[(\d+)\]/g, function (s, d) { return map[d] ? "[" + map[d] + "]" : s; }),
      evidence: order.map(function (n) {
        var e = Object.assign({}, byN[n], { n: map[n] });
        if (e.kind === "sibling" && map[e.sibling_of]) e.sibling_of = map[e.sibling_of];
        return e;
      }),
      cited: order.slice(0, nCited).map(function (n) { return map[n]; })
    };
  }

  // 새 채팅: 빈 화면만 연다. 목록 항목은 첫 질문을 보낼 때 생긴다.
  function newChat() {

  }
  function createChat(title) {
    var c = { id: ++chatSeq, history: [], steps: 0, box: el("div", "conv") };
    thread.appendChild(c.box);
    $("railEmpty").hidden = true;
    var li = el("li");

    c.btn = b;

    return c;
  }
  $("newTopic").addEventListener("click", newChat);
  $("newChat").addEventListener("click", newChat);

  function scrollDown() { main.scrollTop = main.scrollHeight; }
  function setBusy(b) { busy = b; sendBtn.disabled = b; input.disabled = b; if (!b && $("ov").hidden) input.focus(); }

  // 답 본문을 그린다. "|"로 칸을 나눈 줄이 2줄 이상 이어지면 표로, 나머지는 문단으로 그린다.
  function renderAnswer(box, text, evidence, bind) {
    var order = 0;
    function stamp(n) {
      var b = el("button", "stamp", String(n));
      b.type = "button";
      b.dataset.n = String(n);
      b.style.setProperty("--r", rot(n));
      b.style.setProperty("--i", String(order++));
      b.setAttribute("aria-label", "근거 " + n + " 보기");
      b.addEventListener("click", function () { openModal(evidence, n); });
      bind(b, n);
      return b;
    }
    function cells(line) {
      var s = line.trim();
      if (s.charAt(0) === "|") s = s.slice(1);
      if (s.slice(-1) === "|") s = s.slice(0, -1);
      return s.split("|").map(function (c) { return c.trim(); });
    }
    function isSep(line) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line); }
    function isRow(line) {
      var bars = (line.match(/\|/g) || []).length;
      return bars >= 2 || (bars === 1 && /^\s*\|/.test(line));
    }
    var buf = [];
    function flushText() {
      var t = buf.join("\n").replace(/^\n+|\n+$/g, "");
      buf = [];
      if (!t) return;
      var p = el("p");
      inlineCites(p, t, evidence, stamp);
      box.appendChild(p);
    }
    function table(rows) {
      var width = rows.reduce(function (w, r) { return Math.max(w, r.length); }, 0);
      var wrap = el("div", "tw");
      var tb = el("table", "atab");
      rows.forEach(function (r, i) {
        var tr = el("tr");
        for (var c = 0; c < width; c++) {
          var cellEl = el(i === 0 ? "th" : "td");
          if (i === 0) cellEl.scope = "col";
          inlineCites(cellEl, r[c] || "", evidence, stamp);
          tr.appendChild(cellEl);
        }
        tb.appendChild(tr);
      });
      wrap.appendChild(tb);
      box.appendChild(wrap);
    }
    function plain(segment) {
      var lines = segment.split(/\r?\n/);
      for (var i = 0; i < lines.length; ) {
        if (!isRow(lines[i]) && !isSep(lines[i])) { buf.push(lines[i]); i++; continue; }
        var j = i, rows = [];
        while (j < lines.length && (isRow(lines[j]) || isSep(lines[j]))) {
          if (!isSep(lines[j])) rows.push(cells(lines[j]));
          j++;
        }
        if (rows.length >= 2) { flushText(); table(rows); }
        else buf = buf.concat(lines.slice(i, j));
        i = j;
      }
    }
    // 답 안의 HTML 표는 그대로 넣지 않는다. 떨어진 문서에서 읽고 표 칸의 글자만 꺼내 새 표를 만든다
    // (태그·속성·스크립트는 버리고, 클래스는 TABLE_CLASSES에 있는 것만 남긴다).
    function htmlTable(html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      Array.prototype.forEach.call(doc.querySelectorAll("script,style,template,noscript"), function (n) { n.remove(); });
      var src = doc.querySelector("table");
      if (!src) return false;
      var wrap = el("div", "tw");
      var tb = el("table", "atab");
      safeClasses(src, tb);
      var head = null, body = null;
      Array.prototype.forEach.call(src.querySelectorAll("tr"), function (tr) {
        var inHead = !!tr.closest("thead") || (!tr.closest("tbody") && !body && tr.querySelector("th") && !tr.querySelector("td"));
        var sec = inHead ? (head || (head = tb.appendChild(el("thead")))) : (body || (body = tb.appendChild(el("tbody"))));
        var row = el("tr");
        Array.prototype.forEach.call(tr.children, function (c) {
          var tag = c.tagName.toLowerCase();
          if (tag !== "th" && tag !== "td") return;
          var cellEl = el(inHead ? "th" : tag);
          if (cellEl.tagName === "TH") cellEl.scope = inHead ? "col" : "row";
          ["colspan", "rowspan"].forEach(function (a) {
            var v = parseInt(c.getAttribute(a), 10);
            if (v > 1 && v <= 20) cellEl.setAttribute(a, String(v));
          });
          safeClasses(c, cellEl);
          inlineCites(cellEl, c.textContent.replace(/\s+/g, " ").trim(), evidence, stamp);
          row.appendChild(cellEl);
        });
        if (row.children.length) sec.appendChild(row);
      });
      if (!tb.querySelector("tr")) return false;
      wrap.appendChild(tb);
      box.appendChild(wrap);
      return true;
    }
    var src = String(text), re = /<table\b[\s\S]*?(?:<\/table\s*>|$)/gi, last = 0, m;
    while ((m = re.exec(src))) {
      plain(src.slice(last, m.index));
      flushText();
      if (!htmlTable(m[0])) plain(m[0].replace(/<[^>]*>/g, " "));
      last = re.lastIndex;
      if (m[0] === "") re.lastIndex++;
    }
    plain(src.slice(last));
    flushText();
  }

  // 답의 HTML 표에 붙어 온 클래스 중 이 페이지가 아는 것만 옮긴다
  var TABLE_CLASSES = ["border-collapse", "border", "px-3", "py-2", "text-left", "text-center", "text-right"];
  function safeClasses(from, to) {
    String(from.getAttribute("class") || "").split(/\s+/).forEach(function (c) {
      if (TABLE_CLASSES.indexOf(c) >= 0) to.classList.add(c);
    });
  }

  // 글 안의 [n]을 도장 버튼으로 바꿔 붙인다. 근거 목록에 없는 번호는 글자 그대로 둔다.
  function inlineCites(p, text, evidence, stamp) {
    var parts = String(text).split(/(\[\d+\])/);
    var pending = [];   // 아직 붙이지 않은 도장(뒤따르는 문장부호를 먼저 붙이려고 모은다)
    function flush() { pending.forEach(function (b) { p.appendChild(b); }); pending = []; }
    parts.forEach(function (seg) {
      var m = seg.match(/^\[(\d+)\]$/);
      var n = m ? parseInt(m[1], 10) : 0;
      // 근거 목록에 없는 번호는 버튼으로 만들지 않는다(엉뚱한 슬라이드가 열리지 않게).
      if (m && evidence.some(function (e) { return e.n === n; })) { pending.push(stamp(n)); return; }
      if (!seg) return;
      var punct = pending.length ? (seg.match(/^[.,;:!?。、)\]]+/) || [""])[0] : "";
      if (punct) p.appendChild(document.createTextNode(punct));
      flush();
      p.appendChild(document.createTextNode(seg.slice(punct.length)));
    });
    flush();
  }

  // items: 이 트레이에 놓을 근거, all: 팝업에서 앞뒤로 넘길 전체 근거(같은 파일 슬라이드 포함)
  function buildSources(items, cited, all, why, bind) {
    var box = el("div", "atts");
    var evidence = all || items;
    var order = 0;
    items.forEach(function (ev) {
      var isCited = cited.indexOf(ev.n) >= 0;
      var c = el("button", "att" + (isCited ? " cited" : ""));
      c.type = "button";
      c.dataset.n = String(ev.n);
      c.setAttribute("aria-label", "근거 " + ev.n + " " + fmt(ev.title) + (isCited ? " (답에서 인용됨)" : ""));
      var th = el("span", "th");
      c.appendChild(th);
      if (isCited) {
        var cs = el("span", "cs", String(ev.n));
        cs.setAttribute("aria-hidden", "true");
        cs.style.setProperty("--r", rot(ev.n));
        cs.style.setProperty("--i", String(order++));
        c.appendChild(cs);
      }
      // 후보(인용 안 됨)는 점선 칸에 제목만 둔다. 설명 줄은 인용된 슬라이드에만.
      if (!isCited) {
        th.classList.add("lazy");
        th.appendChild(el("span", "lt", fmt(ev.title)));
        c.title = fmt(ev.title);
        c.setAttribute("aria-label", c.getAttribute("aria-label") + " · 눌러서 썸네일 보기");
        c.addEventListener("click", function () {
          if (th.classList.contains("lazy")) {
            th.classList.remove("lazy");
            c.insertBefore(el("span", "ptitle", fmt(ev.title)), th.nextSibling);
            c.setAttribute("aria-label", "근거 " + ev.n + " " + fmt(ev.title));
            loadImage(th, ev, "근거 " + ev.n);
            return;
          }
          openModal(evidence, ev.n);
        });
        bind(c, ev.n);
        box.appendChild(c);
        return;
      }
      var pl = el("span", "plate");
      var pt = el("span", "pt");
      pt.appendChild(el("span", "no", two(ev.n)));
      var tt = el("span", "tt", fmt(ev.title)); tt.title = fmt(ev.title);
      pt.appendChild(tt);
      pl.appendChild(pt);
      pl.appendChild(el("span", "pm", metaLine(ev)));
      pl.appendChild(el("span", "pr", why[ev.n] || "답에 인용됨"));
      pl.appendChild(relBar(ev, (ev.doc_meta || {}).date));
      c.appendChild(pl);
      c.addEventListener("click", function () { openModal(evidence, ev.n); });
      bind(c, ev.n);
      box.appendChild(c);
      loadImage(th, ev, "근거 " + ev.n);
    });
    return box;
  }
  // head: [필드 이름, 값] 쌍들과 덧붙임 문구
  function tray(head, note, atts) {
    var t = el("div", "tray");
    var h = el("div", "tray-h");
    head.forEach(function (f) {
      h.appendChild(el("span", "fn", f[0]));
      if (f[1] !== "") h.appendChild(el("b", null, String(f[1])));
    });
    if (note) h.appendChild(el("span", null, note));
    t.appendChild(h);
    t.appendChild(atts);
    return t;
  }

  function buildFeedback(question, answer, evidence, rewritten) {
    var wrap = el("div", "fb");
    var up = el("button", "fbb"); up.type = "button";
    up.appendChild(icon("thumb")); up.appendChild(document.createTextNode("도움이 됐어요"));
    var down = el("button", "fbb"); down.type = "button";
    down.appendChild(icon("thumb", true)); down.appendChild(document.createTextNode("아쉬워요"));
    var note = el("span", "fnote");
    var cBox = null, sending = false, goBtn = null;
    function setLocked(v) {
      up.disabled = v; down.disabled = v;
      if (goBtn) goBtn.disabled = v;
    }
    function lock(verdictBtn) {
      setLocked(true);
      verdictBtn.classList.add("on");
      if (cBox) { cBox.remove(); cBox = null; goBtn = null; }
    }
    function submit(verdict, comment, btn) {
      if (sending) return;
      sending = true; setLocked(true);
      var ev = evidence.slice(0, 8).map(function (e) { return { n: e.n, chunk_id: e.chunk_id, scores: e.scores }; });
      if (typeof rewritten === "string" && rewritten) ev.push({ rewritten_query: rewritten });
      var body = {
        session_id: sessionId, question: question, answer: answer,
        evidence: ev, verdict: verdict, comment: comment || null
      };
      note.textContent = "보내는 중…";
      fetch(SUPABASE_URL + "/rest/v1/beol_rag_feedback", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
        body: JSON.stringify(body)
      }).then(function (r) {
        if (r.status === 201) { lock(btn); note.textContent = "고마워요, 기록했어요"; }
        else { sending = false; setLocked(false); note.textContent = "기록하지 못했어요(상태 " + r.status + ")"; }
      }).catch(function () { sending = false; setLocked(false); note.textContent = "기록하지 못했어요(NETWORK_OR_AUTH)"; });
    }
    up.addEventListener("click", function () { submit("good", null, up); });
    down.addEventListener("click", function () {
      if (cBox || sending) return;
      var ci = el("input"); ci.type = "text"; ci.maxLength = 300;
      ci.placeholder = "아쉬운 점 한 줄 (선택)"; ci.setAttribute("aria-label", "아쉬운 점");
      goBtn = el("button", "sendc", "보내기"); goBtn.type = "button";
      goBtn.addEventListener("click", function () { submit("bad", ci.value.trim() || null, down); });
      ci.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (!e.isComposing && e.keyCode !== 229) goBtn.click(); }
      });
      var holder = el("span"); holder.style.display = "contents";
      holder.appendChild(ci); holder.appendChild(goBtn);
      cBox = holder;
      wrap.insertBefore(cBox, note);
      ci.focus();
    });
    wrap.appendChild(el("span", "fn", "SIGN-OFF"));
    wrap.appendChild(up); wrap.appendChild(down); wrap.appendChild(note);
    return wrap;
  }

  var NO_RETRY = ["BAD_INPUT", "BAD_REQUEST_JSON", "CONFIG_MISSING", "METHOD_NOT_ALLOWED", "EMBED_DIM_MISMATCH"];
  var WARN_TEXT = {
    SIGN_FAILED: "일부 그림을 바로 불러오지 못해 다른 방법으로 불러옵니다",
    TRUNCATED: "답이 길어 일부가 잘렸습니다",
    SIBLINGS_FAILED: "같은 파일의 다른 슬라이드를 불러오지 못해 검색된 슬라이드만으로 답했습니다"
  };

  // HOLD: 답을 받지 못한 STEP. 사유 코드와 다시 시도
  function errorBox(box, code, retryFn) {
    box.textContent = "";
    var h = el("div", "hold");
    h.appendChild(el("span", "ht", "HOLD"));
    h.appendChild(el("span", null, "답을 받지 못했습니다(" + code + ")"));
    if (NO_RETRY.indexOf(code) < 0) {
      var rb = el("button", "retry"); rb.type = "button";
      rb.appendChild(icon("retry")); rb.appendChild(document.createTextNode("다시 시도"));
      rb.addEventListener("click", function () { if (!busy) retryFn(); });
      h.appendChild(rb);
      pendingRetry = rb;
    }
    box.appendChild(h);
  }

  // 목록 항목 아래 줄: 그 채팅의 질문 수와 마지막 질문의 상태
  function setStepStatus(chat, text) { chat.status.textContent = "질문 " + chat.steps + "개 · " + text; }

  // snapshot: 이 질문까지의 성공한 대화 + 이 질문. 재시도도 같은 snapshot·filters만 보낸다.
  function ask(question, snapshot, filters, box, chat, evv) {
    var msgs = snapshot.slice(-HISTORY_MAX).map(function (m) {
      return { role: m.role, content: m.role === "assistant" ? m.content.slice(0, ASSISTANT_MAX_CHARS) : m.content };
    });
    setBusy(true);
    pendingRetry = null;
    box.textContent = "";
    box.classList.remove("fresh");
    // 기다리는 동안 흐르는 막대 대신 실제로 변하는 경과 시간을 보여 준다
    var ld = el("div", "loading");
    ld.appendChild(el("span", null, "근거 슬라이드를 찾는 중…"));
    var secs = el("b", null, "0초");
    ld.appendChild(secs);
    box.appendChild(ld);
    var t0 = Date.now();
    var tick = setInterval(function () { secs.textContent = Math.round((Date.now() - t0) / 1000) + "초"; }, 1000);
    setStepStatus(chat, "찾는 중…");
    scrollDown();
    var ok = false;
    var retry = function () { ask(question, snapshot, filters, box, chat, evv); };
    function evidenceCell(text, isHold) { evv.textContent = text; evv.classList.toggle("held", !!isHold); }
    evidenceCell("—");
    var signal, timer = null;
    if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) signal = AbortSignal.timeout(TIMEOUT_MS);
    else { var ctrl = new AbortController(); timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS); signal = ctrl.signal; }
    fetch(FUNCTION_URL, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ messages: msgs, filters: filters, k: TOP_K }),
      signal: signal
    }).then(function (r) {
      // 게이트웨이 오류(401·5xx)는 본문에 error가 없으므로 상태 코드를 사유로 쓴다.
      return r.json().catch(function () { return null; }).then(function (d) {
        if (!r.ok && !(d && d.error)) return { error: "HTTP_" + r.status };
        return d || { error: "BAD_RESPONSE_" + r.status };
      });
    }).then(function (d) {
      if (!d || d.error || typeof d.answer !== "string") {
        var code = (d && d.error) || "BAD_RESPONSE";
        errorBox(box, code, retry);
        setStepStatus(chat, "HOLD · " + code);
        evidenceCell("HOLD", true);
        return;
      }
      try {
        var rn = renumber(d.answer, Array.isArray(d.evidence) ? d.evidence : [], Array.isArray(d.cited) ? d.cited : []);
        var answer = rn.answer, evidence = rn.evidence, cited = rn.cited;
        box.textContent = "";
        var bind = linker(box);
        if (d.rewritten_query && d.rewritten_query !== question) {
          box.appendChild(el("p", "rq", "검색한 질문: " + d.rewritten_query));
        }
        renderAnswer(box, answer, evidence, bind);
        var why = reasons(answer);
        // 인용된 슬라이드(1번부터, 썸네일) → 인용 안 된 검색 슬라이드 → 인용 안 된 같은 파일 슬라이드(둘 다 점선 칸)
        var isCited = function (e) { return cited.indexOf(e.n) >= 0; };
        var hits = evidence.filter(function (e) { return e.kind !== "sibling"; });
        var main = evidence.filter(isCited);
        var cands = hits.filter(function (e) { return !isCited(e); });
        var sibs = evidence.filter(function (e) { return e.kind === "sibling" && !isCited(e); });
        var noMatch = answer.indexOf("자료에 없음") === 0;
        var citedHits = hits.filter(isCited).length;
        if (main.length) box.appendChild(tray([["CITED", main.length]], "답에 인용된 슬라이드", buildSources(main, cited, evidence, why, bind)));
        if (cands.length) {
          var head = noMatch ? [["NO MATCH", ""], ["NEAREST", cands.length]]
            : (!cited.length ? [["NEAREST", cands.length]] : [["CANDIDATE", cands.length]]);
          var note = noMatch ? "가장 비슷한 슬라이드 · 참고용, 질문의 답은 자료에 없음"
            : (!cited.length ? "가장 비슷한 슬라이드 · 참고용, 답의 근거 아님" : "검색된 후보 · 인용 안 됨, 눌러서 썸네일 보기");
          box.appendChild(tray(head, note, buildSources(cands, cited, evidence, why, bind)));
        }
        if (sibs.length) box.appendChild(tray([["SAME FILE", sibs.length]], "같은 파일의 다른 슬라이드 · 인용 안 됨, 눌러서 썸네일 보기", buildSources(sibs, cited, evidence, why, bind)));
        box.appendChild(buildFeedback(question, answer, evidence, d.rewritten_query));
        var seen = {};
        [].concat(d.warnings || []).forEach(function (w) {
          var t = WARN_TEXT[w];
          if (t && !seen[w]) { seen[w] = 1; box.appendChild(el("p", "rq", "참고: " + t)); }
        });
        box.classList.add("fresh");
        setStepStatus(chat, noMatch ? "자료에 없음" : (hits.length ? "근거 " + hits.length + " · 인용 " + cited.length : "근거 없음"));
        evidenceCell(noMatch ? "NO MATCH" : hits.length + " / " + citedHits);
        chat.history.push({ role: "user", content: question }, { role: "assistant", content: answer });
        if (chat === cur) syncMode();
        ok = true;
      } catch (e) {
        errorBox(box, "RENDER_ERROR", retry);
        setStepStatus(chat, "HOLD · RENDER_ERROR");
        evidenceCell("HOLD", true);
      }
    }).catch(function (e) {
      var name = e && e.name;
      var code = (name === "TimeoutError" || name === "AbortError") ? "TIMEOUT" : "NETWORK_OR_AUTH";
      errorBox(box, code, retry);
      setStepStatus(chat, "HOLD · " + code);
      evidenceCell("HOLD", true);
    }).then(function () {
      clearInterval(tick);
      if (timer) clearTimeout(timer);
      setBusy(false);
      if (chat !== cur) return;   // 답을 기다리는 동안 다른 채팅으로 옮겼으면 화면을 건드리지 않는다
      if (ok) box.closest(".step").scrollIntoView({ block: "start", behavior: "smooth" });
      else scrollDown();
    });
  }

  function hhmm(d) { return two(d.getHours()) + ":" + two(d.getMinutes()); }
  function cell(name, value, cls) {
    var c = el("div", cls || null);
    c.appendChild(el("span", "fn", name));
    var v = el("span", "v", value);
    c.appendChild(v);
    return { cell: c, value: v };
  }
  function scopeText(filters) {
    var vals = [], full = [];
    Object.keys(filters).forEach(function (a) { vals = vals.concat(filters[a]); full.push(a + ": " + filters[a].join(", ")); });
    return { short: vals.length ? vals.join(", ") : "전체", full: full.length ? full.join(" / ") : "필터 없음" };
  }

  function send() {
    if (busy) return;
    var text = input.value.trim();
    if (!text) return;
    if (pendingRetry) { pendingRetry.remove(); pendingRetry = null; }
    input.value = ""; autosize();
    var chat = cur || createChat(text);
    var k = ++chat.steps;
    var art = el("article", "step");
    art.id = "step-" + chat.id + "-" + k;
    art.setAttribute("aria-label", "STEP " + two(k));
    var sheet = el("div", "sheet");
    var filters = activeFilters();
    var sc = scopeText(filters);
    var now = new Date();
    var strip = el("div", "strip");
    strip.appendChild(cell("STEP", two(k)).cell);
    var tc = cell("TIME", "", "tm");
    var t = el("time", null, hhmm(now)); t.dateTime = now.toISOString();
    tc.value.appendChild(t);
    strip.appendChild(tc.cell);
    var scc = cell("SCOPE", sc.short);
    scc.value.classList.add("ko"); scc.value.title = sc.full;
    strip.appendChild(scc.cell);
    var evc = cell("EVIDENCE", "—");
    strip.appendChild(evc.cell);
    sheet.appendChild(strip);
    sheet.appendChild(el("h3", "qh", text));
    var box = el("div", "ans");
    sheet.appendChild(box);
    art.appendChild(sheet);
    chat.box.appendChild(art);
    showChat(chat);
    var keep = HISTORY_MAX - 1; keep -= keep % 2;   // user로 시작하는 쌍만 남긴다
    var snapshot = (keep > 0 ? chat.history.slice(-keep) : []).concat([{ role: "user", content: text }]);
    ask(text, snapshot, filters, box, chat, evc.value);
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  // 좁은 화면에서는 입력창 안내 문구를 한 줄로 줄인다
  var narrow = window.matchMedia("(max-width:900px)"), longHint = input.placeholder;
  function syncHint() { input.placeholder = narrow.matches ? "질문을 입력하세요" : longHint; }
  if (narrow.addEventListener) narrow.addEventListener("change", syncHint);
  syncHint();
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
  $("example").addEventListener("click", function () {
    input.value = "M2 RSBM TaN ALD cycle window 평가 결과 어때?";
    autosize(); input.focus();
  });
  /* ---------- 인트로 ---------- */
  // 탭마다 한 번 showreel을 음소거로 틀고, 끝나거나 건너뛰면 대화 화면이 떠오른다.
  // 영상을 못 불러오거나 자동 재생이 막히거나 시작이 늦으면 바로 대화 화면으로 간다.
  var appEl = $("app");
  var intro = $("intro");
  var introVideo = $("introVideo");
  var introDone = false;
  var playIntro = null;
  function endIntro() {
    if (introDone) return;
    introDone = true;
    try { sessionStorage.setItem("beol_rag_intro", "1"); } catch (e) {}
    introVideo.pause();
    document.removeEventListener("keydown", onIntroKey);
    if (playIntro) document.removeEventListener("visibilitychange", playIntro);
    intro.classList.add("out");
    appEl.classList.add("shown");
    input.focus({ preventScroll: true });
    setTimeout(function () { intro.remove(); }, 700);
  }
  function onIntroKey(e) { if (e.key === "Escape") endIntro(); }
  if (document.documentElement.classList.contains("no-intro")) {
    intro.remove();
  } else {
    appEl.classList.add("anim");
    document.addEventListener("keydown", onIntroKey);
    $("introSkip").addEventListener("click", endIntro);
    introVideo.addEventListener("click", endIntro);
    $("introSound").addEventListener("click", function () {
      introVideo.muted = !introVideo.muted;
      this.textContent = introVideo.muted ? "소리 켜기" : "소리 끄기";
      this.setAttribute("aria-pressed", String(!introVideo.muted));
    });
    introVideo.addEventListener("ended", endIntro);
    introVideo.addEventListener("error", endIntro);
    introVideo.src = "assets/showreel.mp4";
    // 백그라운드 탭에서는 브라우저가 재생을 막거나 멈추므로, 탭이 보일 때마다 멈춘 영상을 다시 튼다.
    // 보이는데도 5초 안에 시작하지 않거나, 자동 재생이 거절되거나 형식을 못 읽으면 넘어간다.
    var startGuard = null;
    playIntro = function () {
      if (introDone || document.hidden || !introVideo.paused) return;
      clearTimeout(startGuard);
      startGuard = setTimeout(endIntro, 5000);
      var played = introVideo.play();
      if (played && played.catch) played.catch(function (e) {
        if (document.hidden) clearTimeout(startGuard);
        else if (e && (e.name === "NotAllowedError" || e.name === "NotSupportedError")) endIntro();
      });
    };
    introVideo.addEventListener("playing", function () { clearTimeout(startGuard); });
    document.addEventListener("visibilitychange", playIntro);
    playIntro();
  }

  loadFacets();
  loadBadge();
})();
</script>
</body>
</html>
