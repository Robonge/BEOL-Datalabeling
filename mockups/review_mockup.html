<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEOL AX 검수 화면 목업</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4; --primary-mid:#4A6BAF;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --dot:#A8BDD4; --line:#7A9CC0;
  --text-strong:#1E2D4A; --text-sub:#5C6C8A; --text-muted:#9DAABF; --text-footer:#B0BCCC;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --surface:rgba(247,249,253,.82); --surface-solid:#F7F9FD;
  --grad:linear-gradient(148deg,#4A5FA8 0%,#354690 100%);
  --grad-soft:linear-gradient(148deg,#6B82C4 0%,#4A6BAF 100%);
  --ease:cubic-bezier(.34,1.56,.64,1);
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg-base);
  background-image:linear-gradient(rgba(200,212,228,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(200,212,228,.5) 1px,transparent 1px);
  background-size:48px 48px;
  font-family:'Apple SD Gothic Neo','Noto Sans KR','Inter','Malgun Gothic',sans-serif;
  font-size:13.5px;font-weight:400;letter-spacing:-0.02em;color:var(--text-strong);overflow:hidden;
}
b,strong,h1{font-weight:700}
.mono{font-family:var(--mono);letter-spacing:-0.03em}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:14px 16px 16px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bg-grid);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* 상단 바 */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.top>*{flex:none}
.top .prog{flex:0 1 auto;min-width:0}
#progTxt,#saveTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-f.cap{gap:4px;white-space:nowrap;flex-wrap:wrap}
.pane-f.cap .sg{margin-left:6px}
.pane-f.cap .sg:first-child{margin-left:0}
.logo{font-size:19px;font-weight:700;letter-spacing:-0.055em}
.sub{font-size:13px;color:var(--text-sub);margin-left:8px}
.prog{display:flex;align-items:center;gap:10px}
.prog-bar{width:110px;flex:none;height:6px;border-radius:3px;background:rgba(200,212,228,.7);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .32s var(--ease)}
#progTxt{font-size:11px;color:var(--text-sub)}
.spacer{flex:1}
.cap{font-size:11px;color:var(--text-muted);letter-spacing:-0.015em}

.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--bg-grid);background:var(--surface-solid);font:inherit;letter-spacing:inherit;color:var(--text-strong);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.16)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.ghost{background:transparent}
kbd{font-family:var(--mono);font-size:9.5px;letter-spacing:-0.03em;padding:1px 4px;border-radius:4px;border:1px solid var(--bg-grid);background:var(--bg-base);color:var(--text-sub);font-weight:400}
.btn.primary kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}

.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;border:1px solid var(--bg-grid);background:var(--bg-base);font-size:10.5px;color:var(--text-sub);white-space:nowrap}
.badge.danger{border-color:var(--danger);color:var(--danger)}
.badge.warning{border-color:var(--warning);color:#9A7424}
.badge.success{border-color:var(--success);color:var(--success)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex:none}
.dot.danger{background:var(--danger)}.dot.warning{background:var(--warning)}.dot.success{background:var(--success)}.dot.muted{background:var(--dot)}

/* 3분할 */
.main{display:grid;grid-template-columns:268px minmax(0,1fr) 412px;gap:14px;min-height:0}
.pane{background:var(--surface);border:1px solid var(--bg-grid);border-radius:12px;box-shadow:0 2px 8px rgba(53,70,144,.06);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{padding:12px 14px;border-bottom:1px solid var(--bg-grid);flex:none}
.pane-h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-0.048em}
.pane-b{overflow:auto;flex:1;min-height:0}
.pane-f{padding:10px 14px;border-top:1px solid var(--bg-grid);display:flex;align-items:center;gap:8px;flex:none}

/* 대기열 */
.q-group{display:flex;align-items:center;gap:6px;padding:12px 14px 4px;font-size:11px;color:var(--text-sub)}
.q-group .mono{margin-left:auto;color:var(--text-muted)}
.q-item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 10px;margin:4px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .2s,background .2s}
.q-item:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.14);background:var(--surface-solid)}
.q-item.cur{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(53,70,144,.22)}
.q-no{font-size:11px;color:var(--text-muted);padding-top:1px}
.q-item.cur .q-no{color:rgba(255,255,255,.7)}
.q-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item.cur .q-title{font-weight:700}
.q-meta{display:flex;align-items:center;gap:3px;margin-top:5px}
.q-prog{margin-left:auto;font-size:10.5px;color:var(--text-sub)}
.q-item.cur .q-prog{color:rgba(255,255,255,.85)}
.q-item.done .q-prog{color:var(--success)}
.q-item.cur.done .q-prog{color:#fff}
.q-bar{height:3px;border-radius:2px;background:rgba(200,212,228,.6);margin-top:5px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--primary-soft);transition:width .32s var(--ease)}
.q-item.done .q-bar i{background:var(--success)}
.q-item.cur .q-bar{background:rgba(255,255,255,.25)}
.q-item.cur .q-bar i{background:#fff}
.sg{width:15px;height:15px;border-radius:4px;border:1px solid var(--bg-grid);font-family:var(--mono);font-size:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-footer)}
.sg.on{border-color:var(--warning);color:#9A7424}
.q-item.cur .sg{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.4)}
.q-item.cur .sg.on{border-color:#fff;color:#fff}
.q-item.dup{margin-left:20px}
#filters{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.fchip{height:20px;padding:0 7px;border-radius:10px;border:1px solid var(--bg-grid);background:var(--bg-base);font-family:var(--mono);font-size:9.5px;letter-spacing:-0.03em;color:var(--text-sub);cursor:pointer;
  transition:transform .24s var(--ease),border-color .2s}
.fchip:hover{transform:translateY(-2px);border-color:var(--primary)}
.fchip.on{background:var(--grad);color:#fff;border-color:transparent}
.done-banner{margin:10px 8px 2px;padding:10px 12px;border-radius:8px;border:1px solid var(--success);font-size:12px;color:var(--success);background:var(--surface-solid)}

/* 가운데: 본문 */
.c-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.c-head h1{margin:0;font-size:18px;letter-spacing:-0.048em}
.c-meta{font-size:11.5px;color:var(--text-sub);margin-top:5px}
.c-path{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.warn-note{margin:14px 18px 0;padding:8px 12px;border:1px solid var(--warning);border-radius:8px;font-size:12px;color:#9A7424;background:var(--surface-solid)}
.body-text{white-space:pre-wrap;line-height:1.85;font-size:14.5px;padding:16px 18px 6px;word-break:keep-all}
.body-text::selection,.body-text *::selection{background:rgba(74,95,168,.3)}
.q{background:rgba(74,95,168,.09);border-radius:3px;transition:background .24s,box-shadow .24s}
.q.q-active{background:rgba(74,95,168,.25);box-shadow:0 0 0 1px var(--primary)}
.syn{border-bottom:1.5px dotted var(--primary-mid)}
.reg{border-bottom:1.5px solid var(--success)}
[data-std]::after{content:"→ " attr(data-std);font-family:var(--mono);font-size:10px;letter-spacing:-0.03em;color:var(--primary);background:var(--bg-base);border:.8px solid var(--bg-grid);border-radius:10px;padding:1px 6px;margin-left:4px;white-space:nowrap;user-select:none}
.reg[data-std]::after{color:var(--success);border-color:var(--success)}
.tag{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.hint{padding:0 18px 12px;font-size:11px;color:var(--text-muted)}
.blk{padding:12px 18px;border-top:1px solid rgba(200,212,228,.6)}
.blk-t{font-size:11px;color:var(--text-sub);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumb{border:1px solid var(--bg-grid);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--surface-solid);padding:0;display:block;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .2s}
.thumb:hover{transform:translateY(-4px) scale(1.02);border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.16)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.xt{width:100%;border-collapse:collapse;font-size:12.5px}
.xt td{padding:5px 8px 5px 0;vertical-align:top}
.xt td:first-child{color:var(--text-sub);white-space:nowrap;width:60px}
.xt .src{color:var(--text-muted);font-size:11px}
.regs{display:flex;flex-wrap:wrap;gap:6px}
.regchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:12px;border:1px solid var(--success);font-size:12px;background:var(--surface-solid)}
.regchip button{border:0;background:transparent;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0 6px}
.regchip button:hover{color:var(--danger)}

/* 오른쪽: 판정 항목 */
.sec{padding:10px 14px 6px;font-size:11px;color:var(--text-sub);background:rgba(237,241,247,.65);border-bottom:1px solid rgba(200,212,228,.6);position:sticky;top:0;z-index:2;display:flex;justify-content:space-between}
.item{padding:10px 14px 10px 11px;border-bottom:1px solid rgba(200,212,228,.6);border-left:3px solid transparent;cursor:pointer;transition:background .2s}
.item:hover{background:rgba(74,95,168,.04)}
.item.focus{border-left-color:var(--primary);background:rgba(74,95,168,.08)}
.item.inactive{cursor:default;opacity:.6}
.item-h{display:flex;align-items:center;gap:8px}
.item-h b{font-size:13px}
.st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bg-grid);display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;flex:none;color:var(--text-muted);font-weight:700}
.st.confirmed{border-color:var(--success);color:var(--success)}
.st.corrected{border-color:var(--primary);color:var(--primary)}
.st.undecidable{border-color:var(--warning);color:#9A7424}
.conf{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);margin-left:auto}
.conf.low{color:#9A7424}
.vtxt{font-size:10.5px;color:var(--text-muted)}
.vtxt.confirmed{color:var(--success)}.vtxt.corrected{color:var(--primary)}.vtxt.undecidable{color:#9A7424}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0 26px;align-items:center}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--bg-grid);background:var(--surface-solid);font-size:12px}
.chip.na{border-style:dashed;color:var(--text-sub)}
.chip.unk{border-color:var(--warning);color:#9A7424}
.chip.human{border-color:var(--primary);color:var(--primary);font-weight:700}
.old{font-size:11.5px;color:var(--text-muted);text-decoration:line-through;margin-right:2px}
.arrow{color:var(--text-muted);font-size:11px}
.qtext{margin:6px 0 0 26px;font-size:12.5px;line-height:1.55;color:var(--text-strong)}
.qid{font-family:var(--mono);font-size:10.5px;color:var(--primary)}
.ev{margin:6px 0 0 26px;font-size:11.5px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.miss{white-space:normal}
.remap{margin:4px 0 0 26px;font-size:11px;color:var(--text-muted)}
.defs{margin:8px 0 0 26px;padding:7px 10px;border-radius:8px;border:1px solid rgba(200,212,228,.8);background:rgba(237,241,247,.7);font-size:11.5px;line-height:1.6;color:var(--text-sub)}
.defs b{color:var(--text-strong)}
.acts{display:flex;gap:6px;margin:9px 0 0 26px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--bg-grid);border-radius:8px;overflow:hidden;background:var(--surface-solid)}
.seg button{border:0;background:transparent;font:inherit;letter-spacing:inherit;color:var(--text-strong);height:26px;min-width:44px;padding:0 10px;cursor:pointer;border-right:1px solid var(--bg-grid);position:relative;transition:background .2s}
.seg button:last-child{border-right:0}
.seg button:hover{background:rgba(74,95,168,.1)}
.seg button.bot::after{content:"봇";position:absolute;top:1px;right:3px;font-size:8px;color:var(--text-muted)}
.seg button.sel{background:var(--grad);color:#fff;font-weight:700}
.seg button.sel.bot::after{color:rgba(255,255,255,.75)}
.editor{margin:9px 0 0 26px;padding:10px;border:1px solid var(--primary);border-radius:8px;background:rgba(237,241,247,.92);cursor:default}
.rule{font-size:11.5px;color:var(--text-sub);line-height:1.55;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.opt{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 5px;border-radius:13px;border:1px solid var(--bg-grid);background:var(--surface-solid);font:inherit;font-size:12px;letter-spacing:inherit;color:var(--text-strong);cursor:pointer;
  transition:transform .24s var(--ease),border-color .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--primary)}
.opt.child{margin-left:2px}
.opt.child::before{content:"›";color:var(--text-muted);margin-left:3px}
.opt.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
.opt.on kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.opt.st-na{border-style:dashed}
.opt.st-unk{border-color:var(--warning)}
.def{min-height:34px;font-size:11.5px;line-height:1.55;color:var(--text-sub);padding:6px 0 2px}
.ed-act{display:flex;gap:6px;align-items:center;margin-top:6px}
.ed-act .cap{margin-right:auto}
#nextBtn.focus{box-shadow:0 0 0 3px rgba(74,95,168,.3),0 8px 20px rgba(53,70,144,.22)}

/* 떠 있는 요소 */
.pop{position:fixed;z-index:30;width:300px;max-height:340px;display:none;flex-direction:column;background:var(--surface-solid);border:1px solid var(--primary);border-radius:12px;box-shadow:0 8px 20px rgba(53,70,144,.2);overflow:hidden}
.pop.open{display:flex;animation:popIn .28s var(--ease)}
.pop-h{padding:10px 12px 8px;border-bottom:1px solid var(--bg-grid);font-size:12.5px}
.pop-h input{width:100%;margin-top:8px;height:28px;border-radius:8px;border:1px solid var(--bg-grid);background:var(--bg-base);padding:0 9px;font:inherit;letter-spacing:inherit;color:var(--text-strong);outline:none}
.pop-h input:focus{border-color:var(--primary)}
.pop-b{overflow:auto;padding:6px 8px 10px}
.pop-g{font-size:10.5px;color:var(--text-muted);padding:8px 4px 4px}
.pop-b .opt{margin:0 4px 5px 0;padding:0 9px}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,45,74,.36);display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--surface-solid);border:1px solid var(--bg-grid);border-radius:12px;box-shadow:0 8px 20px rgba(53,70,144,.2);animation:popIn .3s var(--ease)}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--bg-grid);display:flex;align-items:center}
.modal-h h2{margin:0;font-size:15px;letter-spacing:-0.048em;flex:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-b textarea{width:100%;height:320px;border:1px solid var(--bg-grid);border-radius:8px;background:var(--bg-base);font-family:var(--mono);font-size:11.5px;letter-spacing:-0.03em;color:var(--text-strong);padding:10px;resize:vertical;outline:none}
.keys{width:100%;border-collapse:collapse;font-size:12.5px}
.keys td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(200,212,228,.6)}
.keys td:first-child{white-space:nowrap;width:150px}
.modal-f{padding:12px 16px;border-top:1px solid var(--bg-grid);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.lightbox img{max-width:min(880px,92vw);max-height:86vh;border-radius:12px;border:1px solid var(--bg-grid);box-shadow:0 8px 20px rgba(53,70,144,.3);animation:popIn .3s var(--ease);cursor:zoom-out}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:50;background:var(--text-strong);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .24s,transform .28s var(--ease)}
#toast.show{opacity:.94;transform:translate(-50%,0)}

@media (max-width:1240px){.main{grid-template-columns:228px minmax(0,1fr) 372px}}
@media (max-width:960px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .pane{max-height:80vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <header class="top">
    <div><span class="logo">BEOL AX</span><span class="sub">검수 화면</span></div>
    <span class="badge mono" id="runBadge" title="검수 기준 실행 ID"></span>
    <span class="badge" id="mockBadge"></span>
    <div class="prog"><div class="prog-bar"><i id="progFill"></i></div><span id="progTxt" class="mono"></span></div>
    <div class="spacer" style="flex:1 1 0"></div>
    <span id="saveTxt" class="cap"></span>
    <button class="btn ghost" data-act="reset" title="목업 진행 상황을 지웁니다">초기화</button>
    <button class="btn" data-act="fx">배경 효과 <b id="fxTxt">켜짐</b> <kbd>B</kbd></button>
    <button class="btn" data-act="help">단축키 <kbd>?</kbd></button>
    <button class="btn" data-act="copy">텍스트로 복사</button>
    <button class="btn primary" data-act="download">교정 파일 내려받기</button>
  </header>
  <div class="main">
    <section class="pane">
      <div class="pane-h"><h2>불량 목록</h2><div class="cap" style="margin-top:4px">사유 코드가 많이 겹친 순 · 상한 없이 전부</div><div id="filters"></div></div>
      <div class="pane-b" id="queue"></div>
      <div class="pane-f cap"><span class="sg on">U</span>unknown <span class="sg on">C</span>확신도 <span class="sg on">Q</span>인용 <span class="sg on">P</span>파싱 <span class="sg on">F</span>분류 실패 <span class="sg on">L</span>라벨 실패</div>
    </section>
    <section class="pane">
      <div class="pane-h c-head" id="cHead"></div>
      <div class="pane-b" id="center"></div>
    </section>
    <section class="pane">
      <div class="pane-h"><h2>판정 항목</h2><div class="cap" style="margin-top:4px">축과 질문마다 확인 · 교정 · 판단 불가를 기록합니다</div></div>
      <div class="pane-b" id="labels"></div>
      <div class="pane-f">

  function frame(){raf=0;if(!on){ctx.clearRect(0,0,W,H);return;}var moving=false,near=[],i,j,d,dx,dy,dist;
    for(i=0;i<dots.length;i++){d=dots[i];dx=d.x-mx;dy=d.y-my;dist=Math.sqrt(dx*dx+dy*dy)||.001;
      if(dist<140){var f=(1-dist/140)*38*.07;d.vx+=dx/dist*f;d.vy+=dy/dist*f;}
      d.vx+=(d.ox-d.x)*.09;d.vy+=(d.oy-d.y)*.09;d.vx*=.78;d.vy*=.78;d.x+=d.vx;d.y+=d.vy;
      if(Math.abs(d.vx)+Math.abs(d.vy)>.03)moving=true;if(dist<110)near.push({d:d,r:dist});}
    ctx.clearRect(0,0,W,H);
    for(i=trail.length-1;i>=0;i--){if(--trail[i].life<=0)trail.splice(i,1);}
    ctx.lineCap='round';
    for(i=1;i<trail.length;i++){var a=trail[i-1],b=trail[i],k=b.life/28;ctx.strokeStyle='rgba(90,130,190,'+(k*.34)+')';ctx.lineWidth=.6+k*2.2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    ctx.lineWidth=.8;
    for(i=0;i<near.length;i++)for(j=i+1;j<near.length;j++){dx=near[i].d.x-near[j].d.x;dy=near[i].d.y-near[j].d.y;if(dx*dx+dy*dy<76*76){
      ctx.strokeStyle='rgba(122,156,192,'+((1-Math.max(near[i].r,near[j].r)/110)*.7)+')';ctx.beginPath();ctx.moveTo(near[i].d.x,near[i].d.y);ctx.lineTo(near[j].d.x,near[j].d.y);ctx.stroke();}}
    for(i=0;i<dots.length;i++){d=dots[i];var disp=Math.abs(d.x-d.ox)+Math.abs(d.y-d.oy);ctx.fillStyle='rgba(168,189,212,'+Math.min(1,.6+disp/26)+')';ctx.beginPath();ctx.arc(d.x,d.y,1.4+Math.min(disp/9,2),0,6.2832);ctx.fill();}
    if(moving||trail.length)kick();}
  function kick(){if(!raf)raf=requestAnimationFrame(frame);}
  window.addEventListener('resize',resize);
  window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;if(on){trail.push({x:mx,y:my,life:28});if(trail.length>40)trail.shift();}kick();});
  document.addEventListener('mouseleave',function(){mx=my=-9999;kick();});
  return {init:resize,set:function(v){on=v;trail=[];kick();}};})();

/* ───────── 시작 ───────── */
load();$('#runBadge').textContent=RUN_ID;$('#mockBadge').textContent='목업 · 불량 목록 '+CHUNKS.length+'건';fx.init();fx.set(state.fx);go(state.cur);
})();
