<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain-Engr-bot 질문 화면</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --surface:#F6F8FC; --surface-2:#E4EAF3;
  --text-strong:#1E2D4A; --text-muted:#6F7F99;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --radius-sm:8px; --radius:12px;
  --font:'Apple SD Gothic Neo','Noto Sans KR','Inter',sans-serif;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13.5px;line-height:1.55;letter-spacing:-0.02em;color:var(--text-strong);background:var(--bg-base)}
h1,h2,h3,h4{margin:0;font-weight:700}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-0.01em}
.muted{color:var(--text-muted)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--bg-grid);flex-wrap:wrap}
.bar h1{font-size:18px;letter-spacing:-0.055em}
.bar .meta{font-size:11.5px;color:var(--text-muted)}
.bar .sp{flex:1}
.bar input{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--surface);width:150px}
.progress{font-size:12px;font-weight:700;border:1px solid var(--primary);color:var(--primary-deep);border-radius:999px;padding:1px 10px}
.cols{display:grid;grid-template-columns:340px 1fr;min-height:0}
.list{border-right:1px solid var(--bg-grid);display:flex;flex-direction:column;min-height:0}
.listhead{padding:10px 12px;border-bottom:1px solid var(--bg-grid);font-size:11.5px;color:var(--text-muted)}
.items{overflow:auto;padding:8px 10px 30px;flex:1}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px;margin:4px 0;cursor:pointer}
.item.on{border-color:var(--primary);box-shadow:0 5px 16px rgba(53,70,144,.14)}
.item .l1{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-muted)}
.item .l1 .sp{flex:1}
.item .l2{font-weight:700;font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank{font-family:var(--mono);font-weight:700;color:var(--primary-deep)}
.goal{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;border:1px solid var(--primary);color:var(--primary)}
.goal.taxonomy{border-color:var(--success);color:var(--success)}
.carry{font-size:10.5px;border:1px dashed var(--warning);color:#A97C1F;border-radius:5px;padding:0 6px}
.reopen{font-size:10.5px;border:1px solid var(--danger);color:var(--danger);border-radius:5px;padding:0 6px}
.st{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid var(--bg-grid);color:var(--text-muted)}
.st.answered{border-color:var(--success);color:var(--success)}
.st.skip{border-color:var(--warning);color:#A97C1F}
.st.dismiss{border-color:var(--text-muted);color:var(--text-muted);text-decoration:line-through}
.detail{overflow:auto;min-height:0;padding:18px 24px 60px}
.dh .tagline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted)}
.qtext{font-size:20px;letter-spacing:-0.05em;line-height:1.45;margin:6px 0 4px;word-break:break-word}
.topic{font-size:12px;color:var(--text-muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--bg-grid);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .small{font-size:11.5px;font-weight:400}
.why{white-space:pre-wrap;word-break:break-word}
.impact{font-size:12.5px;margin-top:6px}
.impact b{font-family:var(--mono)}
.pat{border-top:1px dashed var(--bg-grid);padding:6px 0;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.pat:first-of-type{border-top:0}
.tag{font-family:var(--mono);font-size:10px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.tag.warn{border-color:var(--danger);color:var(--danger)}
.evcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;border-top:1px dashed var(--bg-grid);padding:10px 0}
.evcard:first-of-type{border-top:0;padding-top:2px}
.evh{font-size:11.5px;color:var(--text-muted);word-break:break-all;margin-bottom:4px}
.slideprev{display:block;width:100%;max-height:150px;object-fit:contain;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in}
.noprev{height:96px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm)}
.fh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fh b{font-size:13px}
.badge{font-size:10px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.badge.corrected{border-color:var(--warning);color:#A97C1F}
.vals{margin:4px 0;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.v{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;border:1px solid var(--bg-grid);background:transparent;color:var(--text-muted)}
.v.bot{text-decoration:line-through}
.v.human{border-color:var(--primary);background:rgba(74,95,168,.12);color:var(--primary-deep)}
.arrow{color:var(--text-muted)}
.ev{font-size:12px;border-left:2px solid var(--warning);padding-left:8px;margin:4px 0;word-break:break-word}
.ev .tag{margin-right:6px}
.reason{font-size:12px;margin-top:4px;word-break:break-word}
.exb{display:inline-block;margin-top:5px;font-size:11px;color:var(--success);border:1px solid var(--success);border-radius:5px;padding:0 6px}
.rv{font-size:12px;border-top:1px dashed var(--bg-grid);padding:5px 0;word-break:break-word}
.rv:first-of-type{border-top:0}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:7px 10px;margin:6px 0;cursor:pointer;background:var(--bg-base)}
.opt.on{border-color:var(--primary);background:rgba(74,95,168,.08)}
.opt input{margin-top:3px}
.opt .on-label{font-weight:700}
.opt .n{font-size:11px;color:var(--text-muted);margin-left:6px}
.free{margin:4px 0 6px 24px;display:flex;flex-direction:column;gap:6px}
.card textarea,.card input[type=text],.card select{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);width:100%}
.card textarea{resize:vertical}
.free textarea{height:90px}
.cnt{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);text-align:right}
.cnt.over{color:var(--danger);font-weight:700}
.draft{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:8px 10px;margin:8px 0;background:var(--bg-base)}
.draft.off{opacity:.55}
.exgroup{margin-top:12px;border-top:1px dashed var(--bg-grid);padding-top:8px}
.exgroup h4{font-size:12.5px;color:var(--success)}
.draft .dh2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.draft .dh2 label{display:flex;gap:6px;align-items:center;font-weight:700;cursor:pointer}
.draft .dh2 .sp{flex:1}
.origin{font-size:10.5px;border:1px solid var(--bg-grid);border-radius:999px;padding:0 7px;color:var(--text-muted)}
.origin.edited{border-color:var(--warning);color:#A97C1F}
.origin.human{border-color:var(--primary);color:var(--primary)}
.lockline{font-size:11.5px;color:var(--primary-deep);background:rgba(74,95,168,.1);border-radius:6px;padding:2px 8px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.fld{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:11.5px}
.fld .lb{color:var(--text-muted)}
.fld .lb b{color:var(--danger);font-weight:700;margin-left:2px}
.prob{font-size:11.5px;color:var(--danger);margin-top:4px}
.btn{border:1px solid var(--bg-grid);background:var(--surface);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-weight:700;font-size:12.5px}
.btn.primary{background:var(--primary-deep);color:#EDF1F7;border-color:var(--primary-deep)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:default}
.preview{border:1px solid var(--primary);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface);margin-bottom:8px}
.preview .pvh{font-size:12px;font-weight:700;color:var(--primary-deep);margin-bottom:4px}
.preview .pvi{font-size:12px;padding:3px 0;border-top:1px dashed var(--bg-grid);word-break:break-word}
.preview .pvi:first-of-type{border-top:0}
.preview .pvi.bad{color:var(--danger)}
.preview .pvi .tag{margin-right:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--text-muted)}
.hint.warn{color:#A97C1F;margin-top:6px}
.banner{border:1px solid var(--success);border-radius:var(--radius);padding:10px 14px;background:rgba(59,138,110,.08);margin-bottom:14px}
.banner.skip{border-color:var(--warning);background:rgba(201,154,59,.08)}
.banner.dismiss{border-color:var(--text-muted);background:var(--surface-2)}
.banner h3{font-size:14px;margin-bottom:6px}
.note{font-size:12px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm);padding:5px 9px;margin-bottom:8px}
.emptystate{max-width:520px;margin:14vh auto;text-align:center;color:var(--text-muted)}
dialog{border:1px solid var(--bg-grid);border-radius:var(--radius);background:var(--surface);width:min(640px,92vw);padding:18px}
dialog textarea{width:100%;height:240px;font-family:var(--mono);font-size:12px}
.zoom{position:fixed;inset:0;background:rgba(30,45,74,.7);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:92vw;max-height:92vh;background:var(--bg-base)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text-strong);color:#EDF1F7;padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;opacity:0;pointer-events:none;z-index:60;max-width:480px}
.toast.on{opacity:1}
.donesum{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.donesum span{font-size:12px;border:1px solid var(--bg-grid);border-radius:999px;padding:1px 10px;background:var(--bg-base)}
.donesum span.w{border-color:var(--warning);color:#A97C1F}
ol.next{margin:8px 0 0 18px;font-size:13px;line-height:1.7}
ol.next li{margin-bottom:4px}
.manual{margin-top:8px;font-size:12px}
.manual summary{cursor:pointer;color:var(--primary)}
.manual pre{white-space:pre-wrap;word-break:break-all;background:var(--bg-base);border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:8px;margin-top:6px;font-size:11.5px}
.applied{margin-top:4px}
.applied p.warn{color:#A97C1F;font-size:13px;margin:6px 0}
.donetag{font-size:11.5px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:999px;padding:1px 9px;background:transparent;cursor:pointer}
@media (max-width:1180px){ .two{grid-template-columns:1fr} }
@media (max-width:860px){ .app{height:auto} .cols{grid-template-columns:1fr} .items{max-height:260px} .evcard{grid-template-columns:1fr} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="root"></div>
<div class="zoom" id="zoom" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <h3>답 JSON 텍스트</h3>
  <p id="dlgP" class="muted"></p>
  <textarea id="dlgTa" readonly aria-label="답 JSON"></textarea>
  <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="dlgSel" type="button">전체 선택</button>
    <button class="btn primary" id="dlgClose" type="button">닫기</button>
  </div>
</dialog>
<dialog id="doneDlg" aria-labelledby="doneH">
  <h3 id="doneH">답변 완료 · 다음 단계</h3>
  <p id="doneFile" class="muted"></p>
  <div id="doneSum" class="donesum"></div>
  <div id="doneApplied" class="applied" hidden></div>
  <ol class="next" id="doneNext">
    <li>Claude에게 <b>"질문 답변 끝났어"</b>라고 알려 주세요. <button class="btn sm" id="donePhrase" type="button">문구 복사</button></li>
    <li id="doneMove"></li>
    <li>확정한 초안만 라벨링 규칙과 taxonomy 수정 보드에 반영하고 건수를 알려 줍니다. 손대지 않은 질문과 '나중에'는 다음에 다시 올라옵니다.</li>
  </ol>
  <details class="manual" id="doneManual"><summary>Claude 없이 직접 하려면</summary><pre id="doneCmd" class="mono"></pre></details>
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="doneAgain" type="button">다시 저장</button>
    <button class="btn primary" id="doneClose" type="button">닫기</button>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;

(function(){
  "use strict";
  var root = document.getElementById("root");

  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
  }

  if (!DATA || DATA.kind !== "engr_questions_screen"){
    root.appendChild(h("div", {class:"emptystate"}, [
      h("h2", {text:"표시할 데이터가 없습니다"}),
      h("p", {text:"이 화면은 Domain-Engr-bot questions 명령이 질문 묶음을 채워 넣은 뒤에 사용합니다."})
    ]));
    return;
  }

  var QS = DATA.questions || [];
  var byId = {};
  QS.forEach(function(q){ byId[q.question_id] = q; });
  var LIM = DATA.limits || {};
  var AXES = DATA.axes || [];
  var AXIS_NAMES = AXES.map(function(a){ return a.name; });
  var REQ = DATA.tax_required || {};
  var ANSWERS_NAME = DATA.answers_name;
  // questions serve로 열었으면 답을 서버에 보내 작업 폴더 qa/inbox/에 바로 쓴다. 파일로 열었으면 내려받는다.
  var SERVED = location.protocol !== "file:";
  var DRAFT_ON = false;   // 서버가 자유 답 초안 기능을 켰는가(GET inbox/status의 draft)
  var APPLY_ON = false;   // 서버가 저장하자마자 반영하는가(GET inbox/status의 apply). 반영하면 서버는 닫힌다

  var GOAL = {labeling:"라벨링", taxonomy:"taxonomy"};
  var STATUS = {answered:"답함", skip:"나중에", dismiss:"묻지 않음"};
  var STAGE = {classify:"1차 분류", label:"3차 라벨링"};
  var TAX_KIND = {value_add:"새 값", value_def:"값 정의 보완", axis_def:"축 정의 보완", overlap:"겹치는 값", value_off:"값 끄기",
                  new_axis:"새 축", synonym:"동의어", q_edit:"질문 문장 수정", q_new:"새 질문"};
  // taxonomy kind마다 쓰는 칸(qmodel.TAX_FIELDS). 이 칸만 보여 주고 편집하고 내보낸다(보이지 않는 칸은 확정하지 않는다).
  var TAX_FIELDS = DATA.tax_fields || {};
  var FIELD_LABEL = {axis:"축", value:"값", parent:"상위 값", name:"새 축 이름", alias:"동의어(바꿔 쓰는 말)", canonical:"표준어(taxonomy 값)",
                     qid:"질문 ID", text:"질문 문장", definition:"정의", include:"포함 기준", exclude:"제외 기준", memo:"메모", values:"겹치는 두 값"};
  var NAME_KEYS = ["axis","value","parent","name","alias","canonical","qid"];
  var LONG_KEYS = ["text","definition","include","exclude"];
  var EV_KIND = {chunk_same:"같은 슬라이드", chunk_other:"다른 슬라이드", file_name:"파일 이름", doc_title:"문서 제목", typed:"직접 입력"};
  var ORIGIN = {llm:"LLM 초안", edited:"사람이 고침", human:"직접 씀"};
  var TOPIC = {axis_value:"축 값", axis:"축", question:"질문", term:"용어", general:"일반"};

  // ---------- 상태(브라우저 자동 저장) ----------
  var KEY = "engrbot_questions_" + DATA.set_id;
  var st = {reviewer:"", q:{}};
  var selId = QS.length ? QS[0].question_id : null, renderedSel = null;
  var busy = {};   // 초안 만드는 중인 질문(저장하지 않는다)
  var refs = {};   // 다시 그리지 않고 고칠 요소(입력 중 포커스를 잃지 않게)
  function load(){
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o.q === "object" && o.q) st.q = o.q;
      if (o && typeof o.reviewer === "string") st.reviewer = o.reviewer;
      if (o && typeof o.completedAt === "string") st.completedAt = o.completedAt;
      if (o && typeof o.savedTo === "string") st.savedTo = o.savedTo;
      if (o && o.apply && typeof o.apply === "object") st.apply = o.apply;
    } catch(e){}
  }
  var saveT = null;
  function save(){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){}
    }, 150);
  }
  load();
  function qs(id){
    var s = st.q[id];
    if (!s || typeof s !== "object") s = st.q[id] = {};
    if (!s.sets || typeof s.sets !== "object") s.sets = {};
    if (typeof s.free !== "string") s.free = "";
    return s;
  }

  // ---------- 초안 도우미 ----------
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function collapse(t){ return String(t === null || t === undefined ? "" : t).replace(/\s+/g, " ").trim(); }
  function hasMark(t){ return t.indexOf("{{") >= 0 || t.indexOf("}}") >= 0; }
  function topicAxis(q){
    var a = (q.topic || {}).axis || "";
    return !AXIS_NAMES.length || AXIS_NAMES.indexOf(a) >= 0 ? a : "";
  }
  function optionOf(q, id){ return (q.options || []).filter(function(o){ return o.option_id === id; })[0] || null; }
  function autoRule(q, text){ return {type:"rule", stage:"classify", target:topicAxis(q), text:collapse(text)}; }
  // 질문의 few-shot 사례 후보(EX-)는 어느 답에도 example 초안으로 올린다(기본 켜짐).
  function withExamples(q, items){
    var have = {};
    items.forEach(function(it){ if (it.draft.type === "example") have[it.draft.example_id] = true; });
    (q.examples || []).forEach(function(e){
      if (!have[e.example_id]) items.push({draft:{type:"example", example_id:e.example_id}, on:true, origin:"llm"});
    });
    return items;
  }
  function ensureSet(q, s, key){
    if (s.sets[key]) return s.sets[key];
    var items;
    if (key === "FREE") items = DRAFT_ON ? [] : [{draft:autoRule(q, s.free), on:true, origin:"human", auto:true}];
    else items = ((optionOf(q, key) || {}).drafts || []).map(function(d){ return {draft:clone(d), on:true, origin:"llm"}; });
    s.sets[key] = withExamples(q, items);
    return s.sets[key];
  }
  // 화면에서 미리 보는 형식 검사. qmodel.clean_text·check_draft와 같은 기준이다(반영할 때 answers가 다시 검증한다).
  // 금지 글자: 줄바꿈·탭 밖의 제어 문자, 폭 없는 문자(U+200B~200F), 방향 제어 문자(U+202A~202E, U+2066~2069).
  var BAD_TEXT = /[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/;
  // 칸 하나 → 문제 문장 또는 "". need면 비어 있으면 안 된다.
  function textProblem(raw, lim, label, need){
    var s = raw === null || raw === undefined ? "" : String(raw);
    if (BAD_TEXT.test(s)) return label + " 칸에 쓸 수 없는 글자(제어 문자 · 폭 없는 문자 · 방향 제어 문자)가 있습니다";
    var t = collapse(s);
    if (!t) return need ? label + " 칸을 채우세요" : "";
    if (t.length > lim) return label + " 칸이 " + lim + "자를 넘습니다";
    if (hasMark(t)) return label + " 칸에 {{ }} 표식을 쓸 수 없습니다";
    return "";
  }
  function fieldLimit(k){ return NAME_KEYS.indexOf(k) >= 0 || k === "values" ? LIM.name : k === "memo" ? LIM.memo : LIM.long; }
  // 규칙 범위: 1차(classify)는 축 이름, 3차(label)는 "축=값" 또는 질문 ID. 없으면 반영 때 RULE_SCOPE_MISSING으로 거부된다.
  function scopeProblem(d){
    var t = collapse(d.target);
    if (d.stage === "label"){
      var m = t.match(/^([^=]+)=(.+)$/);
      if (/^Q-[A-Za-z0-9_-]{1,60}$/.test(t) || (m && (!AXIS_NAMES.length || AXIS_NAMES.indexOf(collapse(m[1])) >= 0))) return "";
      return "대상 범위를 '축=값' 또는 질문 ID(Q-…)로 쓰세요";
    }
    return t && (!AXIS_NAMES.length || AXIS_NAMES.indexOf(t) >= 0) ? "" : "대상 축을 고르세요";
  }
  // 문제가 있으면 문장, 없으면 "". 문제 있는 초안은 확정 건수에서 빠지고 확정 버튼을 막는다.
  function draftProblem(d){
    if (d.type === "rule"){
      return textProblem(d.text, LIM.rule_text, "규칙 문장", true) || textProblem(d.target, LIM.name, "대상 축", false) || scopeProblem(d);
    }
    if (d.type === "example") return /^EX-[0-9a-f]{12}$/.test(d.example_id || "") ? "" : "사례 ID가 맞지 않습니다";
    if (d.type === "taxonomy"){
      var req = REQ[d.kind], fields = TAX_FIELDS[d.kind];
      if (!req || !fields) return "모르는 taxonomy 종류입니다";
      for (var i = 0; i < fields.length; i++){
        var k = fields[i], p;
        if (k === "values"){
          var vs = Array.isArray(d.values) ? d.values : [];
          for (var m = 0; m < vs.length; m++){ p = textProblem(vs[m], LIM.name, FIELD_LABEL.values, false); if (p) return p; }
          if (req.indexOf("values") >= 0 && vs.map(collapse).filter(Boolean).length !== 2) return "겹치는 두 값을 모두 적으세요";
        } else {
          p = textProblem(d[k], fieldLimit(k), FIELD_LABEL[k] || k, req.indexOf(k) >= 0);
          if (p) return p;
        }
      }
      return "";
    }
    return "모르는 초안입니다";
  }
  // 확정할 때 답 파일에 넣는 꼴(qmodel 4.2절 + origin)
  function finalDraft(it){
    var d = it.draft, out;
    if (d.type === "rule"){
      out = {type:"rule", stage:d.stage === "label" ? "label" : "classify", target:collapse(d.target), text:collapse(d.text)};
      if (d.pattern_id) out.pattern_id = d.pattern_id;
    } else if (d.type === "example"){
      out = {type:"example", example_id:d.example_id};
    } else {
      // 그 kind가 쓰는 칸만 내보낸다(나머지는 비운다: 사람이 보지 못한 문장을 확정하지 않는다).
      var allow = TAX_FIELDS[d.kind] || [];
      out = {type:"taxonomy", kind:d.kind};
      NAME_KEYS.concat(LONG_KEYS, ["memo"]).forEach(function(k){ out[k] = allow.indexOf(k) >= 0 ? collapse(d[k]) : ""; });
      out.values = allow.indexOf("values") >= 0 ? (d.values || []).map(collapse).filter(Boolean) : [];
    }
    out.origin = ORIGIN[it.origin] ? it.origin : "llm";
    return out;
  }
  function typeLabel(d){
    if (d.type === "rule") return "규칙";
    if (d.type === "example") return "few-shot";
    return "taxonomy · " + (TAX_KIND[d.kind] || d.kind);
  }
  function draftSummary(d){
    if (d.type === "rule"){
      return STAGE[d.stage === "label" ? "label" : "classify"] + (collapse(d.target) ? " · " + collapse(d.target) : "") +
        (d.pattern_id ? " · " + d.pattern_id : "") + " — " + collapse(d.text);
    }
    if (d.type === "example") return "사례 " + d.example_id + "를 few-shot 예시로 씀";
    var parts = [];
    (TAX_FIELDS[d.kind] || []).forEach(function(k){
      var v = k === "values" ? (d.values || []).map(collapse).filter(Boolean).join(", ") : collapse(d[k]);
      if (v) parts.push(FIELD_LABEL[k] + ": " + v);
    });
    return parts.join(" · ");
  }

  // ---------- 답 파일(4.3절 형식) ----------
  function buildOutput(){
    var answers = [];
    QS.forEach(function(q){
      var s = st.q[q.question_id];
      if (!s || !s.status) return;
      if (s.status === "answered" && s.answer){
        answers.push({question_id:q.question_id, action:"answer", option_id:s.answer.option_id, option_label:s.answer.option_label,
                      free_text:s.answer.free_text, confirmed:s.answer.confirmed});
      } else if (s.status === "dismiss" || s.status === "skip"){
        answers.push({question_id:q.question_id, action:s.status});
      }
    });
    return {kind:DATA.answers_kind, set_id:DATA.set_id, reviewer:st.reviewer || "", answers:answers};
  }
  function counts(){
    var n = {answered:0, dismiss:0, skip:0, open:0};
    QS.forEach(function(q){ var s = st.q[q.question_id] || {}; n[STATUS[s.status] ? s.status : "open"] += 1; });
    return n;
  }
  // done(where): "inbox"(작업 폴더에 저장) · "download"(내려받기 시작) · null(둘 다 막혀 텍스트 창을 띄움).
  function saveAnswers(done){
    var text = JSON.stringify(buildOutput(), null, 2);
    if (!SERVED){ done(download(text) ? "download" : null); return; }
    function fail(code){
      toast("작업 폴더 저장 실패(" + code + "). 내려받기로 저장합니다");
      done(download(text) ? "download" : null);
    }
    try {
      fetch("inbox/engr_answers", {method:"POST", headers:{"Content-Type":"application/json"}, body:text})
        .then(function(res){ return res.json().then(function(j){ return {ok:res.ok && j && j.ok, j:j || {}}; }); })
        .then(function(x){
          if (x.j.code === "ALREADY_APPLIED" || x.j.code === "APPLY_BUSY"){
            toast(x.j.code === "APPLY_BUSY" ? "반영하는 중입니다. 잠시 뒤 결과가 나옵니다" : "이미 반영했습니다");
            return;
          }
          if (!x.ok) return fail(x.j.code || "SAVE_FAILED");
          if (x.j.applied) toast("저장하고 반영했습니다");
          else if (x.j.apply_code) toast("저장했지만 반영하지 못했습니다(" + x.j.apply_code + ")");
          else toast("작업 폴더 qa/inbox/에 " + ANSWERS_NAME + " 를 저장했습니다");
          done("inbox", x.j);
        }, function(){ fail("SERVER_UNREACHABLE"); });
    } catch(e){ fail("SERVER_UNREACHABLE"); }
  }
  // 반환: 내려받기를 시작했으면 true. 막히면 텍스트 창을 띄우고 false.
  function download(text){
    try {
      var blob = new Blob([text], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = ANSWERS_NAME;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast(ANSWERS_NAME + " 내려받기를 시작했습니다");
      return true;
    } catch(e){
      showText(text, "내려받기가 막혔습니다. 아래 텍스트를 복사해 Claude에게 붙여 넣고 \"질문 답변 끝났어\"라고 알려 주세요.");
      return false;
    }
  }
  // 서버로 반영 결과를 받으면 건수·코드만 기억한다(답 문장은 이미 st.q에 있다).
  function keepApply(j){
    if (!j || !(j.applied || j.apply_code)) { delete st.apply; return; }
    st.apply = {applied:!!j.applied, code:j.apply_code || null, result:j.apply || {}, board:j.board || null};
    if (j.applied) APPLY_ON = false;   // 서버가 닫힌다. 다시 누르면 저장하지 않고 결과만 다시 보여 준다
  }
  function complete(){
    if (st.apply && st.apply.applied && !APPLY_ON){ openDone(); return; }   // 반영을 마쳐 서버가 닫혔다
    var left = counts().open;
    var msg = APPLY_ON
      ? "답을 저장하고 바로 반영합니다(확정한 규칙·사례는 라벨링 규칙에, taxonomy 행은 수정 보드에)." +
        (left ? "\n아직 답하지 않은 질문 " + left + "개는 다음에 다시 올라옵니다." : "") + "\n계속할까요?"
      : (left ? "아직 답하지 않은 질문이 " + left + "개 있습니다. 답한 것만 저장할까요?\n(손대지 않은 질문은 다음에 다시 올라옵니다)" : "");
    if (msg && !window.confirm(msg)) return;
    saveAnswers(function(where, j){
      if (!where) return;
      st.completedAt = new Date().toTimeString().slice(0, 5);
      st.savedTo = where;
      keepApply(j);
      save(); render(); openDone();
    });
  }
  function appliedView(a){
    var r = a.result || {}, box = document.getElementById("doneApplied");
    box.textContent = "";
    if (!a.applied){
      box.appendChild(h("p", {class:"warn", text:"답은 저장했지만 반영하지 못했습니다(" + (a.code || "APPLY_FAILED") +
        "). '다시 저장'을 누르면 다시 반영합니다. 계속 안 되면 Claude에게 \"질문 답변 끝났어\"라고 알려 주세요."}));
      return;
    }
    var bad = (r.invalid || []).length, items = [
      "라벨링 규칙 승인 파일(taxonomy/labeling_rules.json)에 규칙 " + (r.rules || 0) + "개 · 사례 " + (r.examples || 0) +
        "개를 반영했습니다(후보 승인 " + (r.patterns_approved || 0) + "). 다음 /BEOL-labeling 실행부터 프롬프트에 들어갑니다."];
    if (r.taxonomy) items.push("taxonomy 제안 " + r.taxonomy + "개를 수정 보드(출처 S7)에 올렸습니다" +
      (a.board ? ": " + a.board.replace("[taxonomy-board] ", "") : "") + ". 보드에서 고치고 '최종 완료'를 누르면 taxonomy.json에 씁니다.");
    if (bad) items.push("확정한 초안이 없거나 형식이 맞지 않은 답 " + bad + "개는 반영하지 않았습니다. 그 질문은 다음에 다시 올라옵니다.");
    if ((r.not_open || []).length) items.push("이미 반영했거나 닫힌 질문의 답 " + r.not_open.length + "개는 건너뛰었습니다.");
    items.push("질문 화면 서버를 닫았습니다. Claude가 마무리 보고를 합니다. 이 탭은 닫아도 됩니다.");
    box.appendChild(h("ol", {class:"next"}, items.map(function(t){ return h("li", {text:t}); })));
  }
  function openDone(){
    var n = counts(), inbox = st.savedTo === "inbox", a = inbox ? st.apply : null, applied = !!(a && a.applied);
    document.getElementById("doneFile").textContent = (inbox ? "작업 폴더 qa/inbox/에 " : "내려받기 폴더에 ") + ANSWERS_NAME +
      (applied ? " 를 저장하고 바로 반영했습니다" : " 를 저장했습니다") + (st.completedAt ? " (" + st.completedAt + ")" : "") + "." +
      (inbox && !applied ? " 파일을 옮길 필요가 없습니다." : "");
    document.getElementById("doneH").textContent = applied ? "답변 완료 · 반영함" : "답변 완료 · 다음 단계";
    var ap = document.getElementById("doneApplied");
    ap.hidden = !a;
    if (a) appliedView(a);
    document.getElementById("doneNext").hidden = applied;
    document.getElementById("doneManual").hidden = applied;
    document.getElementById("doneAgain").hidden = applied;
    document.getElementById("doneMove").textContent = inbox
      ? "Claude가 qa/inbox/의 이 답 파일을 확인받습니다."
      : "Claude가 내려받기 폴더에서 이 답 파일을 찾아 확인을 받은 뒤 작업 폴더의 qa/inbox/로 옮깁니다.";
    document.getElementById("doneAgain").textContent = SERVED ? "다시 저장" : "다시 내려받기";
    var sum = document.getElementById("doneSum");
    sum.textContent = "";
    [["답", n.answered], ["묻지 않음", n.dismiss], ["나중에", n.skip]].forEach(function(x){
      sum.appendChild(h("span", {text:x[0] + " " + x[1]}));
    });
    if (n.open) sum.appendChild(h("span", {class:"w", text:"미답 " + n.open}));
    var cmds = ["python -m domain_engrbot questions apply --workspace \"<작업 폴더>\""];
    if (!inbox) cmds.unshift(ANSWERS_NAME + " 를 <작업 폴더>/qa/inbox/ 로 옮긴다");
    document.getElementById("doneCmd").textContent = cmds.map(function(c, i){ return (i + 1) + ") " + c; }).join("\n");
    var d = document.getElementById("doneDlg");

  }
  function closeDlg(id){ var d = document.getElementById(id); try { d.close(); } catch(e){ d.removeAttribute("open"); } }
  document.getElementById("doneClose").addEventListener("click", function(){ closeDlg("doneDlg"); });
  document.getElementById("doneAgain").addEventListener("click", function(){

  function copy(text, ok, fallback){

  // ---------- 서버 초안 기능 ----------
  if (SERVED){
    try {
      fetch("inbox/status").then(function(res){ return res.json(); }).then(function(j){
        if (!(j && j.ok && j.set_id === DATA.set_id)) return;
        if (j.apply){ APPLY_ON = true; render(); }
        if (!j.draft) return;
        DRAFT_ON = true;
        // 초안 기능이 있으면 자유 답을 그대로 규칙으로 두지 않는다(손대지 않은 자동 초안은 뺀다).
        Object.keys(st.q).forEach(function(id){
          var s = st.q[id];
          if (s && s.sets && s.sets.FREE) s.sets.FREE = s.sets.FREE.filter(function(it){ return !(it.auto && !it.edited); });
        });
        render();
      }, function(){});
    } catch(e){}
  }
  function makeDrafts(q){
    var s = qs(q.question_id), id = q.question_id;
    if (!collapse(s.free)){ toast("자유 답을 먼저 쓰세요"); return; }
    busy[id] = true; render();
    // 사람이 고치거나 직접 쓴 초안과 사례 초안은 남기고, 새 초안은 그 뒤에 더한다(같은 내용은 한 번만).
    function kept(){
      return (s.sets.FREE || []).filter(function(it){
        if (it.auto) return false;   // 자유 답에서 온 자동 규칙은 새것 하나로 바꾼다(다시 만들 때마다 쌓이지 않게)
        return it.origin === "edited" || it.origin === "human" || it.draft.type === "example";
      });
    }
    function merged(add){
      var out = kept(), have = {};
      out.forEach(function(it){ have[sameKey(it.draft)] = true; });
      add.forEach(function(it){ var k = sameKey(it.draft); if (!have[k]){ have[k] = true; out.push(it); } });
      return withExamples(q, out);
    }
    function fallback(code){
      busy[id] = false;
      s.sets.FREE = merged([{draft:autoRule(q, s.free), on:true, origin:"human", auto:true, edited:true}]);
      save(); toast("초안 만들기 실패(" + code + "). 자유 답을 규칙 초안 하나로 두었습니다"); render();
    }
    try {
      fetch("draft", {method:"POST", headers:{"Content-Type":"application/json"},
                      body:JSON.stringify({question_id:id, answer_text:s.free})})
        .then(function(res){ return res.json().then(function(j){ return {ok:res.ok && j && j.ok, j:j || {}}; }); })
        .then(function(x){
          if (!x.ok) return fallback(x.j.code || "DRAFT_FAILED");
          var ds = Array.isArray(x.j.drafts) ? x.j.drafts : [];
          if (!ds.length) return fallback("DRAFT_EMPTY");
          busy[id] = false;
          s.sets.FREE = merged(ds.map(function(d){ return {draft:d, on:true, origin:"llm"}; }));
          save(); toast("초안 " + ds.length + "개를 만들었습니다. 고칠 곳을 고친 뒤 확정하세요"); render();
        }, function(){ fallback("SERVER_UNREACHABLE"); });
    } catch(e){ fallback("SERVER_UNREACHABLE"); }
  }

  // ---------- 상태 바꾸기 ----------
  function nextOpen(q){
    var i = QS.indexOf(q);
    for (var k = 1; k <= QS.length; k++){
      var o = QS[(i + k) % QS.length];
      if (!(st.q[o.question_id] || {}).status) return o.question_id;
    }
    return q.question_id;
  }
  function setStatus(q, status){
    var s = qs(q.question_id);
    s.status = status;
    if (status !== "answered") s.answer = null;
    save();
    if (status) selId = nextOpen(q);
    render();
  }
  // 체크한 초안 집계: 규칙·taxonomy 초안 수(n), 사례 수(m), 문제 있는 초안 수(bad). 문제 있는 초안은 n·m에서 뺀다.
  // 확정하려면 문제 있는 초안이 없고 규칙·taxonomy 초안이 1개 이상이어야 한다(사례만으로는 확정하지 않는다).
  function tally(s){
    var items = (s.sets[s.opt] || []).filter(function(it){ return it.on; }), t = {items:items, n:0, m:0, bad:0};
    items.forEach(function(it){
      if (draftProblem(it.draft)) t.bad += 1;
      else if (it.draft.type === "example") t.m += 1;
      else t.n += 1;
    });

  function patternText(p){
    if (p.missing) return p.rule_id + " · 지금 장부에 없는 패턴입니다";
    var t = p.target, n = ", " + p.count + "건";
    if (p.kind === "REPLACE") return "「" + t + "」 축: 봇 '" + p.from + "' → 사람 '" + p.to + "'" + n;
    if (p.kind === "REMOVE") return "「" + t + "」 축: 봇 '" + p.from + "' → 사람이 뺌" + n;
    if (p.kind === "ADD") return "「" + t + "」 축: 봇이 놓침 → 사람 '" + p.to + "'" + n;
    if (p.kind === "ANSWER") return "질문 " + t + ": 봇 '" + p.from + "' → 사람 '" + p.to + "'" + n;
    if (p.kind === "GEN_ANSWER") return "검증 질문 「" + t + "」: 봇 '" + p.from + "' → 사람 '" + p.to + "'" + n;
    return p.kind + " " + t + n;
  }

  function draftEditor(q, s, items, it, i){

    var title = d.type === "example" ? "이 교정 사례를 few-shot 예시로 쓰기"
      : d.type === "rule" ? (it.auto ? "규칙 문장 (자유 답에서)" : "규칙 문장") : "taxonomy · " + (TAX_KIND[d.kind] || d.kind);
    card.appendChild(h("div", {class:"dh2"}, [h("label", {}, [include, title]), originTag, h("span", {class:"sp"}),
      it.origin === "human" && !it.auto ? h("button", {class:"btn sm", type:"button", text:"삭제", onclick:function(){
        items.splice(i, 1); save(); render(); }}) : null]));
    if (d.type === "rule") ruleFields(card, q, it, touched, showProb);
    else if (d.type === "taxonomy") taxFields(card, d, touched);
    else if (d.type === "example") card.appendChild(exampleLine(q, d));
    card.appendChild(prob);
    showProb();
    return card;
  }

  function ruleFields(card, q, it, touched, showProb){
    var d = it.draft, locked = !!d.pattern_id;
    if (locked) card.appendChild(h("div", {class:"lockline", text:"교정 패턴 " + d.pattern_id + " 규칙 · 단계와 대상 축은 패턴이 정합니다"}));
    var scopeBox = null;
    function syncScope(){ if (scopeBox) { scopeBox.sel.style.display = d.stage === "label" ? "none" : ""; scopeBox.txt.style.display = d.stage === "label" ? "" : "none"; } }
    var stage = h("select", {"aria-label":"단계", disabled:locked ? "disabled" : null, onchange:function(e){ d.stage = e.target.value; d.target = ""; target.value = ""; tgtTxt.value = ""; syncScope(); touched(); }},
      ["classify", "label"].map(function(v){ return h("option", {value:v, selected:(d.stage === "label" ? "label" : "classify") === v ? "selected" : null, text:STAGE[v]}); }));
    var names = AXIS_NAMES.slice();
    if (d.stage !== "label" && d.target && names.indexOf(d.target) < 0) names.unshift(d.target);
    var target = h("select", {"aria-label":"대상 축", disabled:locked ? "disabled" : null, onchange:function(e){ d.target = e.target.value; touched(); }},
      [h("option", {value:"", selected:d.target ? null : "selected", text:"(대상 축 지정 없음)"})].concat(names.map(function(n){
        return h("option", {value:n, selected:d.target === n ? "selected" : null, text:n}); })));
    var tgtTxt = h("input", {type:"text", "aria-label":"대상 범위(축=값 또는 질문 ID)", placeholder:"축=값 또는 질문 ID(Q-…)",
      disabled:locked ? "disabled" : null, oninput:function(e){ d.target = e.target.value; touched(); }});
    tgtTxt.value = d.stage === "label" ? (d.target || "") : "";
    scopeBox = {sel:target, txt:tgtTxt};
    syncScope();
    card.appendChild(h("div", {class:"grid2"}, [
      h("div", {class:"fld"}, [h("span", {class:"lb", text:"단계"}), stage]),
      h("div", {class:"fld"}, [h("span", {class:"lb", text:"대상(1차 축 · 3차 축=값/질문 ID)"}), target, tgtTxt])
    ]));
    var cnt = h("div", {class:"cnt"});
    function setCnt(){ var n = collapse(d.text).length; cnt.textContent = n + " / " + LIM.rule_text; cnt.className = "cnt" + (n > LIM.rule_text ? " over" : ""); }
    var ta = h("textarea", {rows:"3", "aria-label":"규칙 문장", placeholder:"라벨러에게 줄 규칙 문장(본문을 붙여 넣지 마세요)",
      oninput:function(e){ d.text = e.target.value; setCnt(); touched(); }});
    ta.value = d.text || "";
    setCnt();
    if (it.auto && !it.edited) refs.autoSync = function(){ ta.value = d.text || ""; setCnt(); showProb(); };
    card.appendChild(h("div", {class:"fld"}, [h("span", {class:"lb", text:"문장"}), ta, cnt]));
  }

  function axisIndex(name){ return AXIS_NAMES.indexOf(name); }
  function taxFields(card, d, touched){
    var req = REQ[d.kind] || [];
    (TAX_FIELDS[d.kind] || []).forEach(function(k){
      var lb = h("span", {class:"lb"}, [FIELD_LABEL[k] || k, req.indexOf(k) >= 0 ? h("b", {text:"*"}) : null]);
      var ai = axisIndex(d.axis);
      var valueList = ai >= 0 ? "dl-v" + ai : null;
      if (k === "values"){
        d.values = Array.isArray(d.values) ? d.values : [];
        var two = h("div", {class:"grid2"}, [0, 1].map(function(j){
          return h("input", {type:"text", value:d.values[j] || "", maxlength:String(LIM.name), list:valueList, "aria-label":"겹치는 값 " + (j + 1),
            oninput:function(e){ d.values[j] = e.target.value; touched(); }});
        }));
        card.appendChild(h("div", {class:"fld"}, [lb, two]));
        return;
      }
      if (NAME_KEYS.indexOf(k) >= 0){
        var list = k === "axis" ? "dl-axes" : (k === "value" || k === "parent" || k === "canonical") ? valueList : null;
        card.appendChild(h("div", {class:"fld"}, [lb, h("input", {type:"text", value:d[k] || "", maxlength:String(LIM.name), list:list,
          "aria-label":FIELD_LABEL[k] || k, oninput:function(e){ d[k] = e.target.value; touched(); }})]));
        return;
      }
      var lim = k === "memo" ? LIM.memo : LIM.long;
      var cnt = h("div", {class:"cnt"});
      function setCnt(){ var n = collapse(d[k]).length; cnt.textContent = n + " / " + lim; cnt.className = "cnt" + (n > lim ? " over" : ""); }
      var ta = h("textarea", {rows:"2", "aria-label":FIELD_LABEL[k] || k, oninput:function(e){ d[k] = e.target.value; setCnt(); touched(); }});
      ta.value = d[k] || "";
      setCnt();
      card.appendChild(h("div", {class:"fld"}, [lb, ta, cnt]));
    });
  }

  function exampleLine(q, d){
    var e = (q.examples || []).filter(function(x){ return x.example_id === d.example_id; })[0] || {};
    return h("div", {class:"hint", text:"사례 " + d.example_id + (e.record_id ? " · 레코드 " + e.record_id : "") +
      (e.source_ws ? " · " + e.source_ws : "") + " — 체크하면 이 사례의 확정 라벨을 라벨러 few-shot 예시로 씁니다."});
  }

  function fillFooter(box, q, s){
    box.textContent = "";
    var t = tally(s), items = t.items, bad = t.bad;
    if (s.opt && items.length){
      var pv = h("div", {class:"preview"}, [h("div", {class:"pvh", text:"확정될 초안 " + t.n + "개" + (t.m ? " · 사례 " + t.m + "개" : "") +
        (bad ? " · 고칠 초안 " + bad + "개" : "") + " (전문)"})]);
      items.forEach(function(it){
        pv.appendChild(h("div", {class:"pvi" + (draftProblem(it.draft) ? " bad" : "")}, [h("span", {class:"tag", text:typeLabel(it.draft)}),
          h("span", {class:"origin " + (it.origin || "llm"), text:ORIGIN[it.origin] || ORIGIN.llm}), " ", draftSummary(it.draft)]));
      });
      box.appendChild(pv);
    }
    var msg = !s.opt ? "선택지를 고르거나 '직접 답하기'로 답하세요. 규칙이 필요 없으면 '묻지 않기'를 고르세요."
      : bad ? "체크한 초안 중 " + bad + "개를 고치거나 체크를 풀어야 확정할 수 있습니다."
      : !t.n ? "규칙·taxonomy 초안이 1개 이상 있어야 확정됩니다. 규칙이 필요 없으면 '묻지 않기'를 고르세요." : "";
    box.appendChild(h("div", {class:"actions"}, [
      h("button", {class:"btn primary", type:"button", disabled:t.ok ? null : "disabled",
        text:confirmLabel(t), onclick:function(){ confirmAnswer(q); }}),
      h("button", {class:"btn", type:"button", text:"나중에", title:"다음 질문 묶음에 다시 올립니다", onclick:function(){ setStatus(q, "skip"); }}),
      h("button", {class:"btn", type:"button", text:"묻지 않기", title:"이 질문을 다시 묻지 않습니다. 규칙 · taxonomy 제안을 남기지 않습니다",
        onclick:function(){ setStatus(q, "dismiss"); }})
    ]));
    if (msg) box.appendChild(h("p", {class:"hint warn", text:msg}));
  }

  render();
})();
</script>
</body>
</html>
