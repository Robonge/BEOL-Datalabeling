<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검수봇 검토 화면</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --surface:#F6F8FC; --surface-2:#E4EAF3;
  --text-strong:#1E2D4A; --text-muted:#6F7F99;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --radius-sm:8px; --radius:12px;
  --font:'Apple SD Gothic Neo','Noto Sans KR','Inter',sans-serif;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13.5px;line-height:1.55;letter-spacing:-0.02em;color:var(--text-strong);background:var(--bg-base)}
h1,h2,h3,h4{margin:0;font-weight:700}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-0.01em}
.muted{color:var(--text-muted)}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--bg-grid);flex-wrap:wrap}
.bar h1{font-size:18px;letter-spacing:-0.055em}
.bar .meta{font-size:11.5px;color:var(--text-muted)}
.bar .sp{flex:1}
.bar input{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--surface);width:150px}
.tabs{display:flex;gap:6px;padding:8px 20px;border-bottom:1px solid var(--bg-grid);flex-wrap:wrap}
.tab{border:1px solid var(--bg-grid);background:transparent;border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:700}
.tab.on{background:var(--primary);border-color:var(--primary);color:#EDF1F7}
.tab .n{font-family:var(--mono);margin-left:6px;opacity:.8}
.cols{display:grid;grid-template-columns:340px 1fr;min-height:0}
.cols.full{grid-template-columns:1fr}
.list{border-right:1px solid var(--bg-grid);display:flex;flex-direction:column;min-height:0}
.filters{padding:10px 12px;border-bottom:1px solid var(--bg-grid)}
.filters .lbl{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--bg-grid);background:transparent;border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#EDF1F7}
.chip .n{font-family:var(--mono);margin-left:5px;opacity:.75}
.items{overflow:auto;padding:8px 10px 30px;flex:1}
.grp{border-left:3px solid var(--primary-soft);margin:8px 0;padding-left:6px;background:rgba(107,130,196,.06)}
.grp .gh{font-size:10.5px;color:var(--primary);padding:3px 4px 1px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--surface);border-radius:var(--radius-sm);padding:7px 10px;margin:4px 0;cursor:pointer}
.item.on{border-color:var(--primary);box-shadow:0 5px 16px rgba(53,70,144,.14)}
.item .l1{display:flex;gap:8px;font-size:11px;color:var(--text-muted)}
.item .l1 .id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l2{font-weight:700;font-size:13px;margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.tag.critical{border-color:var(--danger);color:var(--danger)}
.tag.major{border-color:var(--warning);color:#A97C1F}
.done{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid var(--success);color:var(--success)}
.detail{overflow:auto;min-height:0;padding:18px 24px 60px}
.dh h2{font-size:19px;letter-spacing:-0.05em;word-break:break-all}
.dh .path{font-size:11.5px;color:var(--text-muted);word-break:break-all}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--bg-grid);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.7;max-height:460px;overflow:auto}
mark{background:none;color:inherit;border-radius:3px;padding:0 1px}
mark.q{background:rgba(194,84,80,.22);box-shadow:inset 0 -2px 0 var(--danger)}
mark.s{background:rgba(74,95,168,.14);box-shadow:inset 0 -2px 0 var(--primary)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs img{height:92px;max-width:170px;object-fit:contain;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in}
.slideimgs{margin-top:10px}
.slideimgs .sl{font-size:11.5px;font-weight:700;color:var(--text-muted)}
.slideimgs .imgs{margin-top:4px}
.others{margin-top:12px;border-top:1px dashed var(--bg-grid);padding-top:8px}
.others summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--primary)}
.slideprev{display:block;width:100%;max-height:420px;object-fit:contain;margin-top:4px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.ocard{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:6px;background:var(--bg-base)}
.ocard .ot{font-size:11.5px;font-weight:700;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .slideprev{max-height:150px}
.ocard .noprev{height:72px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm);margin-top:4px}
.ocard .imgs img{height:48px;max-width:80px}
.fld{border-top:1px dashed var(--bg-grid);padding:9px 0}
.fld:first-of-type{border-top:0}
.fld.prob{background:rgba(201,154,59,.08);margin:0 -8px;padding:9px 8px;border-radius:var(--radius-sm)}
.fh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fh b{font-size:13px}
.badge{font-size:10px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.badge.prob{border-color:var(--warning);color:#A97C1F}
.v{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;border:1px solid var(--primary);background:rgba(74,95,168,.12);color:var(--primary-deep);margin-right:4px}
.v.na{border-color:var(--bg-grid);background:transparent;color:var(--text-muted)}
.ev{font-size:12px;border-left:2px solid var(--warning);padding-left:8px;margin:3px 0;word-break:break-word}
.defs{font-size:11.5px;margin:3px 0}
.defs summary{cursor:pointer;color:var(--primary)}
.defs dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.defs dt{font-weight:700}
.defs dd{margin:0;color:var(--text-muted)}
.opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.common{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px;padding:8px;border:1px dashed var(--primary);border-radius:var(--radius-sm);font-size:11.5px}
.common .btn[disabled]{opacity:.55;cursor:default}
.fromtag{display:inline-block;margin-top:5px;font-size:11px;color:var(--primary);border:1px solid var(--primary);border-radius:5px;padding:0 6px}
.opt{border:1px solid var(--bg-grid);background:transparent;border-radius:var(--radius-sm);padding:2px 10px;cursor:pointer;font-size:12px}
.opt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#EDF1F7;font-weight:700}
.edit{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.edit .vals{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px}
.edit textarea,.edit input[type=text],.edit select,.pin input,.pin select,.pin textarea{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);width:100%}
.edit textarea{height:52px}
.btn{border:1px solid var(--bg-grid);background:var(--surface);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-weight:700;font-size:12.5px}
.btn.primary{background:var(--primary-deep);color:#EDF1F7;border-color:var(--primary-deep)}
.btn.sm{padding:3px 9px;font-size:11.5px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bg-grid);padding:4px 8px;text-align:left;vertical-align:top;word-break:break-word}
th{background:var(--surface-2)}
.wide{padding:16px 24px 60px;overflow:auto;min-height:0}
.agrp summary{cursor:pointer;font-weight:700;font-size:14px}
.agrp .meta{font-size:12px;color:var(--text-muted);margin-left:8px;font-weight:400}
.pin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.note{font-size:12px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm);padding:5px 9px;margin-bottom:8px}
.emptystate{max-width:520px;margin:14vh auto;text-align:center;color:var(--text-muted)}
dialog{border:1px solid var(--bg-grid);border-radius:var(--radius);background:var(--surface);width:min(640px,92vw);padding:18px}
dialog textarea{width:100%;height:240px;font-family:var(--mono);font-size:12px}
.zoom{position:fixed;inset:0;background:rgba(30,45,74,.7);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:92vw;max-height:92vh;background:var(--bg-base)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text-strong);color:#EDF1F7;padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;opacity:0;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.donesum{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.donesum span{font-size:12px;border:1px solid var(--bg-grid);border-radius:999px;padding:1px 10px;background:var(--bg-base)}
.donesum span.w{border-color:var(--warning);color:#A97C1F}
ol.next{margin:8px 0 0 18px;font-size:13px;line-height:1.7}
ol.next li{margin-bottom:4px}
.manual{margin-top:8px;font-size:12px}
.manual summary{cursor:pointer;color:var(--primary)}
.manual pre{white-space:pre-wrap;word-break:break-all;background:var(--bg-base);border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:8px;margin-top:6px;font-size:11.5px}
.donetag{font-size:11.5px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:999px;padding:1px 9px}
.hint{font-size:12px;color:var(--text-muted)}
@media (max-width:1180px){ .two{grid-template-columns:1fr} }
@media (max-width:860px){ .app{height:auto} .cols{grid-template-columns:1fr} .items{max-height:260px} .pin{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div id="root"></div>
<div class="zoom" id="zoom" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <h3>결정 JSON 텍스트</h3>
  <p id="dlgP" class="muted"></p>
  <textarea id="dlgTa" readonly aria-label="결정 JSON"></textarea>
  <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="dlgSel" type="button">전체 선택</button>
    <button class="btn primary" id="dlgClose" type="button">닫기</button>
  </div>
</dialog>
<dialog id="doneDlg" aria-labelledby="doneH">
  <h3 id="doneH">검수 완료 · 다음 단계</h3>
  <p id="doneFile" class="muted"></p>
  <div id="doneSum" class="donesum"></div>
  <ol class="next">
    <li>Claude에게 <b>"QA 검수 끝났어"</b>라고 알려 주세요. <button class="btn sm" id="donePhrase" type="button">문구 복사</button></li>
    <li id="doneMove"></li>
    <li>골든셋 추가와 피드백 묶음(교정 · 재작업 · 규칙 제안)을 만들고 건수를 알려 줍니다. 파일을 직접 옮길 필요는 없습니다.</li>
  </ol>
  <details class="manual"><summary>Claude 없이 직접 하려면</summary><pre id="doneCmd" class="mono"></pre></details>
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="doneAgain" type="button">다시 내려받기</button>
    <button class="btn primary" id="doneClose" type="button">닫기</button>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;

(function(){
  "use strict";
  var root = document.getElementById("root");

  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }

  if (!DATA || DATA.kind !== "qa_review"){
    root.appendChild(h("div", {class:"emptystate"}, [
      h("h2", {text:"표시할 데이터가 없습니다"}),
      h("p", {text:"이 화면은 검수봇 run 또는 review 명령이 데이터를 채워 넣은 뒤에 사용합니다."})
    ]));
    return;
  }

  var records = DATA.records || [];
  var byId = {};
  records.forEach(function(r){ byId[r.record_id] = r; });
  var axisDef = {};
  (DATA.axes || []).forEach(function(a){ axisDef[a.name] = a; });
  var qtext = {};
  (DATA.questions || []).forEach(function(q){ qtext[q.qid] = q.text; });
  var codesDesc = DATA.codes || {};
  var SECTION_NAMES = {REVIEW:"REVIEW 대기열", PASS_SAMPLE:"PASS 표본", REJECT:"REJECT 목록", AUTO_FIX:"AUTO_FIX"};

  // ---------- 상태(브라우저 자동 저장) ----------
  var KEY = "engrbot_review_" + DATA.qa_run_id;
  var st = {reviewer:"", fields:{}, rejects:{}, autofix:{}, props:{}};
  var tab = "REVIEW", selId = null, activeCodes = {};
  function load(){
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      ["fields","rejects","autofix","props"].forEach(function(k){ if (o[k]) st[k] = o[k]; });
      if (typeof o.reviewer === "string") st.reviewer = o.reviewer;
      if (typeof o.completedAt === "string") st.completedAt = o.completedAt;
    } catch(e){}
  }
  var saveT = null;
  function save(){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){}
    }, 150);
  }
  load();

  // ---------- 봇 값 표시 ----------
  function fieldKind(f){ return f.split(":")[0]; }
  function fieldKey(f){ return f.slice(f.indexOf(":") + 1); }
  function botValue(r, f){
    var k = fieldKind(f), key = fieldKey(f), L = r.labels || {};
    if (k === "axis"){ var a = (L.axes || {})[key]; return a ? {value:a.values.slice(), quote:a.quote || "", conf:a.confidence, status:a.status} : null; }
    if (k === "answer"){ var q = (L.answers || {})[key]; return q ? {value:q.answer, quote:q.quote || "", conf:q.confidence} : null; }
    if (k === "extract"){
      var ex = (L.extracted || []).filter(function(e){ return e.field === f; })[0];
      return ex ? {value:ex.value, quote:ex.quote || "", conf:null} : null;
    }
    return null;
  }
  function fieldLabel(f){
    var k = fieldKind(f), key = fieldKey(f);
    if (k === "axis") return "축 · " + key;
    if (k === "answer") return "질문 · " + key + (qtext[key] ? " — " + qtext[key] : "");
    if (k === "extract") return "추출 · " + key;
    return f;
  }
  function valueDef(axis, v){
    var a = axisDef[axis];
    if (!a) return "";
    var x = (a.values || []).filter(function(y){ return y.name === v; })[0];
    return x ? (x.definition || "") : "";
  }

  // ---------- 본문 강조 ----------
  function pieces(q){
    var out = [];
    (q || "").split(/\n/).forEach(function(line){
      line.split(/\s*(?:…|\.{3,})\s*/).forEach(function(p){ p = p.trim(); if (p.length >= 2) out.push(p); });
    });
    return out;
  }
  function highlighted(text, strong, weak){
    var ranges = [];
    function add(qs, cls){
      qs.forEach(function(q){ pieces(q).forEach(function(p){
        var i = text.indexOf(p);
        if (i >= 0) ranges.push({s:i, e:i + p.length, c:cls});
      }); });
    }
    add(strong, "q"); add(weak, "s");
    ranges.sort(function(a, b){ return a.s - b.s || (a.c === "q" ? -1 : 1); });
    var box = h("div", {class:"text"}), pos = 0;
    ranges.forEach(function(r){
      if (r.s < pos) return;
      if (r.s > pos) box.appendChild(document.createTextNode(text.slice(pos, r.s)));
      box.appendChild(h("mark", {class:r.c, text:text.slice(r.s, r.e)}));
      pos = r.e;
    });
    if (pos < text.length) box.appendChild(document.createTextNode(text.slice(pos)));
    return box;
  }

  // ---------- 결정 출력(4.5절 형식) ----------
  function fieldState(rid, f){ return (st.fields[rid] || {})[f]; }
  function setField(rid, f, patch){
    st.fields[rid] = st.fields[rid] || {};
    var cur = st.fields[rid][f] || {};
    for (var k in patch) cur[k] = patch[k];
    st.fields[rid][f] = cur;
    save();
  }
  function buildOutput(){
    var decisions = [], rejects = [], autofix = [], props = [];
    records.forEach(function(r){
      if (r.section !== "REVIEW" && r.section !== "PASS_SAMPLE") return;
      r.fields.forEach(function(f){
        var s = fieldState(r.record_id, f);
        if (!s || !s.decision) return;
        var b = botValue(r, f) || {value:null, quote:""};
        var d = {record_id:r.record_id, field:f, decision:s.decision, value:null, quote:null};
        if (s.decision === "confirm"){ d.value = b.value; d.quote = b.quote; }
        else if (s.decision === "correct"){ d.value = s.value !== undefined ? s.value : b.value; d.quote = s.quote !== undefined ? s.quote : b.quote; }
        decisions.push(d);
      });
    });
    records.forEach(function(r){
      if (r.section !== "REJECT") return;
      var s = st.rejects[r.record_id];
      if (!s || !s.decision) return;
      var corr = [];
      if (s.decision === "correct"){
        r.fields.forEach(function(f){
          var c = (s.corr || {})[f];
          if (c && c.on){
            var b = botValue(r, f) || {value:null, quote:""};
            corr.push({field:f, value:c.value !== undefined ? c.value : b.value, quote:c.quote !== undefined ? c.quote : b.quote});
          }
        });
      }
      rejects.push({record_id:r.record_id, decision:s.decision, corrections:corr});
    });
    (DATA.autofix || []).forEach(function(g){
      var s = st.autofix[g.rule] || {};
      var ex = Object.keys(s.except || {}).filter(function(k){ return s.except[k]; }).sort();
      var dec = g.approved ? (ex.length ? "approve" : null) : (s.decision || null);
      if (dec) autofix.push({rule:g.rule, decision:dec, except:ex});
    });
    (DATA.proposals || []).forEach(function(p){
      var s = st.props[p.proposal_id];
      if (!s || !s.decision) return;
      var d = {proposal_id:p.proposal_id, decision:s.decision, as:null, note:s.note || ""};
      if (p.kind === "TERM"){
        d.as = s.as || null;
        d.axis = s.axis || ""; d.parent = s.parent || ""; d.canonical = s.canonical || "";
      }
      props.push(d);
    });
    return {kind:"qa_decisions", qa_run_id:DATA.qa_run_id, reviewer:st.reviewer || "",
            decisions:decisions, reject_decisions:rejects, autofix_decisions:autofix, proposal_decisions:props};
  }
  var DECISIONS_NAME = "qa_decisions_" + DATA.qa_run_id + ".json";
  // domain_engrbot serve로 열었으면 결정을 서버에 보내 작업 폴더 qa/inbox/에 바로 쓴다. 파일로 열었으면 내려받는다.
  var SERVED = location.protocol !== "file:";
  // done(where): "inbox"(작업 폴더에 저장) · "download"(내려받기 시작) · null(둘 다 막혀 텍스트 창을 띄움).
  function saveDecisions(done){
    var text = JSON.stringify(buildOutput(), null, 2);
    if (!SERVED){ done(download(text) ? "download" : null); return; }
    function fail(code){
      toast("작업 폴더 저장 실패(" + code + "). 내려받기로 저장합니다");
      done(download(text) ? "download" : null);
    }
    try {
      fetch("inbox/qa_decisions", {method:"POST", headers:{"Content-Type":"application/json"}, body:text})
        .then(function(res){ return res.json().then(function(j){ return {ok:res.ok && j && j.ok, j:j || {}}; }); })
        .then(function(x){
          if (!x.ok) return fail(x.j.code || "SAVE_FAILED");
          toast("작업 폴더 qa/inbox/에 " + DECISIONS_NAME + " 를 저장했습니다");
          done("inbox");
        }, function(){ fail("SERVER_UNREACHABLE"); });
    } catch(e){ fail("SERVER_UNREACHABLE"); }
  }
  // 반환: 내려받기를 시작했으면 true. 막히면 텍스트 창을 띄우고 false.
  function download(text){
    try {
      var blob = new Blob([text], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = DECISIONS_NAME;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast(DECISIONS_NAME + " 내려받기를 시작했습니다");
      return true;
    } catch(e){
      showText(text, "내려받기가 막혔습니다. 아래 텍스트를 복사해 Claude에게 붙여 넣고 \"QA 검수 끝났어\"라고 알려 주세요.");
      return false;
    }
  }
  function undecidedCount(){
    return sectionRecords("REVIEW").concat(sectionRecords("REJECT")).filter(function(r){ return !isDone(r); }).length;
  }
  // 검수 완료: 결정 JSON을 내려받고 다음 단계(Claude에게 알리기)를 안내한다.
  function complete(){
    var left = undecidedCount();
    if (left && !window.confirm("결정하지 않은 레코드가 " + left + "건 있습니다. 결정한 것만 저장하고 검수를 마칠까요?\n(결정하지 않은 필드는 골든셋 · 피드백에 들어가지 않습니다)")) return;
    saveDecisions(function(where){
      if (!where) return;
      st.completedAt = new Date().toTimeString().slice(0, 5);
      st.savedTo = where;
      save(); render(); openDone();
    });
  }
  function openDone(){
    var out = buildOutput(), n = {confirm:0, correct:0, cannot_judge:0};
    out.decisions.forEach(function(d){ n[d.decision] = (n[d.decision] || 0) + 1; });
    var left = undecidedCount();
    var inbox = st.savedTo === "inbox";
    document.getElementById("doneFile").textContent = (inbox ? "작업 폴더 qa/inbox/에 " : "내려받기 폴더에 ") + DECISIONS_NAME +
      " 를 저장했습니다" + (st.completedAt ? " (" + st.completedAt + ")" : "") + "." + (inbox ? " 파일을 옮길 필요가 없습니다." : "");
    document.getElementById("doneMove").textContent = inbox
      ? "Claude가 qa/inbox/의 이 결정 파일을 확인받습니다."
      : "Claude가 내려받기 폴더에서 이 결정 파일을 찾아 확인을 받은 뒤 작업 폴더의 qa/inbox/로 옮깁니다.";
    document.getElementById("doneAgain").textContent = SERVED ? "다시 저장" : "다시 내려받기";
    var sum = document.getElementById("doneSum");
    sum.textContent = "";
    [["확정", n.confirm], ["교정", n.correct], ["판단 불가", n.cannot_judge], ["REJECT 결정", out.reject_decisions.length],
     ["AUTO_FIX 결정", out.autofix_decisions.length], ["규칙 제안 결정", out.proposal_decisions.length]].forEach(function(x){
      sum.appendChild(h("span", {text:x[0] + " " + x[1]}));
    });
    if (left) sum.appendChild(h("span", {class:"w", text:"미결정 레코드 " + left}));
    var cmds = ["python -m domain_engrbot golden add --workspace \"<작업 폴더>\" --qa-run " + DATA.qa_run_id,
                "python -m domain_engrbot feedback --workspace \"<작업 폴더>\" --qa-run " + DATA.qa_run_id];
    if (!inbox) cmds.unshift(DECISIONS_NAME + " 를 <작업 폴더>/qa/inbox/ 로 옮긴다");
    document.getElementById("doneCmd").textContent = cmds.map(function(c, i){ return (i + 1) + ") " + c; }).join("\n");
    var d = document.getElementById("doneDlg");
    try { d.showModal(); } catch(e){ d.setAttribute("open", ""); }
  }
  function closeDone(){ var d = document.getElementById("doneDlg"); try { d.close(); } catch(e){ d.removeAttribute("open"); } }
  document.getElementById("doneClose").addEventListener("click", closeDone);
  document.getElementById("doneAgain").addEventListener("click", function(){
    saveDecisions(function(where){ if (where){ st.savedTo = where; save(); openDone(); } });
  });
  document.getElementById("donePhrase").addEventListener("click", function(){
    var t = "QA 검수 끝났어";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){ toast("문구를 복사했습니다"); }, function(){ toast("복사가 막혔습니다. 직접 입력해 주세요"); });
        return;
      }
    } catch(e){}
    toast("복사가 막혔습니다. 직접 입력해 주세요");
  });
  function showText(text, msg){
    var dlg = document.getElementById("dlg"), ta = document.getElementById("dlgTa");
    document.getElementById("dlgP").textContent = msg || "";
    ta.value = text;
    try { dlg.showModal(); } catch(e){ dlg.setAttribute("open", ""); }
    ta.focus(); ta.select();
  }
  function copyText(){
    var text = JSON.stringify(buildOutput(), null, 2);
    function fallback(){ showText(text, "자동 복사가 막혀 있습니다. 텍스트를 선택해 복사(Ctrl+C)하세요."); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast("텍스트로 복사했습니다"); }, fallback);
        return;
      }
    } catch(e){}
    fallback();
  }
  document.getElementById("dlgClose").addEventListener("click", function(){
    var d = document.getElementById("dlg"); try { d.close(); } catch(e){ d.removeAttribute("open"); }
  });
  document.getElementById("dlgSel").addEventListener("click", function(){
    var ta = document.getElementById("dlgTa"); ta.focus(); ta.select();
  });
  var zoom = document.getElementById("zoom");
  zoom.addEventListener("click", function(){ zoom.classList.remove("on"); zoom.textContent = ""; });
  function openZoom(url){
    zoom.textContent = "";
    zoom.appendChild(h("img", {src:url, alt:"확대 이미지"}));
    zoom.classList.add("on");
  }

  // ---------- 진행 표시 ----------
  function isDone(r){
    if (r.section === "REJECT") return !!(st.rejects[r.record_id] || {}).decision;
    if (r.section === "AUTO_FIX") return false;
    return r.fields.length > 0 && r.fields.every(function(f){ var s = fieldState(r.record_id, f); return s && s.decision; });
  }
  function sectionRecords(sec){
    return records.filter(function(r){ return sec === "REVIEW" ? (r.section === "REVIEW" || r.section === "PASS_SAMPLE") : r.section === sec; });
  }

  // ---------- 그리기 ----------
  function render(){
    root.textContent = "";
    var app = h("div", {class:"app"});
    var nReview = sectionRecords("REVIEW"), nReject = sectionRecords("REJECT");
    var done = nReview.concat(nReject).filter(isDone).length;
    var reviewer = h("input", {type:"text", value:st.reviewer, placeholder:"검토자 식별자", "aria-label":"검토자",
      oninput:function(e){ st.reviewer = e.target.value; save(); }});
    app.appendChild(h("div", {class:"bar"}, [
      h("h1", {text:"검수봇 검토 화면"}),
      h("span", {class:"meta mono", text:"검수 실행 " + DATA.qa_run_id + " · 라벨러 실행 " + (DATA.labeler_run_id || "-")}),
      h("span", {class:"sp"}),
      h("span", {class:"meta", text:"결정 완료 " + done + " / " + (nReview.length + nReject.length)}),
      st.completedAt ? h("button", {class:"donetag", type:"button", title:"다음 단계 다시 보기", text:"검수 완료 " + st.completedAt, onclick:openDone}) : null,
      reviewer,
      h("button", {class:"btn primary", type:"button", text:st.completedAt ? "다시 완료 · 저장" : "검수 완료",
        title:SERVED ? "결정 JSON을 작업 폴더 qa/inbox/에 저장하고 다음 단계를 안내합니다" : "결정 JSON을 내려받고 다음 단계를 안내합니다", onclick:complete}),
      h("button", {class:"btn", type:"button", text:"텍스트로 복사", onclick:copyText}),
      st.completedAt ? null : h("div", {class:"hint", style:"flex-basis:100%",
        text:"결정을 마치면 오른쪽 위 '검수 완료'를 누르세요. 결정 파일이 " + (SERVED ? "작업 폴더 qa/inbox/에 저장되고" : "내려받아지고") + ", Claude에게 \"QA 검수 끝났어\"라고 알리면 골든셋 · 피드백 반영이 이어집니다. 진행 상황은 이 브라우저에 자동 저장됩니다."})
    ]));
    var tabs = [["REVIEW", "REVIEW 대기열", nReview.length], ["REJECT", "REJECT 목록", nReject.length],
                ["AUTO_FIX", "AUTO_FIX", (DATA.autofix || []).length], ["PROPOSALS", "규칙 제안", (DATA.proposals || []).length]];
    app.appendChild(h("div", {class:"tabs"}, tabs.map(function(t){
      return h("button", {class:"tab" + (tab === t[0] ? " on" : ""), type:"button", onclick:function(){ tab = t[0]; selId = null; render(); }},
               [t[1], h("span", {class:"n", text:String(t[2])})]);
    })));
    if (tab === "AUTO_FIX") app.appendChild(h("div", {class:"wide"}, [renderAutofix()]));
    else if (tab === "PROPOSALS") app.appendChild(h("div", {class:"wide"}, [renderProposals()]));
    else app.appendChild(renderRecordsTab(tab));
    root.appendChild(app);
  }

  function renderRecordsTab(sec){
    var recs = sectionRecords(sec);
    var counts = {};
    recs.forEach(function(r){ r.issue_codes.forEach(function(c){ counts[c] = (counts[c] || 0) + 1; }); });
    var on = Object.keys(activeCodes).filter(function(c){ return activeCodes[c]; });
    var shown = recs.filter(function(r){ return !on.length || r.issue_codes.some(function(c){ return activeCodes[c]; }); });
    if (!selId || !byId[selId] || shown.indexOf(byId[selId]) < 0) selId = shown.length ? shown[0].record_id : null;
    var chips = Object.keys(counts).sort().map(function(c){
      return h("button", {class:"chip" + (activeCodes[c] ? " on" : ""), type:"button", title:codesDesc[c] || "",
        onclick:function(){ activeCodes[c] = !activeCodes[c]; render(); }}, [c, h("span", {class:"n", text:String(counts[c])})]);
    });
    var items = h("div", {class:"items"});
    var lastKey = null, box = items;
    shown.forEach(function(r){
      var key = null, label = "";
      if (r.section === "PASS_SAMPLE"){ key = "pass"; label = "PASS 표본"; }
      else if (r.priority === 2){ key = "file:" + r.file_id; label = "파일 범위 이슈 · " + r.file_name; }
      else if (r.priority === 3){ key = "failsafe"; label = "judge 미실행·실패만 있는 레코드"; }
      else if (r.group){ key = "dup:" + r.group; label = "중복 묶음 " + r.group; }
      if (key !== lastKey){
        box = key ? h("div", {class:"grp"}, [h("div", {class:"gh", text:label})]) : items;
        if (key) items.appendChild(box);
        lastKey = key;
      }
      box.appendChild(h("button", {class:"item" + (r.record_id === selId ? " on" : ""), type:"button",
        onclick:function(){ selId = r.record_id; render(); }}, [
        h("div", {class:"l1"}, [h("span", {class:"id mono", text:r.record_id}), h("span", {text:"점수 " + r.score}),
          isDone(r) ? h("span", {class:"done", text:"결정함"}) : null]),
        h("div", {class:"l2", text:r.file_name + " · 슬라이드 " + (r.slide_no || "-") + " · " + (r.title || "")}),
        h("div", {class:"tags"}, r.issues.filter(function(i){ return i.severity === "critical" || i.severity === "major"; })
          .map(function(i){ return h("span", {class:"tag " + i.severity, text:i.code}); }))
      ]));
    });
    if (!shown.length) items.appendChild(h("p", {class:"muted", text:"표시할 레코드가 없습니다."}));
    var list = h("div", {class:"list"}, [
      h("div", {class:"filters"}, [h("div", {class:"lbl", text:"이슈 코드로 거르기"}), h("div", {class:"chips"}, chips)]),
      items
    ]);
    var detail = h("div", {class:"detail"}, [selId ? renderRecord(byId[selId]) : h("p", {class:"muted", text:"레코드를 고르세요."})]);
    return h("div", {class:"cols"}, [list, detail]);
  }

  function renderRecord(r){
    var wrap = h("div");
    wrap.appendChild(h("div", {class:"dh"}, [
      h("h2", {text:r.file_name + " · 슬라이드 " + (r.slide_no || "-")}),
      h("div", {class:"path mono", text:r.record_id + " · " + SECTION_NAMES[r.section] + " · 판정 " + r.verdict + " · 점수 " + r.score})
    ]));
    var fi = ((DATA.files || {})[r.file_id] || {}).file_issues || [];
    if (fi.length){
      wrap.appendChild(h("div", {class:"note"}, ["이 파일의 파일 범위 이슈: "].concat(fi.map(function(x){ return x.code + "(" + x.severity + ") "; }))));
    }
    var strong = [], weak = [];
    r.issues.forEach(function(i){ if (i.quote && (i.severity === "critical" || i.severity === "major")) strong.push(i.quote); });
    r.fields.forEach(function(f){ var b = botValue(r, f); if (b && b.quote) weak.push(b.quote); });
    var left = h("div", {class:"card"}, [h("h3", {text:"chunk 본문"}), highlighted(r.text, strong, weak)]);
    var slides = ((DATA.files || {})[r.file_id] || {}).slides || [];
    var own = slides.filter(function(s){ return s.record_id === r.record_id; })[0];
    if (own && own.preview) left.appendChild(slidePreview(own, "이 슬라이드 미리보기"));
    if (own && own.images.length) left.appendChild(slideImages(own, "이 슬라이드 안의 그림"));
    var others = slides.filter(function(s){ return s.record_id !== r.record_id; });
    if (others.length){
      var box = h("details", {class:"others", open:"open"}, [
        h("summary", {text:"같은 파일의 다른 슬라이드 (" + others.length + "장) · 누르면 크게 봅니다"})]);
      box.appendChild(h("div", {class:"ogrid"}, others.map(otherSlide)));
      left.appendChild(box);
    }
    var right = h("div");
    if (r.section === "REJECT") right.appendChild(renderReject(r));
    else if (r.section === "AUTO_FIX") right.appendChild(h("div", {class:"note", text:"AUTO_FIX 레코드는 AUTO_FIX 탭에서 규칙 단위로 결정합니다."}));
    else right.appendChild(renderFields(r));
    wrap.appendChild(h("div", {class:"two"}, [left, right]));
    return wrap;
  }

  function slidePreview(s, label){
    return h("div", {class:"slideimgs"}, [h("div", {class:"sl", text:label}),
      h("img", {class:"slideprev", src:s.preview, alt:label, onclick:function(){ openZoom(s.preview); }})]);
  }
  // 같은 파일의 다른 슬라이드 한 장: 슬라이드 전체 미리보기(없으면 표시만) + 슬라이드 안 그림 썸네일.
  function otherSlide(s){
    var label = "슬라이드 " + (s.slide_no || "-") + (s.title ? " · " + s.title : "");
    var card = h("div", {class:"ocard"}, [h("div", {class:"ot", title:label, text:label})]);
    card.appendChild(s.preview
      ? h("img", {class:"slideprev", src:s.preview, alt:label + " 미리보기", onclick:function(){ openZoom(s.preview); }})
      : h("div", {class:"noprev", text:"미리보기 없음"}));
    if (s.images.length) card.appendChild(h("div", {class:"imgs"}, s.images.map(function(u){
      return h("img", {src:u, alt:label + " 그림", onclick:function(){ openZoom(u); }});
    })));
    if (s.image_total > s.images.length) card.appendChild(h("p", {class:"muted", text:"그림 " + s.image_total + "개 중 " + s.images.length + "개 표시"}));
    return card;
  }
  function slideImages(s, label){
    var wrap = h("div", {class:"slideimgs"}, [h("div", {class:"sl", text:label})]);
    wrap.appendChild(h("div", {class:"imgs"}, s.images.map(function(u){
      return h("img", {src:u, alt:label + " 이미지", onclick:function(){ openZoom(u); }});
    })));
    if (s.image_total > s.images.length) wrap.appendChild(h("p", {class:"muted", text:"이미지 " + s.image_total + "개 중 " + s.images.length + "개만 표시합니다."}));
    return wrap;
  }

  function botLine(r, f){
    var b = botValue(r, f), k = fieldKind(f), key = fieldKey(f);
    if (!b) return h("div", {class:"muted", text:"봇 값 없음"});
    var vals = Array.isArray(b.value) ? b.value : [b.value];
    var line = h("div", {}, vals.map(function(v){
      var na = v === DATA.na || v === DATA.unknown;
      return h("span", {class:"v" + (na ? " na" : ""), title:k === "axis" ? valueDef(key, v) : "", text:String(v)});
    }).concat([b.conf !== null && b.conf !== undefined ? h("span", {class:"muted mono", text:"확신도 " + b.conf}) : null]));
    var out = h("div", {}, [line]);
    if (b.quote) out.appendChild(h("div", {class:"ev", text:b.quote}));
    if (k === "axis" && axisDef[key]){
      var dl = h("dl");
      vals.forEach(function(v){ var d = valueDef(key, v); if (d){ dl.appendChild(h("dt", {text:v})); dl.appendChild(h("dd", {text:d})); } });
      if (dl.childNodes.length) out.appendChild(h("details", {class:"defs"}, [h("summary", {text:"taxonomy 정의"}), dl]));
    }
    return out;
  }

  function valueEditor(r, f, cur, onchange){
    var k = fieldKind(f), key = fieldKey(f), b = botValue(r, f) || {value:null, quote:""};
    var value = cur.value !== undefined ? cur.value : b.value;
    var quote = cur.quote !== undefined ? cur.quote : b.quote;
    var box = h("div", {class:"edit"});
    if (k === "axis"){
      var names = ((axisDef[key] || {}).values || []).map(function(v){ return v.name; }).concat([DATA.na, DATA.unknown]);
      var sel = Array.isArray(value) ? value.slice() : [];
      box.appendChild(h("div", {class:"vals"}, names.map(function(n){
        var cb = h("input", {type:"checkbox", checked:sel.indexOf(n) >= 0 ? "checked" : null, onchange:function(e){
          var i = sel.indexOf(n);
          if (e.target.checked && i < 0) sel.push(n);
          if (!e.target.checked && i >= 0) sel.splice(i, 1);
          onchange({value:sel.slice()});
        }});
        return h("label", {title:valueDef(key, n)}, [cb, " " + n]);
      })));
    } else if (k === "answer"){
      var s = h("select", {"aria-label":"답", onchange:function(e){ onchange({value:e.target.value}); }},
        (DATA.answers_allowed || []).map(function(a){ return h("option", {value:a, selected:a === value ? "selected" : null, text:a}); }));
      box.appendChild(s);
    } else {
      box.appendChild(h("input", {type:"text", value:value || "", "aria-label":"값", oninput:function(e){ onchange({value:e.target.value}); }}));
    }
    box.appendChild(h("textarea", {placeholder:"근거 인용(본문에서 글자 그대로)", "aria-label":"근거 인용",
      oninput:function(e){ onchange({quote:e.target.value}); }}, [quote || ""]));
    return box;
  }

  // ---------- 같은 pptx 슬라이드 라벨 공통 적용 ----------
  // 슬라이드(레코드) 단위다. 같은 파일에서 검수를 마친 슬라이드의 라벨을 다른 슬라이드에 한 번에 넣는다.
  function samePptx(r){
    return records.filter(function(o){
      return o.record_id !== r.record_id && o.file_id === r.file_id && (o.section === "REVIEW" || o.section === "PASS_SAMPLE");
    });
  }
  function sameValue(a, b){
    function norm(v){ return Array.isArray(v) ? JSON.stringify(v.slice().sort()) : JSON.stringify(v === undefined ? null : v); }
    return norm(a) === norm(b);
  }
  // 넣을 필드: 두 슬라이드에 모두 있는 축·질문 필드 중 원본은 결정했고 대상은 아직 결정하지 않은 것.
  // 대상에서 이미 결정한 필드는 건드리지 않는다(추출 필드는 슬라이드마다 항목 순서가 달라 뺀다).
  function commonFields(src, dst){
    return dst.fields.filter(function(f){
      var k = fieldKind(f), a = fieldState(src.record_id, f), d = fieldState(dst.record_id, f);
      return (k === "axis" || k === "answer") && src.fields.indexOf(f) >= 0 && a && a.decision && !(d && d.decision);
    });
  }
  // 원본 슬라이드의 최종 값이 대상의 봇 값과 같으면 확정, 다르면 그 값으로 교정(근거 인용은 다른 슬라이드 것이라 비운다).
  function applyFrom(src, dst, n){
    commonFields(src, dst).forEach(function(f){
      var s = fieldState(src.record_id, f), b = botValue(src, f) || {value:null};
      var value = s.decision === "correct" ? (s.value !== undefined ? s.value : b.value) : b.value;
      var patch = {from:src.record_id, value:undefined, quote:undefined};
      if (s.decision === "cannot_judge") patch.decision = "cannot_judge";
      else if (sameValue((botValue(dst, f) || {}).value, value)) patch.decision = "confirm";
      else { patch.decision = "correct"; patch.value = Array.isArray(value) ? value.slice() : value; patch.quote = ""; }
      n[patch.decision] += 1;
      setField(dst.record_id, f, patch);
    });
    return n;
  }
  function appliedText(n){ return "확정 " + n.confirm + " · 교정 " + n.correct + " · 판단 불가 " + n.cannot_judge; }
  function slideName(r){ return "슬라이드 " + (r.slide_no || "-"); }
  function commonPanel(r){
    var sibs = samePptx(r);
    if (!sibs.length) return null;
    var box = h("div", {class:"common"}, [h("b", {text:"같은 pptx 라벨 적용"})]);
    // 같은 pptx에서 검수를 마친 슬라이드 → 이 슬라이드에 같은 라벨
    sibs.filter(isDone).forEach(function(src){
      var k = commonFields(src, r).length;
      box.appendChild(h("button", {class:"btn sm", type:"button", disabled:k ? null : "disabled",
        title:"검수를 마친 " + slideName(src) + "의 라벨을 이 슬라이드의 결정 안 한 필드에 넣습니다. 이미 결정한 필드는 그대로 둡니다.",
        text:slideName(src) + "와 같은 라벨 적용" + (k ? " (" + k + "개 필드)" : " · 남은 필드 없음"),
        onclick:function(){
          var n = applyFrom(src, r, {confirm:0, correct:0, cannot_judge:0});
          toast(slideName(src) + " 라벨 적용: " + appliedText(n)); render();
        }}));
    });
    // 이 슬라이드를 마쳤으면 → 같은 pptx의 다른 슬라이드 전부
    if (isDone(r)){
      var targets = sibs.filter(function(o){ return commonFields(r, o).length > 0; });
      box.appendChild(h("button", {class:"btn sm primary", type:"button", disabled:targets.length ? null : "disabled",
        title:"이 슬라이드의 라벨을 같은 pptx 다른 슬라이드의 결정 안 한 필드에 넣습니다. 이미 결정한 필드는 그대로 둡니다.",
        text:targets.length ? "이 슬라이드 라벨을 같은 pptx " + targets.length + "장에 적용" : "같은 pptx의 다른 슬라이드는 모두 결정됨",
        onclick:function(){
          var n = {confirm:0, correct:0, cannot_judge:0};
          targets.forEach(function(o){ applyFrom(r, o, n); });
          toast("같은 pptx " + targets.length + "장에 적용: " + appliedText(n)); render();
        }}));
    }
    if (box.childNodes.length === 1){
      box.appendChild(h("span", {class:"muted", text:"같은 pptx 다른 슬라이드 " + sibs.length + "장. 한 장의 필드를 모두 결정하면 같은 라벨 적용 버튼이 생깁니다."}));
    }
    return box;
  }

  function renderFields(r){
    var card = h("div", {class:"card"}, [h("h3", {}, ["필드별 결정",
      h("button", {class:"btn sm", type:"button", text:"남은 필드 모두 라벨 확정", onclick:function(){
        r.fields.forEach(function(f){ var s = fieldState(r.record_id, f); if (!s || !s.decision) setField(r.record_id, f, {decision:"confirm"}); });
        render();
      }})])]);
    var common = commonPanel(r);
    if (common) card.appendChild(common);
    if (!r.fields.length) card.appendChild(h("p", {class:"muted", text:"결정할 필드가 없습니다."}));
    var order = r.fields.slice().sort(function(a, b){
      return (r.problem_fields.indexOf(a) < 0) - (r.problem_fields.indexOf(b) < 0);
    });
    order.forEach(function(f){
      var prob = r.problem_fields.indexOf(f) >= 0;
      var s = fieldState(r.record_id, f) || {};
      var row = h("div", {class:"fld" + (prob ? " prob" : "")}, [
        h("div", {class:"fh"}, [h("b", {text:fieldLabel(f)}), prob ? h("span", {class:"badge prob", text:"이슈"}) : null]),
        botLine(r, f)
      ]);
      var opts = [["confirm", "라벨 확정"], ["correct", "교정"], ["cannot_judge", "판단 불가"]];
      row.appendChild(h("div", {class:"opts"}, opts.map(function(o){
        return h("button", {class:"opt", type:"button", "aria-pressed":s.decision === o[0] ? "true" : "false", text:o[1],
          onclick:function(){ setField(r.record_id, f, {decision:s.decision === o[0] ? null : o[0], from:null}); render(); }});
      })));
      if (s.from){
        var src = byId[s.from] || {};
        row.appendChild(h("span", {class:"fromtag", title:s.from, text:slideName(src) + "에서 공통 적용"}));
      }
      if (s.decision === "correct") row.appendChild(valueEditor(r, f, s, function(p){ p.from = null; setField(r.record_id, f, p); }));
      card.appendChild(row);
    });
    return card;
  }

  function renderReject(r){
    var s = st.rejects[r.record_id] || {};
    var card = h("div", {class:"card"}, [h("h3", {text:"재작업 지시와 결정"})]);
    var tb = h("table", {}, [h("tr", {}, [h("th", {text:"필드"}), h("th", {text:"코드"}), h("th", {text:"사유"}), h("th", {text:"고칠 방법"})])]);
    (r.rework || []).forEach(function(i){
      tb.appendChild(h("tr", {}, [h("td", {text:i.field || "-"}), h("td", {class:"mono", text:i.code}), h("td", {text:i.reason || ""}), h("td", {text:i.suggested_fix || ""})]));
    });
    card.appendChild(tb);
    var opts = [["rework", "재작업(지시가 맞다)"], ["correct", "직접 교정"], ["false_positive", "검수 오탐(규칙이 틀렸다)"]];
    card.appendChild(h("div", {class:"opts"}, opts.map(function(o){
      return h("button", {class:"opt", type:"button", "aria-pressed":s.decision === o[0] ? "true" : "false", text:o[1], onclick:function(){
        st.rejects[r.record_id] = st.rejects[r.record_id] || {};
        st.rejects[r.record_id].decision = s.decision === o[0] ? null : o[0];
        save(); render();
      }});
    })));
    if (s.decision === "correct"){
      var order = r.fields.slice().sort(function(a, b){ return (r.problem_fields.indexOf(a) < 0) - (r.problem_fields.indexOf(b) < 0); });
      order.forEach(function(f){
        var c = (s.corr || {})[f] || {};
        var row = h("div", {class:"fld" + (r.problem_fields.indexOf(f) >= 0 ? " prob" : "")}, [
          h("div", {class:"fh"}, [h("label", {}, [h("input", {type:"checkbox", checked:c.on ? "checked" : null, onchange:function(e){
            s.corr = s.corr || {}; s.corr[f] = s.corr[f] || {}; s.corr[f].on = e.target.checked;
            st.rejects[r.record_id] = s; save(); render();
          }}), " ", h("b", {text:fieldLabel(f)})])]),
          botLine(r, f)
        ]);
        if (c.on) row.appendChild(valueEditor(r, f, c, function(p){
          s.corr[f] = s.corr[f] || {}; for (var k in p) s.corr[f][k] = p[k];
          st.rejects[r.record_id] = s; save();
        }));
        card.appendChild(row);
      });
    }
    return card;
  }

  function renderAutofix(){
    var wrap = h("div");
    var groups = DATA.autofix || [];
    if (!groups.length) wrap.appendChild(h("p", {class:"muted", text:"AUTO_FIX 레코드가 없습니다."}));
    groups.forEach(function(g){
      var s = st.autofix[g.rule] || {};
      st.autofix[g.rule] = s;
      var summary = h("summary", {}, [g.rule, h("span", {class:"meta", text:g.items.length + "건" + (g.approved ? " · 이미 승인된 규칙(policy)" : "")})]);
      var det = h("details", {class:"card agrp"}, [summary]);
      if (!g.approved) det.setAttribute("open", "");
      if (!g.approved){
        det.appendChild(h("div", {class:"opts"}, [["approve", "규칙 승인"], ["reject", "규칙 기각"]].map(function(o){
          return h("button", {class:"opt", type:"button", "aria-pressed":s.decision === o[0] ? "true" : "false", text:o[1],
            onclick:function(){ s.decision = s.decision === o[0] ? null : o[0]; save(); render(); }});
        })));
      }
      var tb = h("table", {style:"margin-top:8px"}, [h("tr", {}, [h("th", {text:"제외"}), h("th", {text:"레코드"}), h("th", {text:"필드"}), h("th", {text:"전"}), h("th", {text:"후"})])]);
      g.items.forEach(function(it){
        var r = byId[it.record_id] || {};
        s.except = s.except || {};
        tb.appendChild(h("tr", {}, [
          h("td", {}, [h("input", {type:"checkbox", "aria-label":"이 레코드 제외", checked:s.except[it.record_id] ? "checked" : null,
            onchange:function(e){ s.except[it.record_id] = e.target.checked; save(); }})]),
          h("td", {}, [h("div", {class:"mono", text:it.record_id}), h("div", {class:"muted", text:(r.file_name || "") + " · 슬라이드 " + (r.slide_no || "-")})]),
          h("td", {class:"mono", text:it.field}),
          h("td", {text:JSON.stringify(it.before)}),
          h("td", {text:JSON.stringify(it.after)})
        ]));
      });
      det.appendChild(tb);
      wrap.appendChild(det);
    });
    return wrap;
  }

  function renderProposals(){
    var wrap = h("div");
    var props = DATA.proposals || [];
    if (!props.length) wrap.appendChild(h("p", {class:"muted", text:"규칙 제안이 없습니다."}));
    wrap.appendChild(h("div", {class:"note", text:"제안은 검수봇이 배치에서 집계한 신호와 수치입니다. 승인한 것만 피드백 묶음에 들어갑니다. 기각한 제안은 다음 실행부터 올라오지 않습니다."}));
    props.forEach(function(p){
      var s = st.props[p.proposal_id] || {};
      st.props[p.proposal_id] = s;
      var m = p.metric || {};
      var card = h("div", {class:"card"}, [
        h("h3", {}, [h("span", {class:"tag", text:p.kind}), p.target]),
        h("div", {class:"muted", text:(m.name || "") + " " + (m.value === null || m.value === undefined ? "-" : m.value) +
          (m.n !== null && m.n !== undefined ? " · n=" + m.n : "") + (m.threshold !== null && m.threshold !== undefined ? " · 기준 " + m.threshold : "")}),
        (p.examples || []).length ? h("div", {class:"muted mono", text:"예시: " + p.examples.join(", ")}) : null
      ]);
      card.appendChild(h("div", {class:"opts"}, [["approve", "승인"], ["reject", "기각"], ["hold", "보류"]].map(function(o){
        return h("button", {class:"opt", type:"button", "aria-pressed":s.decision === o[0] ? "true" : "false", text:o[1],
          onclick:function(){ s.decision = s.decision === o[0] ? null : o[0]; save(); render(); }});
      })));
      if (p.kind === "TERM" && s.decision === "approve"){
        card.appendChild(h("div", {class:"opts"}, [["value", "새 값으로"], ["synonym", "동의어로"]].map(function(o){
          return h("button", {class:"opt", type:"button", "aria-pressed":s.as === o[0] ? "true" : "false", text:o[1],
            onclick:function(){ s.as = s.as === o[0] ? null : o[0]; save(); render(); }});
        })));
        var pin = h("div", {class:"pin"});
        if (s.as === "value"){
          pin.appendChild(h("select", {"aria-label":"축", onchange:function(e){ s.axis = e.target.value; save(); }},
            [h("option", {value:"", text:"축 선택"})].concat((DATA.axes || []).map(function(a){
              return h("option", {value:a.name, selected:s.axis === a.name ? "selected" : null, text:a.name});
            }))));
          pin.appendChild(h("input", {type:"text", placeholder:"상위값(선택)", value:s.parent || "", oninput:function(e){ s.parent = e.target.value; save(); }}));
        } else if (s.as === "synonym"){
          pin.appendChild(h("input", {type:"text", placeholder:"표준어(taxonomy 값)", value:s.canonical || "", oninput:function(e){ s.canonical = e.target.value; save(); }}));
        }
        if (s.as) card.appendChild(pin);
      }
      card.appendChild(h("div", {class:"pin"}, [h("input", {type:"text", placeholder:"메모(선택)", value:s.note || "", oninput:function(e){ s.note = e.target.value; save(); }})]));
      wrap.appendChild(card);
    });
    return wrap;
  }

  render();
})();
</script>
</body>
</html>
