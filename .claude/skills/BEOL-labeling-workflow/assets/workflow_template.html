<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEOL 라벨링 워크플로</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4; --primary-mid:#4A6BAF;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --dot:#A8BDD4; --line:#7A9CC0;
  --text-strong:#1E2D4A; --text-sub:#5B6B86; --text-muted:#9DAABF; --text-footer:#B0BCCC;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --ease:cubic-bezier(0.34,1.56,0.64,1); --radius:12px; --radius-sm:8px;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Inter',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg-base)}
body{
  min-height:100vh; font-family:var(--font); font-weight:400; font-size:14px; line-height:1.65;
  letter-spacing:-0.02em; color:var(--text-strong); background-color:var(--bg-base);
  background-image:
    linear-gradient(to right, rgba(200,212,228,.5) 0.4px, transparent 0.4px),
    linear-gradient(to bottom, rgba(200,212,228,.5) 0.4px, transparent 0.4px);
  background-size:48px 48px;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.mono,code{font-family:var(--mono);letter-spacing:-0.01em}
code{font-size:12px;color:var(--primary-deep);background:var(--bg-base);border-radius:4px;padding:0 4px}
b,strong,h1,h2,h3{font-weight:700}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

header.top{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:28px 24px 8px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
header.top h1{font-size:26px;letter-spacing:-0.055em;line-height:1.2}
header.top p{color:var(--text-sub);margin-top:4px}
.grow{flex:1}
.btn{border:1px solid var(--bg-grid);background:rgba(255,255,255,.7);border-radius:var(--radius-sm);padding:8px 14px;transition:all .28s var(--ease)}
.btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.14)}
.btn.primary{color:#fff;border-color:transparent;background:linear-gradient(148deg,#4A5FA8 0%,#354690 100%)}
.btn[disabled]{opacity:.4;pointer-events:none}

.layout{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:16px 24px 64px;display:grid;grid-template-columns:292px 1fr;gap:24px;align-items:start}
.rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.zone{margin-bottom:14px;border-radius:var(--radius);border:1px dashed var(--line);padding:10px 8px 8px;background:rgba(237,241,247,.78)}
.zone.H{border-style:dotted;border-color:var(--text-muted)}
.zone h3{font-size:13px;letter-spacing:-0.048em;padding:0 6px;display:flex;align-items:center;gap:6px}
.zone .rng{font-size:11px;color:var(--text-sub);padding:2px 6px 8px;line-height:1.45}
.zone .rng em{font-style:normal;color:var(--primary);font-weight:700}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.zone.H .dotc{background:var(--warning)}
.zone.B .dotc{background:var(--primary-soft)}
.item{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);padding:7px 8px;margin-top:2px;transition:all .28s var(--ease)}
.item:hover{background:rgba(255,255,255,.75);transform:translateX(3px)}
.item .no{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:var(--primary-deep);background:rgba(74,95,168,.12)}
.item .tt{flex:1;line-height:1.35;font-size:13px}
.item .sb{display:block;font-size:11px;color:var(--text-sub)}
.item.on{background:#fff;border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.14)}
.item.on .no{color:#fff;background:linear-gradient(148deg,#4A5FA8,#354690)}
.item.human .no{background:rgba(201,154,59,.18);color:#7a5a14}
.item.human.on .no{background:var(--warning);color:#fff}

.stage{min-width:0}
.card{background:#fff;border:1px solid var(--bg-grid);border-radius:var(--radius);box-shadow:0 2px 8px rgba(53,70,144,.06);padding:18px 20px}
.hero{color:#fff;border:0;background:linear-gradient(148deg,#4A5FA8 0%,#354690 100%);position:relative;overflow:hidden}
.hero.H{background:linear-gradient(148deg,#6B82C4 0%,#4A6BAF 100%)}
.hero .crumb{font-size:12px;opacity:.82}
.hero h2{font-size:24px;letter-spacing:-0.048em;margin:2px 0 6px;line-height:1.25}
.hero p{opacity:.92;max-width:760px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);font-family:var(--mono)}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:16px;margin-top:16px;align-items:start}
.card h3{font-size:13px;letter-spacing:-0.048em;margin-bottom:6px}
.card h3:not(:first-child){margin-top:16px}
.card ul{list-style:none}
.card li{position:relative;padding:3px 0 3px 14px;color:var(--text-strong)}
.card li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--primary-soft)}
.card li.f{font-family:var(--mono);font-size:12px;color:var(--primary-deep)}
.mock-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mock-h h3{margin:0}
.tag{font-size:10px;font-family:var(--mono);color:var(--text-sub);border:1px solid var(--bg-grid);border-radius:999px;padding:1px 8px;background:var(--bg-base)}
.mock{display:flex;flex-direction:column;gap:12px}
.pager{display:flex;gap:8px;margin-top:16px;justify-content:space-between}

.sm{font-size:11px;color:var(--text-sub)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:10px 12px;background:var(--bg-base);transition:all .28s var(--ease)}
.tile:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 8px 20px rgba(53,70,144,.14)}
.tile .n{font-size:22px;font-weight:700;letter-spacing:-0.055em;line-height:1.15;font-family:var(--mono)}
.tile .l{font-size:11px;color:var(--text-sub)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);padding:1px 8px;border-radius:999px;border:1px solid var(--bg-grid);background:#fff;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.badge.ok{border-color:var(--success);color:var(--success)} .badge.ok::before{background:var(--success)}
.badge.warn{border-color:var(--warning);color:#7a5a14} .badge.warn::before{background:var(--warning)}
.badge.bad{border-color:var(--danger);color:var(--danger)} .badge.bad::before{background:var(--danger)}
.badge.info{border-color:var(--primary-soft);color:var(--primary-deep)} .badge.info::before{background:var(--primary)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:700;font-size:11px;color:var(--text-sub);padding:4px 8px;border-bottom:1px solid var(--bg-grid)}
table.t td{padding:6px 8px;border-bottom:1px solid rgba(200,212,228,.55);vertical-align:top}
pre.term{background:#1E2D4A;color:#DCE5F3;border-radius:var(--radius-sm);padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.7;overflow:auto;white-space:pre;letter-spacing:-0.01em}
pre.term .ok{color:#7fd1b0} pre.term .w{color:#e3bf72} pre.term .d{color:#8fa4c8}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .p{font-family:var(--mono);font-size:11px;border:1px solid var(--bg-grid);background:var(--bg-base);border-radius:var(--radius-sm);padding:4px 8px}
.flow .a{color:var(--line)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--bg-base);border:1px solid var(--bg-grid);margin:6px 0 2px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(148deg,#6B82C4,#4A5FA8)}
.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger);text-decoration:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chunk{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;transition:all .28s var(--ease)}
.chunk:hover{border-color:var(--primary);transform:translateY(-2px)}
.chunk .q{font-size:12.5px;color:var(--text-sub);background:var(--bg-base);border-radius:6px;padding:6px 8px;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 12px;font-family:var(--mono);font-size:12px;transition:background .2s}
.seg button+button{border-left:1px solid var(--bg-grid)}
.seg button.on{color:#fff;background:linear-gradient(148deg,#4A5FA8,#354690)}
.mini{font-size:12px;padding:4px 10px;border:1px solid var(--bg-grid);background:#fff;border-radius:var(--radius-sm);transition:all .28s var(--ease)}
.mini:hover{border-color:var(--primary);transform:translateY(-2px)}
.mini.on{border-color:var(--success);color:var(--success)}
.mini.on.w{border-color:var(--warning);color:#7a5a14}
.mini.on.d{border-color:var(--danger);color:var(--danger)}
.status{font-size:11px;font-family:var(--mono);color:var(--success)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bg-grid);background:#fff;border-radius:999px;padding:3px 12px;font-size:12px;transition:all .28s var(--ease)}
.tabs button.on{color:#fff;border-color:transparent;background:linear-gradient(148deg,#4A5FA8,#354690)}
.browser{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-base)}
.browser .bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid var(--bg-grid);font-family:var(--mono);font-size:11px;color:var(--text-sub)}
.browser .bar i{width:8px;height:8px;border-radius:50%;background:var(--bg-grid)}
.browser .body{padding:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--bg-base)}
.branch b{display:block;font-size:12px;margin-bottom:2px}
.foot{position:relative;z-index:1;text-align:center;font-size:11px;color:var(--text-footer);padding:0 0 24px}
.rise{animation:rise .36s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;max-height:none;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .zone{min-width:300px;flex:none}
  .cols,.split{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.rise{animation:none}.btn,.item,.tile,.chunk,.mini{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header class="top">
  <div>
    <h1>BEOL 라벨링 워크플로</h1>
    <p>pptx 입력부터 파싱 · 라벨링 · 사람 검수 · 피드백 · 적재까지. LLM은 chunk당 3회(1차 분류 · 2차 검증 질문 생성 · 3차 라벨링). 단계를 눌러 산출물과 예시 화면을 확인합니다.</p>
  </div>
  <div class="grow"></div>
  <span class="tag" id="runtag"></span>
  <button class="btn primary" id="play" type="button">▶ 전체 흐름 재생</button>
</header>

<main class="layout">
  <nav class="rail" id="rail" aria-label="워크플로 단계"></nav>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>
<p class="foot">예시 화면의 chunk 본문과 값은 합성 예시이며 실제 파일 내용이 아닙니다. 건수·알림·사유 코드·답 분포는 build_workflow.py가 채운 최신 실행 결과(오른쪽 위 run_id)입니다.</p>

<script>
(function(){
"use strict";
/* build_workflow.py가 최신 실행의 건수만 채운다(본문·파일명 없음). 비어 있으면 "—"로 표시한다. */
var LIVE = /*__LIVE__*/null || {};
var RUN = LIVE.run_id || "-";
function V(x){ return (x === undefined || x === null) ? "—" : x; }
function abc(o){ o = o || {}; return {O:o.O||0, X:o.X||0, NA:o["N/A"]||0}; }
var COM = abc(LIVE.com), GEN = abc(LIVE.gen);
document.getElementById("runtag").textContent = "run " + RUN + (LIVE.generated_at ? " · " + LIVE.generated_at : "");

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function tile(n,l){return '<div class="tile"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function badge(t,k){return '<span class="badge '+(k||'')+'">'+t+'</span>';}
function flow(a){return '<div class="flow">'+a.map(function(x,i){return (i?'<span class="a">→</span>':'')+'<span class="p">'+x+'</span>';}).join('')+'</div>';}
function term(lines){return '<pre class="term">'+lines+'</pre>';}
function browser(url,body){return '<div class="browser"><div class="bar"><i></i><i></i><i></i><span style="margin-left:6px">'+url+'</span></div><div class="body">'+body+'</div></div>';}
function nowStr(){return new Date().toTimeString().slice(0,8);}

/* ---------- zones ---------- */
var ZONES = {
  A:{name:"BEOL-labeling", cmd:"/BEOL-labeling", start:"준비 · 수집 · 파싱", end:"대시보드를 띄우고 검수 대기에서 멈춤"},
  B:{name:"BEOL-labeling-feedback", cmd:"/BEOL-labeling-feedback", start:"대조 여부 질문 · 검수 화면 띄우기 · 사람 검수", end:"검수 완료 버튼 → 반영 · Supabase 적재"}
};

/* ---------- mocks ---------- */
function mA1(){
  return flow(["입력 폴더","작업 폴더 준비","사전 점검","open(path,'rb') → .b64","메모리 파싱 · chunk"]) +
  '<div>'+term('<span class="d">$ init_workspace.py --input "parshing test files"</span>\n'+
  '{"file_counts": '+esc(JSON.stringify(LIVE.ext || {}))+', "port": 8770}\n'+
  '<span class="d">$ labelbot selfcheck --probe-llm</span>\n'+
  'taxonomy.xlsx   <span class="ok">PASS</span> 축 10\n'+
  'llm_probe       <span class="ok">PASS</span> gpt-6-sol\n'+
  'write_roundtrip <span class="ok">PASS</span> 7종\n'+
  'supabase_table  <span class="ok">PASS</span>\n'+
  '<span class="ok">결과: 전 항목 PASS</span>')+'</div>'+
  '<div><table class="t" style="margin-top:4px"><tr><th>확장자</th><th>파일</th><th>처리</th></tr>'+
  (function(){ var e=LIVE.ext||{}, other=0; Object.keys(e).forEach(function(k){ if(k!==".pptx"&&k!==".docx") other+=e[k]; });
    return '<tr><td class="mono">.pptx</td><td class="mono">'+(e[".pptx"]||0)+'</td><td>'+badge("파싱","ok")+'</td></tr>'+
    '<tr><td class="mono">.docx</td><td class="mono">'+(e[".docx"]||0)+'</td><td>'+badge("파싱","info")+'</td></tr>'+
    '<tr><td class="mono">그 외</td><td class="mono">'+other+'</td><td>'+badge("UNSUPPORTED","warn")+'</td></tr></table>'; })()+
  '<div class="sm" style="margin-top:6px">디코딩 직후 시그니처 확인(OOXML = <span class="mono">PK\\x03\\x04</span>). 맞지 않으면 사유 코드로 실패 처리합니다.</div></div>'+
  '<div class="tiles">'+tile(V(LIVE.files_ok),"파일 정상")+tile(V(LIVE.files_failed),"파일 실패")+tile(V(LIVE.chunks),"chunk")+tile(V(LIVE.extract_warn),"추출 경고")+'</div>'+
  '<table class="t"><tr><th>chunk</th><th>슬라이드</th><th>유형</th><th>본문(합성 예시)</th></tr>'+
  '<tr><td class="mono">c_3f9a21</td><td class="mono">4</td><td>'+badge("내용","ok")+'</td><td>[예시] 조건 변경 전후 측정 결과를 비교한 본문</td></tr>'+
  '<tr><td class="mono">c_71be04</td><td class="mono">5</td><td>'+badge("내용","ok")+'</td><td>[예시] 표 형태로 정리한 수치와 담당자 메모</td></tr>'+
  '<tr><td class="mono">c_a0d5c8</td><td class="mono">1</td><td>'+badge("비내용","info")+'</td><td>[예시] 표지 · 목차</td></tr></table>'+
  '<div class="row"><span class="sm">추출 경고(<span class="mono">extract:*</span>)는 날짜·담당자 값만 저장하지 않은 것이며 라벨에는 영향이 없습니다.</span>'+
  Object.keys(LIVE.extract_codes||{}).map(function(k){return badge(esc(k)+" ×"+LIVE.extract_codes[k],"warn");}).join(" ")+'</div>';
}
function mA4(){
  var ax=[["구조/레이어","M1",".92"],["공정 모듈","Etch",".88"],["제품·세대","(예) 세대 A",".74"],["REMSPC","unknown","—"],["Patterning","SADP",".81"],["Material","Cu",".90"],["불량 모드","Short",".69"],["물리 현상","(예) 잔막 부족",".77"]];
  var rows=ax.map(function(a){return '<tr><td>'+a[0]+'</td><td>'+(a[1]==="unknown"?badge("unknown","warn"):'<span class="mono">'+a[1]+'</span>')+'</td><td class="mono">'+a[2]+'</td></tr>';}).join('');
  return '<div class="row">'+badge("chunk_type: 내용","ok")+'<span class="sm">분류 축 8 + 상태 축 2(결과 · 의사결정 상태)</span></div>'+
  '<table class="t"><tr><th>축</th><th>값(예시)</th><th>확신도</th></tr>'+rows+'</table>'+
  '<div class="sm">실제 결과: chunk '+V(LIVE.chunks)+'개 중 분류 실패 '+V(LIVE.classify_failed)+'. 값이 taxonomy에 없으면 <span class="mono">unknown</span>으로 두고 후보로 기록합니다.</div>';
}
var GENQ=[
  {ax:"구조/레이어",v:"M1",q:"이 chunk는 M1 배선층의 공정 조건이나 결과를 다루는가?"},
  {ax:"공정 모듈",v:"Etch",q:"이 chunk의 실험·결과는 Etch 공정 단계에서 나온 것인가?"},
  {ax:"Material",v:"Cu",q:"이 chunk에서 다루는 배선 재료는 Cu인가?"},
  {ax:"불량 모드",v:"Short",q:"이 chunk는 배선 간 Short 불량을 보고하는가?"}
];
var BADQ=[
  {q:"Etch 조건이 왜 바뀌었는가?",code:"NOT_YES_NO",why:"개방형(왜)"},
  {q:"M1이고 Cu 재료인가?",code:"NOT_YES_NO",why:"두 가지를 한 번에 물음"},
  {q:"이 chunk는 Short 불량을 다룬다",code:"NOT_YES_NO",why:"물음표 없음"},
  {q:"(Material=Cu 질문 누락)",code:"QUESTION_MISSING",why:"라벨마다 하나씩"}
];
var gq=0;

/* ---------- 배경 도트 (반발 · 잔상 · 별자리) ---------- */
(function(){
  var c=document.getElementById("bg"), x=c.getContext("2d"), W,H,dots=[],mouse={x:-999,y:-999},trail=[];
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    var d=window.devicePixelRatio||1; W=innerWidth; H=innerHeight; c.width=W*d; c.height=H*d; x.setTransform(d,0,0,d,0,0);
    dots=[]; for(var i=24;i<W+48;i+=48) for(var j=24;j<H+48;j+=48) dots.push({ox:i,oy:j,x:i,y:j,vx:0,vy:0,f:0});
  }
  addEventListener("resize",size); size();
  addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;trail.push({x:e.clientX,y:e.clientY,a:28}); if(trail.length>60) trail.shift();});
  function frame(){
    x.clearRect(0,0,W,H);
    var near=[];
    for(var i=0;i<dots.length;i++){
      var d=dots[i], dx=d.ox-mouse.x, dy=d.oy-mouse.y, dist=Math.sqrt(dx*dx+dy*dy)||1, f=dist<140?(1-dist/140):0;
      var tx=d.ox+(dx/dist)*f*38, ty=d.oy+(dy/dist)*f*38;
      d.vx=(d.vx+(tx-d.x)*0.14)*0.78; d.vy=(d.vy+(ty-d.y)*0.14)*0.78; d.x+=d.vx; d.y+=d.vy; d.f=f;
      var mdx=d.x-mouse.x, mdy=d.y-mouse.y; if(mdx*mdx+mdy*mdy<110*110) near.push(d);
      x.beginPath(); x.arc(d.x,d.y,1.3+f*1.8,0,6.2832); x.fillStyle="rgba(168,189,212,"+(0.45+f*0.5)+")"; x.fill();
    }
    x.lineWidth=0.7;
    for(var a=0;a<near.length;a++) for(var b=a+1;b<near.length;b++){
      var ex=near[a].x-near[b].x, ey=near[a].y-near[b].y, dd=Math.sqrt(ex*ex+ey*ey);
      if(dd<76){ x.strokeStyle="rgba(122,156,192,"+(0.55*(1-dd/76))+")"; x.beginPath(); x.moveTo(near[a].x,near[a].y); x.lineTo(near[b].x,near[b].y); x.stroke(); }
    }
    for(var t=trail.length-1;t>=0;t--){ var p=trail[t]; p.a--; if(p.a<=0){trail.splice(t,1);continue;}
      x.beginPath(); x.arc(p.x,p.y,3+p.a*0.12,0,6.2832); x.fillStyle="rgba(90,130,190,"+(p.a/28*0.18)+")"; x.fill(); }
    requestAnimationFrame(frame);
  }
  if(still){ x.fillStyle="rgba(168,189,212,.5)"; dots.forEach(function(d){x.beginPath();x.arc(d.x,d.y,1.3,0,6.2832);x.fill();}); } else frame();
})();
})();
