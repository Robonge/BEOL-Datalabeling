<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검수 화면</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4; --primary-mid:#4A6BAF;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --surface:#F6F8FC; --surface-2:#E4EAF3;
  --dot:#A8BDD4; --line:#7A9CC0;
  --text-strong:#1E2D4A; --text-muted:#6F7F99; --text-footer:#B0BCCC;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --radius-sm:8px; --radius:12px;
  --ease-elastic:cubic-bezier(0.34,1.56,0.64,1);
  --font:'Apple SD Gothic Neo','Noto Sans KR','Inter',sans-serif;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); font-size:13.5px; line-height:1.55; letter-spacing:-0.02em; font-weight:400;
  color:var(--text-strong); background-color:var(--bg-base);
  background-image:
    linear-gradient(to right, rgba(200,212,228,.5) 0.5px, transparent 0.5px),
    linear-gradient(to bottom, rgba(200,212,228,.5) 0.5px, transparent 0.5px);
  background-size:48px 48px;
}
b,strong,h1,h2,h3,h4{font-weight:700}
h1,h2,h3,h4{margin:0}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-0.01em}
.muted{color:var(--text-muted)}
.warnc{color:#A97C1F}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--bg-grid);background:rgba(237,241,247,.92);flex-wrap:wrap}
.bar h1{font-size:18px;letter-spacing:-0.055em}
.bar .meta{font-size:11.5px;color:var(--text-muted)}
.bar .sp{flex:1}
.bar .stat{font-size:12px;color:var(--text-muted)}
.bar .stat b{color:var(--text-strong)}
.cols{display:grid;grid-template-columns:344px 1fr;min-height:0}
.list{border-right:1px solid var(--bg-grid);display:flex;flex-direction:column;min-height:0;background:rgba(237,241,247,.7)}
.filters{padding:10px 12px;border-bottom:1px solid var(--bg-grid)}
.filters .lbl{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  border:1px solid var(--bg-grid);background:transparent;border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;
  transition:all .28s var(--ease-elastic);white-space:nowrap;
}
.chip:hover{transform:translateY(-1px);border-color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#EDF1F7}
.chip .n{font-family:var(--mono);margin-left:5px;opacity:.75}
.items{overflow:auto;padding:8px 10px 30px;flex:1}
.grp{border-left:3px solid var(--primary-soft);margin:6px 0;padding-left:6px;border-radius:2px;background:rgba(107,130,196,.06)}
.grp .gh{font-size:10.5px;color:var(--primary);padding:3px 4px 1px}
.item{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--surface);border-radius:var(--radius-sm);
  padding:8px 10px;margin:4px 0;cursor:pointer;transition:all .28s var(--ease-elastic);
}
.item:hover{transform:translateX(2px);border-color:var(--bg-grid)}
.item.on{border-color:var(--primary);box-shadow:0 5px 16px rgba(53,70,144,.14)}
.item .l1{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text-muted)}
.item .l1 .id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l2{font-weight:700;font-size:13px;margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:-0.01em;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.tag.hard{border-color:var(--danger);color:var(--danger)}
.tag.soft{border-color:var(--warning);color:#A97C1F}
.mark{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid}
.mark.ok{color:var(--success);border-color:var(--success)}
.mark.img{color:var(--primary);border-color:var(--primary)}
.mark.fix{color:var(--primary-deep);border-color:var(--primary-soft);background:rgba(107,130,196,.14)}
.mark.rv{color:#8a6718;border-color:var(--warning);background:rgba(201,154,59,.1)}

.detail{overflow:auto;min-height:0;padding:18px 24px 60px}
.dh{margin-bottom:12px}
.dh h2{font-size:20px;letter-spacing:-0.055em;word-break:break-all}
.dh .path{font-size:11.5px;color:var(--text-muted);word-break:break-all}
.dh .metrics{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;align-items:center}
.metric{font-size:12px}
.metric .k{color:var(--text-muted);margin-right:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.btn{
  border:1px solid var(--bg-grid);background:var(--surface);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-weight:700;font-size:12.5px;
  transition:all .28s var(--ease-elastic);
}
.btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 16px rgba(53,70,144,.14)}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.opt:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.primary{background:linear-gradient(148deg,#4A5FA8 0%,#354690 100%);color:#EDF1F7;border-color:var(--primary-deep)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.on-ok{border-color:var(--success);color:var(--success);background:rgba(59,138,110,.1)}
.btn.on-img{border-color:var(--primary);color:var(--primary-deep);background:rgba(74,95,168,.12)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--bg-grid);border-radius:var(--radius);padding:13px 15px;margin-bottom:14px;box-shadow:0 2px 8px rgba(53,70,144,.06)}
.card h3{font-size:14px;letter-spacing:-0.048em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec{font-size:11px;color:var(--text-muted);margin:0 0 6px}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.7;max-height:420px;overflow:auto;padding-right:4px}
mark{background:none;color:inherit;border-radius:3px;padding:0 1px}
mark.q{background:rgba(201,154,59,.28);box-shadow:inset 0 -2px 0 var(--warning)}
mark.s{background:rgba(74,95,168,.16);box-shadow:inset 0 -2px 0 var(--primary);cursor:help}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-top:8px}
.legend mark{padding:0 6px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs img{height:92px;max-width:170px;object-fit:contain;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in;transition:transform .28s var(--ease-elastic)}
.imgs img:hover{transform:scale(1.04)}
.syn{margin-top:10px;border:1px dashed var(--primary-soft);border-radius:var(--radius-sm);padding:8px 10px;background:rgba(107,130,196,.07)}
.syn .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.syn select,.syn input{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);min-width:0}
.synlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.synlist .it{display:flex;gap:8px;align-items:center;font-size:12px}
.x{border:0;background:none;cursor:pointer;color:var(--danger);font-weight:700;padding:0 4px}
.rvbadge{font-size:10.5px;font-weight:700;color:#8a6718;border:1px solid var(--warning);background:rgba(201,154,59,.1);border-radius:999px;padding:0 7px}
.rvwrap{margin-top:6px}
.rvbox{margin-top:8px;border:1px dashed var(--warning);border-radius:var(--radius-sm);padding:8px 10px;background:rgba(201,154,59,.06)}
.rvbox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rvbox .row:first-child{margin-top:0}
.rvbox .k{font-size:11px;color:var(--text-muted)}
.rvbox select,.rvbox input,.rvbox textarea{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);min-width:0}
.rvbox textarea{width:100%;height:72px;resize:vertical;line-height:1.5}
.rvbox .cnt{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.rvnote{font-size:12px;color:#8a6718;border:1px dashed var(--warning);border-radius:var(--radius-sm);padding:5px 9px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.axis{padding:10px 0;border-top:1px dashed var(--bg-grid)}
.axis:first-of-type{border-top:0;padding-top:0}
.axhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.axhead b{font-size:13.5px}
.badge{font-size:10px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.axdef{font-size:11.5px;color:var(--text-muted);margin:1px 0 6px}
.botline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:3px}
.botline .k{color:var(--text-muted);font-size:11px}
.v{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;border:1px solid var(--primary);background:rgba(74,95,168,.12);color:var(--primary-deep);cursor:help}
.v.na{border-color:var(--line);background:transparent;color:var(--text-muted)}
.v.unk{border:1px dashed var(--warning);background:rgba(201,154,59,.1);color:#8a6718}
.ev{font-size:12px;color:var(--text-strong);border-left:2px solid var(--warning);padding-left:8px;margin:3px 0;word-break:break-word}
.conf{font-family:var(--mono);font-size:11px}
.defs{margin:4px 0 6px;font-size:11.5px}
.defs summary{cursor:pointer;color:var(--primary)}
.defs dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.defs dt{font-weight:700}
.defs dd{margin:0;color:var(--text-muted)}
.defs dt.botv{color:var(--primary-deep)}
.edit{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.edit .k{font-size:11px;color:var(--text-muted);margin-right:2px}
.opt{
  border:1px solid var(--bg-grid);background:transparent;border-radius:var(--radius-sm);padding:2px 10px;cursor:pointer;font-size:12px;
  transition:all .28s var(--ease-elastic);
}
.opt:hover{transform:translateY(-1px);border-color:var(--primary)}
.opt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#EDF1F7;font-weight:700}
.opt.sp{border-style:dashed}
.opt.sp[aria-pressed="true"]{background:var(--text-strong);border-color:var(--text-strong)}
.changed{font-size:10.5px;color:var(--primary-deep);font-weight:700;border:1px solid var(--primary-soft);background:rgba(107,130,196,.14);border-radius:999px;padding:0 7px}
.qhead{display:flex;gap:8px;align-items:baseline}
.qhead .qid{font-size:11px;color:var(--primary)}
.ans{font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--primary);border-radius:6px;padding:0 8px;background:rgba(74,95,168,.12);color:var(--primary-deep)}
.note{font-size:12px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm);padding:5px 9px;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bg-grid);padding:4px 8px;text-align:left;vertical-align:top;word-break:break-word}
th{background:var(--surface-2);font-weight:700}
.emptystate{max-width:520px;margin:14vh auto;text-align:center;color:var(--text-muted)}
.emptystate h2{color:var(--text-strong);font-size:22px;letter-spacing:-0.055em;margin-bottom:8px}

dialog{border:1px solid var(--bg-grid);border-radius:var(--radius);background:var(--surface);color:var(--text-strong);width:min(640px,92vw);padding:18px}
dialog::backdrop{background:rgba(30,45,74,.35)}
dialog textarea{width:100%;height:240px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:10px;font-family:var(--mono);font-size:12px;background:var(--bg-base);letter-spacing:-0.01em}
dialog h3{margin-bottom:6px;font-size:16px}
dialog p{margin:0 0 10px;font-size:12.5px;color:var(--text-muted)}
.zoom{position:fixed;inset:0;background:rgba(30,45,74,.7);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:92vw;max-height:92vh;border-radius:var(--radius-sm);background:var(--bg-base)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text-strong);color:#EDF1F7;padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;opacity:0;transform:translateY(8px);transition:all .32s var(--ease-elastic);pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}

@media (max-width:1180px){ .two{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{height:auto}
  .cols{grid-template-columns:1fr}
  .list{border-right:0;border-bottom:1px solid var(--bg-grid)}
  .items{max-height:260px}
  .detail{padding:14px 14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="zoom" id="zoom" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <h3>JSON 텍스트</h3>
  <p id="dlgP"></p>
  <textarea id="dlgTa" readonly aria-label="내보내기 JSON"></textarea>
  <div class="row" style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="dlgSel" type="button">전체 선택</button>
    <button class="btn primary" id="dlgClose" type="button">닫기</button>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;

(function(){
  "use strict";
  var root = document.getElementById("root");

  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }

  if (!DATA || DATA.kind !== "review"){
    root.appendChild(h("div", {class:"emptystate"}, [
      h("h2", {text:"표시할 데이터가 없습니다"}),
      h("p", {text:"이 화면은 labelbot review 명령이 불량 목록을 채워 넣은 뒤에 사용합니다. 검수 대상 데이터가 비어 있습니다."})
    ]));
    return;
  }

  var SPECIAL = ["해당 없음", "unknown", "판단 불가"];
  var ANSWERS = ["O", "X", "N/A", "판단 불가"];
  var COM_Q = "Q-COM-001";
  var flag = DATA.flag || {};
  var reasonLabels = DATA.reason_labels || {};
  var axes = DATA.axes || [];
  var qtext = {};
  (DATA.questions || []).forEach(function(q){ qtext[q.qid] = q.text; });
  var chunks = DATA.chunks || [];
  var byId = {};
  chunks.forEach(function(c){ byId[c.chunk_id] = c; });

  // ---------- state ----------
  var KEY = "labelbot_review_" + DATA.run_id;
  var edits = {};     // chunk_id -> {"a:axis": [..], "q:qid": "O"}
  var status = {};    // chunk_id -> confirmed | undecidable_image
  var syns = [];      // {chunk_id, alias, canonical}
  var revisits = [];  // {chunk_id, target, key, reason, proposed, related_values, memo}
  var rvDraft = null; // 열려 있는 재검토 요청 폼의 초안(저장 버튼을 누를 때만 revisits에 반영)
  var activeReasons = {};
  var onlyTodo = false;
  var onlyRevisit = false;
  var selId = null;
  var pendingAlias = "";

  // taxonomy 재검토 요청: DATA에 규칙이 없으면(예전 화면 데이터) 기능을 숨긴다.
  var RV_REASONS = DATA.revisit_reasons || null;
  var RV_RULES = DATA.revisit_rules || null;
  var rvOn = !!(RV_REASONS && RV_RULES);
  var RV_MEMO_MAX = DATA.revisit_memo_max || 500;
  var RV_SHORT_MAX = DATA.revisit_short_max || 60;
  var RV_RESERVED = ["해당없음", "unknown", "n/a", "na"];

  function load(){
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o.edits) edits = o.edits;
      if (o.status) status = o.status;
      if (o.syns) syns = o.syns;
      if (Array.isArray(o.revisits)) revisits = o.revisits.filter(function(r){ return r && typeof r === "object"; });
    } catch(e){}
  }
  var saveT = null;
  function save(){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try { window.localStorage.setItem(KEY, JSON.stringify({edits:edits, status:status, syns:syns, revisits:revisits})); } catch(e){}
      inboxSave();
    }, 150);
  }
  function hasState(){
    return Object.keys(edits).length > 0 || Object.keys(status).length > 0 || syns.length > 0 || revisits.length > 0;
  }

  // ---------- inbox 자동 저장(labelbot serve로 열었을 때만) ----------
  var inboxOn = false, inboxEl = null;
  function setInbox(msg, bad){
    if (!inboxEl) return;
    inboxEl.textContent = msg;
    inboxEl.style.color = bad ? "var(--danger)" : "";
  }
  function inboxCheck(){
    if (location.protocol === "file:" || !window.fetch) return;
    fetch("inbox/status", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(o){
        if (!o || !o.ok) return;
        inboxOn = true;
        setInbox("체크하면 작업 폴더 inbox에 자동 저장");
        if (hasState()) inboxSave();
      }).catch(function(){});
  }
  function inboxSave(){
    if (!inboxOn) return Promise.resolve(false);
    return fetch("inbox/review", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(buildOutput())})
      .then(function(r){
        if (!r.ok) throw new Error(String(r.status));
        setInbox("inbox 저장됨 " + new Date().toTimeString().slice(0, 8));
        return true;
      })
      .catch(function(){ setInbox("inbox 저장 실패: JSON 저장 버튼으로 내려받으세요", true); return false; });
  }

  // ---------- bot values / corrections ----------
  function botAxis(c, name){
    if (c.classify_failed) return null;
    var a = c.axes && c.axes[name];
    return a && a.values && a.values.length ? a : null;
  }
  function botAnswer(c, qid){
    if (c.label_failed) return null;
    var a = c.answers && c.answers[qid];
    return a && a.answer ? a : null;
  }
  function sameSet(a, b){
    if (a.length !== b.length) return false;
    var x = a.slice().sort(), y = b.slice().sort();
    for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
    return true;
  }
  function curAxis(c, name){
    var e = edits[c.chunk_id];
    if (e && e["a:" + name]) return e["a:" + name];
    var b = botAxis(c, name);
    return b ? b.values.slice() : [];
  }
  function curAnswer(c, qid){
    var e = edits[c.chunk_id];
    if (e && e["q:" + qid]) return e["q:" + qid];
    var b = botAnswer(c, qid);
    return b ? b.answer : "";
  }
  function chunkCorrections(c){
    var out = [], e = edits[c.chunk_id] || {};
    axes.forEach(function(ax){
      var v = e["a:" + ax.name];
      if (!v || !v.length) return;
      var b = botAxis(c, ax.name);
      if (!b || !sameSet(b.values, v)) out.push({chunk_id:c.chunk_id, target:"axis", key:ax.name, value:v.slice(), status:"corrected"});
    });
    questionIds(c).forEach(function(qid){
      var v = e["q:" + qid];
      if (!v) return;
      var b = botAnswer(c, qid);
      if (!b || b.answer !== v) out.push({chunk_id:c.chunk_id, target:"answer", key:qid, value:v, status:"corrected"});
    });
    return out;
  }
  function questionIds(c){
    if (c.classify_failed) return [COM_Q];
    var seen = {}, out = [];
    (c.mapped_questions || []).forEach(function(q){ if (!seen[q]){ seen[q] = 1; out.push(q); } });
    return out;
  }

  // ---------- taxonomy 재검토 요청: 규칙·검증 ----------
  function axisByName(name){
    for (var i = 0; i < axes.length; i++) if (axes[i].name === name) return axes[i];
    return null;
  }
  function rvReasonsFor(target, key){
    if (!rvOn) return [];
    var k = target === "question" && key === "" ? "question_blank" : target;
    return (RV_RULES[k] || []).slice();
  }
  function rvLabel(r){ return (RV_REASONS && RV_REASONS[r]) || r; }
  function rvIndex(cid, target, key){
    for (var i = 0; i < revisits.length; i++){
      var r = revisits[i];
      if (r.chunk_id === cid && r.target === target && r.key === key) return i;
    }
    return -1;
  }
  // 현재 화면 데이터 기준으로 유효한 대상인가(taxonomy가 바뀐 뒤 남은 오래된 항목을 거른다)
  function rvAllowed(c, r){
    if (!rvOn || !c || typeof r.key !== "string") return false;
    if (rvReasonsFor(r.target, r.key).indexOf(r.reason) < 0) return false;
    if (r.target === "axis") return !!axisByName(r.key);
    if (r.target === "question") return r.key === "" || questionIds(c).indexOf(r.key) >= 0;
    return r.target === "new_axis" && r.key === "";
  }
  function rvFor(c){
    return revisits.filter(function(r){ return r.chunk_id === c.chunk_id && rvAllowed(c, r); });
  }
  function rvExisting(c, target, key){
    var i = rvIndex(c.chunk_id, target, key);
    return i >= 0 && rvAllowed(c, revisits[i]) ? revisits[i] : null;
  }
  function rvNorm(s){ return String(s === null || s === undefined ? "" : s).replace(/\s+/g, " ").trim(); }
  function rvLen(s){ return Array.from(s).length; }
  // 초안(또는 저장된 항목)을 출력 형태로 정규화한다. 사유에 쓰지 않는 칸은 비운다.
  function rvItem(d){
    var rel = d.related_values || d.rel || [];
    var r = {chunk_id:d.chunk_id, target:d.target, key:d.key, reason:d.reason, proposed:null, related_values:[],
      memo:String(d.memo || "").replace(/\r\n?/g, "\n").trim()};
    if (d.reason === "NO_FIT_VALUE" || d.reason === "NEW_AXIS"){
      var p = d.proposed || {value:d.value, parent:d.parent};
      var parent = d.reason === "NO_FIT_VALUE" ? rvNorm(p.parent) : "";
      r.proposed = {value:rvNorm(p.value), parent:parent || null};
    } else if (d.reason === "VALUE_OVERLAP"){
      r.related_values = [rvNorm(rel[0]), rvNorm(rel[1])];
    } else if (d.reason === "AMBIGUOUS_DEF" && d.target === "axis" && rvNorm(rel[0])){
      r.related_values = [rvNorm(rel[0])];
    }
    return r;
  }
  // 문제가 없으면 "", 있으면 토스트에 띄울 안내(입력한 값은 넣지 않는다)
  function rvCheck(r){
    if (rvReasonsFor(r.target, r.key).indexOf(r.reason) < 0) return "재검토 사유를 고르세요";
    if (r.proposed){
      var v = r.proposed.value;
      if (!v) return r.reason === "NEW_AXIS" ? "제안할 축 이름을 입력하세요" : "제안 값을 입력하세요";
      if (rvLen(v) > RV_SHORT_MAX || (r.proposed.parent && rvLen(r.proposed.parent) > RV_SHORT_MAX)) return "제안 값은 " + RV_SHORT_MAX + "자 이하로 입력하세요";
      if (RV_RESERVED.indexOf(v.toLowerCase().replace(/\s+/g, "")) >= 0) return "해당 없음·unknown·N/A는 제안 값으로 쓸 수 없습니다";
    }
    if (r.reason === "VALUE_OVERLAP"){
      if (!r.related_values[0] || !r.related_values[1]) return "겹치는 값 두 개를 고르세요";
      if (r.related_values[0] === r.related_values[1]) return "서로 다른 값 두 개를 고르세요";
    }
    if ((r.reason === "OTHER" || r.reason === "NEED_QUESTION") && !r.memo) return "이 사유는 메모가 필요합니다";
    if (rvLen(r.memo) > RV_MEMO_MAX) return "메모는 " + RV_MEMO_MAX + "자 이하로 입력하세요";
    return "";
  }
  function rvOutput(){

    return out;
  }

  function buildOutput(){
    var corr = [], cs = [];

    var sy = syns.filter(function(s){ return byId[s.chunk_id]; }).map(function(s){
      return {chunk_id:s.chunk_id, alias:s.alias, canonical:s.canonical};

    var out = {kind:"review", run_id:DATA.run_id, corrections:corr, chunk_status:cs, synonyms:sy};
    // 재검토 규칙이 없는 예전 화면 데이터에서는 키를 빼서, apply가 기존 요청을 지우지 않게 한다.

  function copyText(){

      if (!codes.length) return true;
      return (c.reason_codes || []).some(function(r){ return codes.indexOf(r) >= 0; });

    arr.sort(function(a, b){
      var d = (b.reason_codes || []).length - (a.reason_codes || []).length;

  // ---------- body text with highlights ----------
  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function findAll(text, needle, all){
    var res = [];

    var i = text.indexOf(needle);
    if (i < 0){
      try {
        var m = new RegExp(esc(needle.trim()).replace(/\s+/g, "\\s+")).exec(text);
        if (m) res.push([m.index, m.index + m[0].length]);
      } catch(e){}
      return res;
    }
    while (i >= 0){
      res.push([i, i + needle.length]);
      if (!all) break;
      i = text.indexOf(needle, i + needle.length);
    }
    return res;
  }
  function quotePieces(q){
    return String(q || "").split(/…|\.\.\./).map(function(x){ return x.trim(); }).filter(function(x){ return x.length >= 2; });
  }
  function textNode(c){
    var text = c.text || "";
    var type = new Array(text.length), info = new Array(text.length), i;
    for (i = 0; i < text.length; i++) type[i] = 0;
    var quotes = [];
    if (!c.classify_failed) Object.keys(c.axes || {}).forEach(function(k){ quotes.push(c.axes[k].evidence); });
    if (!c.label_failed){
      Object.keys(c.answers || {}).forEach(function(k){ quotes.push(c.answers[k].quote); });
      (c.extracted || []).forEach(function(x){ quotes.push(x.quote); });
    }
    quotes.forEach(function(q){
      quotePieces(q).forEach(function(p){
        findAll(text, p, false).forEach(function(r){ for (var j = r[0]; j < r[1]; j++) type[j] = 1; });
      });
    });
    var aliases = [];
    (c.synonym_matches || []).forEach(function(s){ aliases.push({alias:s.alias, canonical:s.canonical}); });
    syns.forEach(function(s){ if (s.chunk_id === c.chunk_id) aliases.push({alias:s.alias, canonical:s.canonical}); });

    for (i = 1; i <= text.length; i++){

        var seg = text.slice(start, i);
        if (type[start] === 0) el.appendChild(document.createTextNode(seg));
        else if (type[start] === 1) el.appendChild(h("mark", {class:"q", text:seg}));
        else el.appendChild(h("mark", {class:"s", title:"표준어: " + info[start], text:seg}));
        start = i;

    root.appendChild(h("div", {class:"app"}, [
      h("header", {class:"bar"}, [
        h("h1", {text:"검수"}),
        h("div", {class:"meta mono", text:"실행 " + DATA.run_id + "  ·  생성 " + (DATA.generated_at || "-") + "  ·  기준 unknown ≥ " + (flag.unknown_ratio_min !== undefined ? flag.unknown_ratio_min : "-") + ", 확신도 < " + (flag.confidence_min !== undefined ? flag.confidence_min : "-")}),
        h("div", {class:"sp", style:"flex:1"}),
        statEl,
        inboxEl = h("span", {class:"meta", role:"status"}),
        h("button", {class:"btn primary", type:"button", text:"JSON 저장", onclick:download}),
        h("button", {class:"btn", type:"button", text:"텍스트로 복사", onclick:copyText})
      ]),
      h("div", {class:"cols"}, [listEl, detailEl])
    ]));
    var f = flat(visibleChunks());
    selId = f.length ? f[0].chunk_id : null;
    renderList(); renderDetail();
    inboxCheck();
  }
  init();
})();
</script>
</body>
</html>
