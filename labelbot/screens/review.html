<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검수 화면</title>
<style>
:root{
  --primary-deep:#354690; --primary:#4A5FA8; --primary-soft:#6B82C4; --primary-mid:#4A6BAF;
  --bg-base:#EDF1F7; --bg-grid:#C8D4E4; --surface:#F6F8FC; --surface-2:#E4EAF3;
  --dot:#A8BDD4; --line:#7A9CC0;
  --text-strong:#1E2D4A; --text-muted:#6F7F99; --text-footer:#B0BCCC;
  --danger:#C25450; --warning:#C99A3B; --success:#3B8A6E;
  --radius-sm:8px; --radius:12px;
  --ease-elastic:cubic-bezier(0.34,1.56,0.64,1);
  --font:'Apple SD Gothic Neo','Noto Sans KR','Inter',sans-serif;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); font-size:13.5px; line-height:1.55; letter-spacing:-0.02em; font-weight:400;
  color:var(--text-strong); background-color:var(--bg-base);
  background-image:
    linear-gradient(to right, rgba(200,212,228,.5) 0.5px, transparent 0.5px),
    linear-gradient(to bottom, rgba(200,212,228,.5) 0.5px, transparent 0.5px);
  background-size:48px 48px;
}
b,strong,h1,h2,h3,h4{font-weight:700}
h1,h2,h3,h4{margin:0}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-0.01em}
.muted{color:var(--text-muted)}
.warnc{color:#A97C1F}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--bg-grid);background:rgba(237,241,247,.92);flex-wrap:wrap}
.bar h1{font-size:18px;letter-spacing:-0.055em}
.bar .meta{font-size:11.5px;color:var(--text-muted)}
.bar .sp{flex:1}
.bar .stat{font-size:12px;color:var(--text-muted)}
.bar .stat b{color:var(--text-strong)}
.cols{display:grid;grid-template-columns:344px 1fr;min-height:0}
.list{border-right:1px solid var(--bg-grid);display:flex;flex-direction:column;min-height:0;background:rgba(237,241,247,.7)}
.filters{padding:10px 12px;border-bottom:1px solid var(--bg-grid)}
.filters .lbl{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  border:1px solid var(--bg-grid);background:transparent;border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;
  transition:all .28s var(--ease-elastic);white-space:nowrap;
}
.chip:hover{transform:translateY(-1px);border-color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#EDF1F7}
.chip .n{font-family:var(--mono);margin-left:5px;opacity:.75}
.items{overflow:auto;padding:8px 10px 30px;flex:1}
.grp{border-left:3px solid var(--primary-soft);margin:6px 0;padding-left:6px;border-radius:2px;background:rgba(107,130,196,.06)}
.grp .gh{font-size:10.5px;color:var(--primary);padding:3px 4px 1px}
.item{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--surface);border-radius:var(--radius-sm);
  padding:8px 10px;margin:4px 0;cursor:pointer;transition:all .28s var(--ease-elastic);
}
.item:hover{transform:translateX(2px);border-color:var(--bg-grid)}
.item.on{border-color:var(--primary);box-shadow:0 5px 16px rgba(53,70,144,.14)}
.item .l1{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text-muted)}
.item .l1 .id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l2{font-weight:700;font-size:13px;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l1{margin-bottom:5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:-0.01em;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.tag.hard{border-color:var(--danger);color:var(--danger)}
.tag.soft{border-color:var(--warning);color:#A97C1F}
.mark{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid}
.mark.ok{color:var(--success);border-color:var(--success)}
.mark.img{color:var(--primary);border-color:var(--primary)}
.mark.fix{color:var(--primary-deep);border-color:var(--primary-soft);background:rgba(107,130,196,.14)}
.mark.rv{color:#8a6718;border-color:var(--warning);background:rgba(201,154,59,.1)}

.detail{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dh{display:flex;gap:8px 24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:14px 24px 12px;border-bottom:1px solid var(--bg-grid);background:rgba(237,241,247,.92)}
.dh-main{min-width:0;flex:1 1 380px}
.dh h2{font-size:20px;letter-spacing:-0.055em;word-break:break-all}
.dh .path{font-size:11.5px;color:var(--text-muted);word-break:break-all;margin-top:2px}
.dh .metrics{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.metric{font-size:12px}
.metric .k{color:var(--text-muted);margin-right:5px}
.work{flex:1;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);min-height:0}
.pane{overflow:auto;min-height:0;padding:16px 20px 28px;overscroll-behavior:contain}
.pane.ev{border-right:1px solid var(--bg-grid)}
.pane > .card:last-child{margin-bottom:0}
.dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--bg-grid);background:rgba(237,241,247,.96);box-shadow:0 -6px 16px rgba(53,70,144,.06)}
.dock-st{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dock-nav{display:flex;gap:8px;margin-left:auto;white-space:nowrap}
.btn{
  border:1px solid var(--bg-grid);background:var(--surface);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-weight:700;font-size:12.5px;
  transition:all .28s var(--ease-elastic);
}
.btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 16px rgba(53,70,144,.14)}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.opt:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.primary{background:linear-gradient(148deg,#4A5FA8 0%,#354690 100%);color:#EDF1F7;border-color:var(--primary-deep)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.on-ok{border-color:var(--success);color:var(--success);background:rgba(59,138,110,.1)}
.btn.on-img{border-color:var(--primary);color:var(--primary-deep);background:rgba(74,95,168,.12)}

.card{background:var(--surface);border:1px solid var(--bg-grid);border-radius:var(--radius);padding:13px 15px;margin-bottom:14px;box-shadow:0 2px 8px rgba(53,70,144,.06)}
.card h3{font-size:14px;letter-spacing:-0.048em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec{font-size:11px;color:var(--text-muted);margin:0 0 6px}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.7;max-height:420px;overflow:auto;padding-right:4px}
mark{background:none;color:inherit;border-radius:3px;padding:0 1px}
mark.q{background:rgba(201,154,59,.28);box-shadow:inset 0 -2px 0 var(--warning)}
mark.s{background:rgba(74,95,168,.16);box-shadow:inset 0 -2px 0 var(--primary);cursor:help}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-top:8px}
.legend mark{padding:0 6px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs img{height:92px;max-width:170px;object-fit:contain;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in;transition:transform .28s var(--ease-elastic)}
.imgs img:hover{transform:scale(1.04)}
.slide-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.slide-h h3{margin:0}
/*__SLIDE_PREVIEW_CSS__*/
.slide.big{width:min(94vw,150vh);max-height:92vh;cursor:zoom-out}
.slide-note{font-size:11px;color:var(--text-muted);margin-top:6px}
.syn{margin-top:10px;border:1px dashed var(--primary-soft);border-radius:var(--radius-sm);padding:8px 10px;background:rgba(107,130,196,.07)}
.syn .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.syn select,.syn input{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);min-width:0}
.synlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.synlist .it{display:flex;gap:8px;align-items:center;font-size:12px}
.x{border:0;background:none;cursor:pointer;color:var(--danger);font-weight:700;padding:0 4px}
.rvbadge{font-size:10.5px;font-weight:700;color:#8a6718;border:1px solid var(--warning);background:rgba(201,154,59,.1);border-radius:999px;padding:0 7px}
.rvwrap{margin-top:6px}
.rvbox{margin-top:8px;border:1px dashed var(--warning);border-radius:var(--radius-sm);padding:8px 10px;background:rgba(201,154,59,.06)}
.rvbox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rvbox .row:first-child{margin-top:0}
.rvbox .k{font-size:11px;color:var(--text-muted)}
.rvbox select,.rvbox input,.rvbox textarea{border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base);min-width:0}
.rvbox textarea{width:100%;height:72px;resize:vertical;line-height:1.5}
.rvbox .cnt{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.evbox{margin-top:8px;border:1px dashed var(--primary-soft);border-radius:var(--radius-sm);padding:8px 10px;background:rgba(107,130,196,.06)}
.evbox.on{border-style:solid;border-color:var(--primary)}
.evbox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.evbox .row:first-child{margin-top:0}
.evbox .k{font-size:11px;color:var(--text-muted)}
.evbox .btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.evbox textarea{width:100%;height:52px;resize:vertical;line-height:1.5;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base)}
.evbox .cnt{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.evit{display:flex;gap:6px;align-items:baseline;font-size:12px;margin-top:4px;word-break:break-word}
.evit .src{font-size:10.5px;font-weight:700;color:var(--primary-deep);border:1px solid var(--primary-soft);border-radius:5px;padding:0 5px;white-space:nowrap}
.evhint{font-size:11.5px;color:var(--primary-deep)}
.evbox input.evtype{flex:1;min-width:160px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:4px 8px;background:var(--bg-base)}
.evit .src.typed{color:var(--attn-ink);border-color:var(--attn-line);background:var(--attn-bg)}
.ctl .ctlhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:8px 4px 2px}
.ctl .ctlhead .tgt{font-weight:700}
.ctl .ans-o{color:#b42318;border-color:#b42318;background:rgba(180,35,24,.08)}
.evon{outline:2px dashed var(--primary);outline-offset:3px;cursor:text}
.ctxwrap{max-height:420px;overflow:auto;padding-right:4px}
.ctxline{font-size:12px;margin-bottom:4px;word-break:break-all}
.ctxline .k{color:var(--text-muted);font-size:11px;margin-right:6px}
.ctxs{border-top:1px dashed var(--bg-grid);padding:6px 4px}
.ctxs.cur{background:rgba(74,95,168,.07);border-radius:var(--radius-sm)}
.ctxs .no{font-family:var(--mono);font-size:11px;color:var(--primary)}
.ctxs .t{font-weight:700;font-size:12.5px}
.ctxs .b{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6}
.rvnote{font-size:12px;color:#8a6718;border:1px dashed var(--warning);border-radius:var(--radius-sm);padding:5px 9px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.axis{padding:10px 0;border-top:1px dashed var(--bg-grid)}
.axis:first-of-type{border-top:0;padding-top:0}
.axhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.axhead b{font-size:13.5px}
.badge{font-size:10px;border:1px solid var(--bg-grid);border-radius:5px;padding:0 5px;color:var(--text-muted)}
.axdef{font-size:11.5px;color:var(--text-muted);margin:1px 0 6px}
.botline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:3px}
.botline .k{color:var(--text-muted);font-size:11px}
.v{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;border:1px solid var(--primary);background:rgba(74,95,168,.12);color:var(--primary-deep);cursor:help}
.v.na{border-color:var(--line);background:transparent;color:var(--text-muted)}
.v.unk{border:1px dashed var(--warning);background:rgba(201,154,59,.1);color:#8a6718}
.ev{font-size:12px;color:var(--text-strong);border-left:2px solid var(--warning);padding-left:8px;margin:3px 0;word-break:break-word}
.conf{font-family:var(--mono);font-size:11px}
.defs{margin:4px 0 6px;font-size:11.5px}
.defs summary{cursor:pointer;color:var(--primary)}
.defs dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.defs dt{font-weight:700}
.defs dd{margin:0;color:var(--text-muted)}
.defs dt.botv{color:var(--primary-deep)}
.edit{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.edit .k{font-size:11px;color:var(--text-muted);margin-right:2px}
.opt{
  border:1px solid var(--bg-grid);background:transparent;border-radius:var(--radius-sm);padding:2px 10px;cursor:pointer;font-size:12px;
  transition:all .28s var(--ease-elastic);
}
.opt:hover{transform:translateY(-1px);border-color:var(--primary)}
.opt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#EDF1F7;font-weight:700}
.opt.sp{border-style:dashed}
.opt.sp[aria-pressed="true"]{background:var(--text-strong);border-color:var(--text-strong)}
.opt:disabled{opacity:.45;cursor:not-allowed;transform:none}
.axjump{margin:2px 0 8px}
.changed{font-size:10.5px;color:var(--primary-deep);font-weight:700;border:1px solid var(--primary-soft);background:rgba(107,130,196,.14);border-radius:999px;padding:0 7px}
.qhead{display:flex;gap:8px;align-items:baseline}
.qhead .qid{font-size:11px;color:var(--primary)}
.ans{font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--primary);border-radius:6px;padding:0 8px;background:rgba(74,95,168,.12);color:var(--primary-deep)}
.note{font-size:12px;color:var(--text-muted);border:1px dashed var(--bg-grid);border-radius:var(--radius-sm);padding:5px 9px;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bg-grid);padding:4px 8px;text-align:left;vertical-align:top;word-break:break-word}
th{background:var(--surface-2);font-weight:700}
.emptystate{max-width:520px;margin:14vh auto;text-align:center;color:var(--text-muted)}
.emptystate h2{color:var(--text-strong);font-size:22px;letter-spacing:-0.055em;margin-bottom:8px}

dialog{border:1px solid var(--bg-grid);border-radius:var(--radius);background:var(--surface);color:var(--text-strong);width:min(640px,92vw);padding:18px}
dialog::backdrop{background:rgba(30,45,74,.35)}
dialog textarea{width:100%;height:240px;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);padding:10px;font-family:var(--mono);font-size:12px;background:var(--bg-base);letter-spacing:-0.01em}
dialog h3{margin-bottom:6px;font-size:16px}
dialog p{margin:0 0 10px;font-size:12.5px;color:var(--text-muted)}
.zoom{position:fixed;inset:0;background:rgba(30,45,74,.7);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:92vw;max-height:92vh;border-radius:var(--radius-sm);background:var(--bg-base)}
.zoom .zcap{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:var(--radius-sm)}
.sibs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sib-view{display:block;width:100%;max-height:300px;object-fit:contain;border:1px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:zoom-in}
.sib-cap{font-size:11.5px;color:var(--text-muted);margin:4px 0 8px}
.sib{flex:0 0 auto;position:relative;padding:0;border:2px solid var(--bg-grid);border-radius:var(--radius-sm);background:var(--bg-base);cursor:pointer}
.sib img{display:block;height:72px;border-radius:var(--radius-sm)}
.sib.cur{border-color:var(--primary)}
.sib .no{position:absolute;left:3px;bottom:3px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:0 4px;border-radius:3px}
.sib .fl{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:#e5484d}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text-strong);color:#EDF1F7;padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;opacity:0;transform:translateY(8px);transition:all .32s var(--ease-elastic);pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}

@media (max-width:1180px){
  .detail{display:block;overflow:auto}
  .work{display:block}
  .pane{overflow:visible;padding:14px 20px}
  .pane.ev{border-right:0;border-bottom:1px solid var(--bg-grid)}
  .dock{position:sticky;bottom:0;z-index:5}
}
@media (max-width:860px){
  .app{height:auto}
  .cols{grid-template-columns:1fr}
  .list{border-right:0;border-bottom:1px solid var(--bg-grid)}
  .items{max-height:260px}
  .detail{overflow:visible;min-width:0}
  .dh{padding:12px 14px 10px}
  .pane{padding:12px 14px}
  .dock{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.axsum{display:none}
.qtext{margin:2px 0 6px}
.caret{font-size:11px;color:var(--primary);width:12px;display:inline-block}

/* 집중 모드: 목록은 좁은 레일, 축·질문은 하나씩 펼친다 */
.cols{grid-template-columns:92px 1fr}
.bar .filters{flex-basis:100%;border:0;padding:2px 0 0;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.bar .filters .lbl{display:none}
.bar .filters .chips{margin:0 !important}
.items{padding:8px 8px 30px}
.item{padding:9px 6px;text-align:center}
.item .l2, .item .tags, .item .l1 .id, .grp .gh{display:none}
.item .l1{flex-direction:column;gap:4px;margin:0;font-size:12px;color:var(--text-strong)}
.item .l1 > .mono{font-size:13px;font-weight:700}
.grp{padding-left:4px}
.work{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.axis{padding:0;border-top:1px solid var(--bg-grid)}
.axis:first-of-type{border-top:1px solid var(--bg-grid)}
.axis > .axhead, .axis > .qhead{cursor:pointer;padding:10px 4px;border-radius:var(--radius-sm);align-items:center}
.axis > .axhead:hover, .axis > .qhead:hover{background:rgba(107,130,196,.08)}
.axis:not(.closed){padding:0 0 14px}
.axis:not(.closed) > .axhead, .axis:not(.closed) > .qhead{background:rgba(74,95,168,.07)}
.axis:not(.closed) > :not(.axhead):not(.qhead){margin-left:16px}
.axis.closed > :not(.axhead):not(.qhead){display:none}
.axsum{display:inline;margin-left:auto;font-size:12px;color:var(--primary-deep);font-weight:700;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axis:not(.closed) .axsum{display:none}
.axis:not(.closed) .edit .opt{padding:5px 14px;font-size:13px}
.axhead:focus-visible,.qhead:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* axis-update 실행: 이번 축 변경 대상이 아닌 축(읽기 전용) 묶음 */
.lockgrp{margin-top:10px;border-top:1px solid var(--bg-grid);padding-top:8px}
.lockgrp > summary{cursor:pointer;font-size:12px;color:var(--text-muted);padding:4px}
.lockgrp > summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.lockgrp .axis > .axhead b{color:var(--text-muted)}
/* 확인 필요(확신도 낮음·unknown·검증 X·대조 O) 라벨 강조. 나머지는 lockgrp 묶음으로 접는다 */

<body>
<div id="root"></div>
<div class="zoom" id="zoom" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <h3>JSON 텍스트</h3>
  <p id="dlgP"></p>
  <textarea id="dlgTa" readonly aria-label="내보내기 JSON"></textarea>
  <div class="row" style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="dlgSel" type="button">전체 선택</button>
    <button class="btn primary" id="dlgClose" type="button">닫기</button>
  </div>
</dialog>

<script>
/*__SLIDE_PREVIEW_JS__*/
const DATA = /*__DATA__*/null;

(function(){
  "use strict";
  var root = document.getElementById("root");

  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }

  if (!DATA || DATA.kind !== "review"){
    root.appendChild(h("div", {class:"emptystate"}, [
      h("h2", {text:"표시할 데이터가 없습니다"}),
      h("p", {text:"이 화면은 labelbot review 명령이 불량 목록을 채워 넣은 뒤에 사용합니다. 검수 대상 데이터가 비어 있습니다."})
    ]));
    return;
  }

  var SPECIAL = ["해당 없음", "unknown", "판단 불가"];
  var ACC = true;                 // 축·질문을 하나씩 펼친다(머리를 누르면 그것만 펼친다)
  var accOpen = null;             // 펼친 축·질문 키("a:축"·"q:qid")
  function accToggle(key){
    accOpen = accOpen === key ? null : key;
    renderDetail(true);
    var el = document.querySelector('#decpane [data-acc="' + key.replace(/"/g, '\\"') + '"] > [role="button"]');
    if (el) el.focus({preventScroll:true});
  }
  var ANSWERS = ["O", "X", "N/A", "판단 불가"];
  var COM_Q = DATA.primary_qid || null;  // questions 시트의 첫 공통 질문(분류 실패 chunk가 판정하는 질문)
  var flag = DATA.flag || {};
  var reasonLabels = DATA.reason_labels || {};
  var axes = DATA.axes || [];
  // 이 실행이 라벨링한 축만 고칠 수 있다. pending(실행 뒤 더해진 축)·removed(taxonomy에서 빠진 축)는 읽기 전용이다.
  // editable 칸이 없는 예전 화면 데이터는 모두 고칠 수 있다.
  function canEdit(ax){ return ax.editable !== false; }
  var editAxes = axes.filter(canEdit);
  // axis-update 실행: 대상 축만 고친다. locked 축(이번 축 변경 대상 아님)은 접힌 읽기 전용 묶음, 질문 답 편집 영역은 숨긴다.
  var AXU = DATA.axis_update || null;
  var qtext = {};
  (DATA.questions || []).forEach(function(q){ qtext[q.qid] = q.text; });
  var chunks = DATA.chunks || [];
  var byId = {};
  chunks.forEach(function(c){ byId[c.chunk_id] = c; });

  // ---------- state ----------
  var KEY = "labelbot_review_" + DATA.run_id;
  var edits = {};     // chunk_id -> {"a:axis": [..], "q:qid": "O"}
  var status = {};    // chunk_id -> confirmed | undecidable_image
  var syns = [];      // {chunk_id, alias, canonical}
  var revisits = [];  // {chunk_id, target, key, reason, proposed, related_values, memo}
  var rvDraft = null; // 열려 있는 재검토 요청 폼의 초안(저장 버튼을 누를 때만 revisits에 반영)
  var locked = false; // 검수 완료 뒤 true. 화면을 안내로 바꾸고 저장·편집을 막는다.
  var activeReasons = {};
  var onlyTodo = false;
  var onlyRevisit = false;
  var selId = null;
  var pendingAlias = "";
  // 교정 근거: chunk_id -> {"a:축"|"q:qid"|"c:대조qid": {items:[{source, chunk_id, quote}], reason}}. edits와 같은 저장 키에 둔다.
  // source typed는 근거 칸에 직접 친 문장 중 본문·파일명·문서 제목에서 찾지 못한 것이다(chunk_id 없음).
  // DATA.file_ctx가 없으면(예전 화면 데이터) 기능을 숨긴다.
  var evid = {};
  var evMode = null;  // 근거 지정 중이면 {chunk_id, key}. 이때 드래그는 동의어 제안 대신 근거로 잡는다.
  var FILE_CTX = DATA.file_ctx || null;
  var evOn = !!FILE_CTX;
  var EV_MAX = DATA.evidence_max || 3;
  var EV_QUOTE_MAX = DATA.evidence_quote_max || 300;
  var EV_REASON_MAX = DATA.evidence_reason_max || 300;
  var EV_SOURCES = ["chunk", "file_name", "doc_title", "typed"];

  // taxonomy 재검토 요청: DATA에 규칙이 없으면(예전 화면 데이터) 기능을 숨긴다.
  var RV_REASONS = DATA.revisit_reasons || null;
  var RV_RULES = DATA.revisit_rules || null;
  var rvOn = !!(RV_REASONS && RV_RULES);
  var RV_MEMO_MAX = DATA.revisit_memo_max || 500;
  var RV_SHORT_MAX = DATA.revisit_short_max || 60;
  // 백엔드 taxonomy.RESERVED·KEY_MAX와 같은 값. 예약어는 norm_key(NFKC, 소문자, 공백 제거)로 비교한다.
  var RV_RESERVED = ["해당없음", "unknown", "n/a", "na"];
  var RV_KEY_MAX = 100;
  function rvNormKey(s){ return String(s).normalize("NFKC").toLowerCase().replace(/\s+/g, ""); }

  function load(){
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o.edits) edits = o.edits;
      if (o.status) status = o.status;
      if (o.syns) syns = o.syns;
      if (Array.isArray(o.revisits)){ revisits = o.revisits.filter(function(r){ return r && typeof r === "object"; }); rvByChunk = null; }
      if (o.evid && typeof o.evid === "object" && !Array.isArray(o.evid)) evid = o.evid;
    } catch(e){}
  }
  var saveT = null;
  function save(){
    if (locked) return;
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try { window.localStorage.setItem(KEY, JSON.stringify({edits:edits, status:status, syns:syns, revisits:revisits, evid:evid})); } catch(e){}
      inboxSave();
    }, 150);
  }
  function hasState(){
    return Object.keys(edits).length > 0 || Object.keys(status).length > 0 || syns.length > 0 || revisits.length > 0;
  }

  // ---------- inbox 자동 저장(labelbot serve로 열었을 때만) ----------
  var inboxOn = false, inboxEl = null;
  function setInbox(msg, bad){
    if (!inboxEl) return;
    inboxEl.textContent = msg;
    inboxEl.style.color = bad ? "var(--danger)" : "";
  }
  function inboxCheck(){
    if (location.protocol === "file:" || !window.fetch) return;
    fetch("inbox/status?run=" + encodeURIComponent(DATA.run_id), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(o){
        if (!o || !o.ok) return;
        // 이 실행의 완료 신호가 이미 있으면(검수 완료 뒤 새로 고침) 바로 잠근다. inbox를 다시 쓰지 않는다.
        if (o.done_signal === true){ lockScreen(null, null); return; }
        inboxOn = true;
        setInbox("체크하면 작업 폴더 inbox에 자동 저장");
        if (o.done && doneBtn){ doneBtn.disabled = false; doneBtn.title = "마지막 교정을 저장하고 반영·적재로 넘깁니다"; }
        if (hasState()) inboxSave();
      }).catch(function(){});
  }
  function inboxSave(){
    if (locked) return Promise.resolve(false);
    if (!inboxOn) return Promise.resolve(false);
    return fetch("inbox/review", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(buildOutput())})
      .then(function(r){
        if (!r.ok) throw new Error(String(r.status));
        setInbox("inbox 저장됨 " + new Date().toTimeString().slice(0, 8));
        return true;
      })
      .catch(function(){ setInbox("inbox 저장 실패: JSON 저장 버튼으로 내려받으세요", true); return false; });
  }

  // ---------- 검수 완료(늘 보이고, 검수 완료 신호를 받는 labelbot serve로 열었을 때만 누를 수 있다) ----------
  // 마지막 교정을 inbox에 저장하고 완료 신호를 남긴다. BEOL-labeling-feedback 스킬이 신호를 보고 반영·적재로 넘어간다.
  var doneBtn = null;
  function reviewDone(){
    if (!inboxOn) return;
    var o = buildOutput();
    var msg = "검수를 마치고 반영·적재로 넘길까요?\n교정 " + o.corrections.length + "건, 상태 표시 " + o.chunk_status.length +
      "건, 동의어 " + o.synonyms.length + "건" + (o.revisits ? ", 재검토 요청 " + o.revisits.length + "건" : "") +
      "\n교정할 것이 없어도 완료할 수 있습니다.";
    if (!window.confirm(msg)) return;
    clearTimeout(saveT);
    try { window.localStorage.setItem(KEY, JSON.stringify({edits:edits, status:status, syns:syns, revisits:revisits, evid:evid})); } catch(e){}
    doneBtn.disabled = true;
    fetch("inbox/review/done", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(o)})
      .then(function(r){
        if (!r.ok) throw new Error(String(r.status));
        lockScreen(new Date().toTimeString().slice(0, 8), o);
        toast("검수 완료를 알렸습니다. 반영·적재가 이어집니다");
      })
      .catch(function(){
        setInbox("검수 완료 전송 실패: 다시 누르거나 채팅으로 '검수 끝났어'라고 알려 주세요", true);
        doneBtn.disabled = false;
      });
  }
  // 검수 완료 뒤 안내 화면. 본문을 지우고 건수만 보여 준다(교정 내용·본문은 싣지 않는다). 다시 검수하는 길은 없다.
  // at: 완료 시각(새로 고침으로 잠근 경우 null), o: 완료 때 보낸 출력(없으면 이 브라우저에 남은 상태로 센다).
  function lockScreen(at, o){
    if (locked) return;
    locked = true;
    clearTimeout(saveT);
    rvDraft = null; evMode = null;
    if (zoom.classList.contains("on")) closeZoom();
    o = o || buildOutput();
    function n(k){ return Array.isArray(o[k]) ? o[k].length : 0; }
    root.textContent = "";
    root.appendChild(h("div", {class:"emptystate lockscreen", role:"status"}, [
      h("h2", {text:"검수 완료 · 반영·적재 진행 중"}),
      h("p", {text:"이 탭은 닫아도 됩니다. 교정 반영과 적재는 작업 대화에서 이어집니다."}),
      h("p", {class:"mono", text:"실행 " + DATA.run_id + (at ? "  ·  완료 " + at : "  ·  완료 신호 확인됨")}),
      h("p", {text:"교정 " + n("corrections") + "건 · 상태 " + n("chunk_status") + "건 · 동의어 " + n("synonyms") + "건 · 재검토 " + n("revisits") + "건"})
    ]));
  }

  // ---------- bot values / corrections ----------
  function botAxis(c, name){
    if (c.classify_failed) return null;
    var a = c.axes && c.axes[name];
    return a && a.values && a.values.length ? a : null;
  }
  function isOX(c, qid){
    var b = botAnswer(c, qid);
    return !!b && (b.answer === "O" || b.answer === "X");
  }
  function botAnswer(c, qid){
    if (c.label_failed) return null;
    var a = c.answers && c.answers[qid];
    return a && a.answer ? a : null;
  }
  function sameSet(a, b){
    if (a.length !== b.length) return false;
    var x = a.slice().sort(), y = b.slice().sort();
    for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
    return true;
  }
  function curAxis(c, name){
    var e = edits[c.chunk_id];
    if (e && e["a:" + name]) return e["a:" + name];
    var b = botAxis(c, name);
    return b ? b.values.slice() : [];
  }
  function curAnswer(c, qid){
    var e = edits[c.chunk_id];
    if (e && e["q:" + qid]) return e["q:" + qid];
    var b = botAnswer(c, qid);
    return b ? b.answer : "";
  }
  function chunkCorrections(c){
    var out = [], e = edits[c.chunk_id] || {};
    editAxes.forEach(function(ax){
      var v = e["a:" + ax.name];
      if (!v || !v.length) return;
      var b = botAxis(c, ax.name);
      if (!b || !sameSet(b.values, v)) out.push(evAttach(c.chunk_id, "a:" + ax.name, {chunk_id:c.chunk_id, target:"axis", key:ax.name, value:v.slice(), status:"corrected"}));
    });
    questionIds(c).forEach(function(qid){
      var v = e["q:" + qid];
      if (!v) return;
      var b = botAnswer(c, qid);
      if (!b || b.answer !== v) out.push(evAttach(c.chunk_id, "q:" + qid, {chunk_id:c.chunk_id, target:"answer", key:qid, value:v, status:"corrected"}));
    });
    controlsOf(c).forEach(function(x){
      var v = e["c:" + x.qid];
      if (v && v !== x.answer) out.push(evAttach(c.chunk_id, "c:" + x.qid, {chunk_id:c.chunk_id, target:"control", key:x.qid, value:v, status:"corrected"}));
    });
    return out;
  }
  // 대조 질문(Q-CTL-). axis-update 실행·3차 실패 chunk는 대조 질문을 검수하지 않는다.
  function controlsOf(c){
    return AXU || c.label_failed ? [] : (c.controls || []).filter(function(x){ return x && x.qid; });
  }
  // 교정 항목에 근거·이유를 붙인다. 있을 때만 키를 넣어, 근거 없는 교정은 예전 출력과 같다.
  function evValid(x){
    return !!x && typeof x === "object" && EV_SOURCES.indexOf(x.source) >= 0 && typeof x.quote === "string" &&
      (x.source !== "chunk" || typeof x.chunk_id === "string");
  }
  function evAttach(cid, k, item){
    var ev = evOn && evid[cid] && evid[cid][k];
    if (!ev) return item;
    var items = (Array.isArray(ev.items) ? ev.items : []).filter(evValid).slice(0, EV_MAX).map(function(x){
      var o = {source:x.source, quote:x.quote};
      if (x.source === "chunk") o.chunk_id = x.chunk_id;
      return o;
    });
    if (items.length) item.evidence = items;
    var r = String(ev.reason || "").replace(/\s+/g, " ").trim();
    if (r) item.reason = Array.from(r).slice(0, EV_REASON_MAX).join("");
    return item;
  }
  function questionIds(c){
    if (AXU) return [];
    if (c.classify_failed) return COM_Q ? [COM_Q] : [];
    var seen = {}, out = [];
    (c.mapped_questions || []).forEach(function(q){ if (!seen[q]){ seen[q] = 1; out.push(q); } });
    return out;
  }

  // ---------- taxonomy 재검토 요청: 규칙·검증 ----------
  function axisByName(name){
    for (var i = 0; i < axes.length; i++) if (axes[i].name === name) return axes[i];
    return null;
  }
  function rvReasonsFor(target, key){
    if (!rvOn) return [];
    var k = target === "question" && key === "" ? "question_blank" : target;
    return (RV_RULES[k] || []).slice();
  }
  function rvLabel(r){ return (RV_REASONS && RV_REASONS[r]) || r; }
  function rvIndex(cid, target, key){
    for (var i = 0; i < revisits.length; i++){
      var r = revisits[i];
      if (r.chunk_id === cid && r.target === target && r.key === key) return i;
    }
    return -1;
  }
  // 현재 화면 데이터 기준으로 유효한 대상인가(taxonomy가 바뀐 뒤 남은 오래된 항목을 거른다)
  function rvAllowed(c, r){
    if (!rvOn || !c || typeof r.key !== "string") return false;
    if (r.key.indexOf("|") >= 0 || rvLen(r.key) > RV_KEY_MAX) return false; // 백엔드가 FIELD_INVALID로 버리는 key
    if (rvReasonsFor(r.target, r.key).indexOf(r.reason) < 0) return false;
    if (r.target === "axis") return !!axisByName(r.key);
    if (r.target === "question") return r.key === "" || questionIds(c).indexOf(r.key) >= 0;
    return r.target === "new_axis" && r.key === "";
  }

      var v = r.proposed.value;
      if (!v) return r.reason === "NEW_AXIS" ? "제안할 축 이름을 입력하세요" : "제안 값을 입력하세요";

      if (!r.related_values[0] || !r.related_values[1]) return "겹치는 값 두 개를 고르세요";

  // ---------- body text with highlights ----------
  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    var res = [];
    if (!needle) return res;
    var i = text.indexOf(needle);
    if (i < 0){
      try {
        var m = new RegExp(esc(needle.trim()).replace(/\s+/g, "\\s+")).exec(text);
        if (m) res.push([m.index, m.index + m[0].length]);
      } catch(e){}
      return res;
    }
    while (i >= 0){
      res.push([i, i + needle.length]);
      if (!all) break;
      i = text.indexOf(needle, i + needle.length);
    }
    return res;
  }
  function quotePieces(q){
    return String(q || "").split(/…|\.\.\./).map(function(x){ return x.trim(); }).filter(function(x){ return x.length >= 2; });
  }
  function textNode(c){
    var text = c.text || "";
    var type = new Array(text.length), info = new Array(text.length), i;
    for (i = 0; i < text.length; i++) type[i] = 0;
    var quotes = [];
    if (!c.classify_failed) Object.keys(c.axes || {}).forEach(function(k){ quotes.push(c.axes[k].evidence); });
    if (!c.label_failed){
      Object.keys(c.answers || {}).forEach(function(k){ quotes.push(c.answers[k].quote); });
      (c.extracted || []).forEach(function(x){ quotes.push(x.quote); });
      (c.controls || []).forEach(function(x){ if (x.answer === "O") quotes.push(x.quote); });
    }
    quotes.forEach(function(q){
      quotePieces(q).forEach(function(p){
        findAll(text, p, false).forEach(function(r){ for (var j = r[0]; j < r[1]; j++) type[j] = 1; });
      });
    });
    var aliases = [];
    (c.synonym_matches || []).forEach(function(s){ aliases.push({alias:s.alias, canonical:s.canonical}); });
    syns.forEach(function(s){ if (s.chunk_id === c.chunk_id) aliases.push({alias:s.alias, canonical:s.canonical}); });
    aliases.forEach(function(s){

  function evGet(cid, k, create){
    var m = evid[cid];
    if (!m || typeof m !== "object"){ if (!create) return null; m = evid[cid] = {}; }
    var ev = m[k];

  }
  function evKeys(c){ // 이 chunk에서 교정된 축·질문 키("a:축", "q:qid")
    return chunkCorrections(c).map(function(x){ return (x.target === "axis" ? "a:" : x.target === "control" ? "c:" : "q:") + x.key; });
  }
  function evKeyLabel(k){ return k.slice(2); }

    if (x.chunk_id === c.chunk_id) return "같은 슬라이드";
    var no = evSlideNo(c, x.chunk_id);

  function evRegion(node){
    var n = node && node.nodeType === 1 ? node : node && node.parentNode;

  function evCapture(){

    if (!c || evMode.chunk_id !== c.chunk_id || evKeys(c).indexOf(evMode.key) < 0){ evMode = null; renderDetail(true); return; }
    var a = evRegion(sel.anchorNode), b = evRegion(sel.focusNode);
    if (!a || a !== b){ toast("근거는 본문·슬라이드 제목·슬라이드 본문·파일명·문서 제목 중 한 칸 안에서 드래그하세요"); return; }

    if (item.source === "chunk") item.chunk_id = a.getAttribute("data-ev-chunk");
    var ev = evGet(c.chunk_id, evMode.key, true);
    if (ev.items.some(function(x){ return x.source === item.source && x.chunk_id === item.chunk_id && x.quote === q; })){
      toast("이미 넣은 근거입니다"); return;
    }
    if (ev.items.length >= EV_MAX){ toast("근거는 " + EV_MAX + "개까지 넣을 수 있습니다"); return; }
    ev.items.push(item);

    try { sel.removeAllRanges(); } catch(e){}

  function onEvSelect(){ if (evMode) evCapture(); }
  // 직접 입력한 근거: 지금 슬라이드 → 같은 파일 다른 슬라이드 → 파일명 → 문서 제목 순으로 찾아(서버 인용 검사와 같은 정규화)
  // 있으면 그 칸 근거로, 없으면 typed 근거로 넣는다.
  function evNorm(s){
    return String(s || "").normalize("NFKC").replace(/[‐-―−－﹣]/g, "-").replace(/\s+/g, " ").trim().toLowerCase();
  }
  function evLocate(c, q){
    var ctx = FILE_CTX && FILE_CTX[c.file_id], n = evNorm(q);
    var slides = ctx ? (ctx.slides || []).slice() : [];
    if (!slides.some(function(s){ return s.chunk_id === c.chunk_id; })) slides.push({chunk_id:c.chunk_id, title:c.title, text:c.text});
    slides.sort(function(a, b){ return (a.chunk_id === c.chunk_id ? 0 : 1) - (b.chunk_id === c.chunk_id ? 0 : 1); });
    for (var i = 0; i < slides.length; i++){
      if (evNorm(slides[i].title).indexOf(n) >= 0 || evNorm(slides[i].text).indexOf(n) >= 0) return {source:"chunk", chunk_id:slides[i].chunk_id};
    }
    if (ctx && evNorm(ctx.file_name).indexOf(n) >= 0) return {source:"file_name"};
    if (ctx && ctx.doc_title && evNorm(ctx.doc_title).indexOf(n) >= 0) return {source:"doc_title"};

  function evAddTyped(c, k, text){
    var q = String(text || "").replace(/\s+/g, " ").trim(), n = rvLen(q);
    if (n < 2 || n > EV_QUOTE_MAX){ toast("근거는 2~" + EV_QUOTE_MAX + "자로 입력하세요"); return false; }
    var ev = evGet(c.chunk_id, k, true);
    if (ev.items.length >= EV_MAX){ toast("근거는 " + EV_MAX + "개까지 넣을 수 있습니다"); evPrune(c.chunk_id, k); return false; }

    if (ev.items.some(function(x){ return x.source === item.source && x.chunk_id === item.chunk_id && x.quote === q; })){
      toast("이미 넣은 근거입니다"); return false;

    toast(item.source === "typed" ? "본문에 없는 문장이라 '직접 입력' 근거로 넣었습니다" : "본문에서 찾아 '" + evWhere(c, item) + "' 근거로 넣었습니다");

  function evCopyToOthers(c, k){

  // 교정된 축·질문 카드 아래의 근거 상자. 근거 기능이 꺼져 있으면 null.
  function evBox(c, k){

  // ---------- taxonomy 재검토 요청: 입력 폼 ----------

    rvDraft = {chunk_id:c.chunk_id, target:target, key:key,
      reason:r && reasons.indexOf(r.reason) >= 0 ? r.reason : reasons[0],
      value:r && r.proposed ? r.proposed.value || "" : "", parent:r && r.proposed ? r.proposed.parent || "" : "",
      rel:r ? (r.related_values || []).slice() : [], memo:r ? r.memo || "" : "", dirty:false, focus:true};

  // 열린 폼, 그리고 NO_FIT_VALUE 요청이 있는데 unknown으로 교정하지 않은 축의 안내. 보일 것이 없으면 null.
  function rvPanel(c, target, key, ax, withBadge){

  function rvForm(c, ax){

        h("button", {class:"btn sm", type:"button", text:"닫기", onclick:function(){ rvDraft = null; renderDetail(true); }}),

  // ---------- 확인 필요(attention) ----------
  // DATA chunk.attention = {axes:{축:[사유]}, questions:{qid:[사유]}}. 이 칸이 없는 예전 화면 데이터는
  // 확신도 미만(LOW_CONF)과 unknown 값(UNKNOWN)만 화면에서 직접 판정한다. 확인 여부는 강제·추적하지 않는다.
  var ATTN_LABELS = {LOW_CONF:"확신도 낮음", UNKNOWN:"unknown", VERIFY_X:"검증 X", CONTROL_O:"대조 O", OX_SAMPLE:"표본 확인"};
  function lowConf(x){
    return x !== null && x !== undefined && flag.confidence_min !== undefined && x < flag.confidence_min - 1e-12;

  function attnList(v){ return Array.isArray(v) ? v : []; }

    var b = botAxis(c, ax.name), out = [];

    if (b && b.values.indexOf("unknown") >= 0) out.push("UNKNOWN");
    return out;
  }
  function attnQ(c, qid){
    if (c.attention) return attnList(c.attention.questions && c.attention.questions[qid]);

  }
  function attnTags(list){

  }
  function attnCount(c){

      questionIds(c).filter(function(qid){ return attnQ(c, qid).length; }).length;
  }
  // chunk를 고를 때 처음 펼칠 것: 첫 확인 필요 축, 없으면 첫 확인 필요 질문. 확인 필요가 없으면 모두 접는다.
  function firstAccFor(c){
    if (!c) return null;
    var ax = editAxes.filter(function(a){ return attnAxis(c, a).length; })[0];
    if (ax) return "a:" + ax.name;
    var q = questionIds(c).filter(function(qid){ return attnQ(c, qid).length; })[0];
    return q ? "q:" + q : null;
  }
  // 확인 필요도 아니고 이번 검수에서 고치지도 않은 축·질문은 "확신도 높음 n개 · 펼치기" 한 줄로 접는다.
  // 펼침 상태는 chunk·종류("a"·"q")별로 기억해, 클릭마다 다시 그려도 접히지 않는다.

  }

  function axisCard(c, ax){

      onclick:function(ev){ if (ev.target.closest("button")) return; accToggle(accKey); },
      onkeydown:function(ev){ if (ev.target !== ev.currentTarget || (ev.key !== "Enter" && ev.key !== " ")) return; ev.preventDefault(); accToggle(accKey); }}, [

    ].concat(attnTags(attn), [
      changed ? h("span", {class:"changed", text:"교정됨"}) : null, lock ? h("span", {class:"rvbadge", text:lock}) : rvBadge(c, "axis", ax.name),
      h("span", {class:"axsum", text:ax.pending ? "이 실행에 없음" : cur.length ? cur.join(", ") : "값 없음"})
    ])));

    if (ax.pending) wrap.appendChild(h("div", {class:"note", text:"이 실행 뒤에 taxonomy에 더해진 축이라 라벨이 없고 고칠 수 없습니다. 다시 라벨링하면 값이 붙습니다."}));
    else if (ax.inactive) wrap.appendChild(h("div", {class:"note", text:"이 실행은 라벨링했지만 지금 taxonomy에서는 사용하지 않는(비활성) 축입니다. 봇 값만 보여 주며 고칠 수 없습니다."}));
    else if (ax.removed) wrap.appendChild(h("div", {class:"note", text:"이 실행은 라벨링했지만 지금 taxonomy에는 없는 축입니다. 봇 값만 보여 주며 고칠 수 없습니다."}));

    if (!c.classify_failed && !ax.pending){

      });
      wrap.appendChild(h("details", {class:"defs"}, [h("summary", {text:"값 정의·판정 규칙 보기 (" + ax.values.length + ")"}), dl]));
    }

    wrap.appendChild(ed);

    return wrap;
  }
  function toggleAxis(c, ax, name, special){
    var e = edits[c.chunk_id] || (edits[c.chunk_id] = {});

  // ---------- 같은 파일 슬라이드에 같은 라벨 적용 ----------
  // 대상은 검수 목록(불량 chunk) 안의 같은 파일 chunk뿐이다. apply가 불량 목록 밖 chunk 교정을 받지 않기 때문이다.
  // 분류 축 값과 두 chunk에 공통인 질문 답만 복사하고, 상태·동의어·재검토 요청은 슬라이드마다 따로 둔다.
  function sameFileFlagged(c){

  }
  function applyToSameFile(c){
    var targets = sameFileFlagged(c);
    if (!targets.length) return;
    if (!window.confirm("같은 파일 불량 슬라이드 " + targets.length + "장의 분류 축·질문 답을 이 슬라이드 값으로 덮어씁니다.\n" +
      "질문은 두 슬라이드에 공통인 것만 바꾸고, 상태·동의어·재검토 요청은 그대로 둡니다.")) return;
    var srcQ = questionIds(c);
    targets.forEach(function(t){
      var e = edits[t.chunk_id] || (edits[t.chunk_id] = {});
      editAxes.forEach(function(ax){
        var v = curAxis(c, ax.name).slice(), b = botAxis(t, ax.name);
        if (!v.length || (b && sameSet(b.values, v))) delete e["a:" + ax.name];
        else e["a:" + ax.name] = v;
      });
      questionIds(t).forEach(function(qid){
        if (srcQ.indexOf(qid) < 0) return;
        var v = curAnswer(c, qid), b = botAnswer(t, qid);
        if (!v || (b && b.answer === v)) delete e["q:" + qid];
        else e["q:" + qid] = v;
      });
      if (!Object.keys(e).length) delete edits[t.chunk_id];
    });
    save(); renderList(); renderDetail(true);
    toast("같은 파일 " + targets.length + "장에 적용했습니다");
  }

  function questionCard(c, qid){
    var attn = attnQ(c, qid);
    var wrap = h("div", {class:"axis" + (attn.length ? " attn" : "")});
    var bot = botAnswer(c, qid), cur = curAnswer(c, qid);
    var edited = edits[c.chunk_id] && edits[c.chunk_id]["q:" + qid];
    var changed = edited && (!bot || bot.answer !== edited);
    var accKey = "q:" + qid;
    wrap.setAttribute("data-acc", accKey);

    wrap.appendChild(h("div", {class:"qhead", tabindex:"0", role:"button", "aria-expanded":String(accOpen === accKey),
      onclick:function(ev){ if (ev.target.closest("button")) return; accToggle(accKey); },
      onkeydown:function(ev){ if (ev.target !== ev.currentTarget || (ev.key !== "Enter" && ev.key !== " ")) return; ev.preventDefault(); accToggle(accKey); }}, [
      h("span", {class:"caret", text:accOpen === accKey ? "▾" : "▸", "aria-hidden":"true"}),
      h("span", {class:"qid mono", text:qid})
    ].concat(attnTags(attn), [
      changed ? h("span", {class:"changed", text:"교정됨"}) : null, rvBadge(c, "question", qid),
      h("span", {class:"axsum", text:cur || "답 없음"})
    ])));
    wrap.appendChild(h("div", {class:"qtext", text:qtext[qid] || "(질문 문장 없음)"}));
    if (!c.label_failed){
      var line = h("div", {class:"botline"}, [h("span", {class:"k", text:"봇"})]);
      if (bot){ line.appendChild(h("span", {class:"ans", text:bot.answer})); line.appendChild(confEl(bot.confidence)); }
      else line.appendChild(h("span", {class:"muted", text:"봇 답 없음"}));
      wrap.appendChild(line);
      if (bot && bot.quote) wrap.appendChild(h("div", {class:"ev", text:bot.quote}));
    }
    var ed = h("div", {class:"edit", role:"group", "aria-label":qid + " 교정"}, [h("span", {class:"k", text:"교정"})]);
    ANSWERS.forEach(function(a){
      ed.appendChild(h("button", {class:"opt" + (a === "판단 불가" ? " sp" : ""), type:"button", "aria-pressed":String(cur === a), text:a,
        onclick:function(){
          var e = edits[c.chunk_id] || (edits[c.chunk_id] = {});
          var b = botAnswer(c, qid);
          var next = cur === a ? "" : a;
          if (!next || (b && b.answer === next)) delete e["q:" + qid]; else e["q:" + qid] = next;
          if (!Object.keys(e).length) delete edits[c.chunk_id];
          save(); renderList(); renderDetail(true);
        }}));
    });
    wrap.appendChild(ed);
    var eb = changed ? evBox(c, "q:" + qid) : null;
    if (eb) wrap.appendChild(eb);
    if (rvOn) wrap.appendChild(h("div", {class:"rvwrap"}, [rvButton(c, "question", qid, "taxonomy 재검토 요청"), rvPanel(c, "question", qid, null, false)]));
    return wrap;
  }

  function controlCard(c, x){
    var k = "c:" + x.qid, e = edits[c.chunk_id] || {};
    var cur = e[k] || x.answer || "", changed = !!e[k] && e[k] !== x.answer;
    var wrap = h("div", {class:"axis ctl"});
    wrap.appendChild(h("div", {class:"ctlhead"}, [
      h("span", {class:"tgt", text:(x.axis || "") + " = " + (x.value || "")}),
      h("span", {class:"qid mono muted", text:x.qid}),
      changed ? h("span", {class:"changed", text:"교정됨"}) : null
    ]));
    wrap.appendChild(h("div", {class:"qtext", text:x.text || x.qid}));
    var line = h("div", {class:"botline"}, [h("span", {class:"k", text:"봇"}),
      h("span", {class:"ans" + (x.answer === "O" ? " ans-o" : ""), text:x.answer || "-"}), confEl(x.confidence)]);
    wrap.appendChild(line);
    if (x.quote) wrap.appendChild(h("div", {class:"ev", text:x.quote}));
    var ed = h("div", {class:"edit", role:"group", "aria-label":x.qid + " 대조 답 교정"}, [h("span", {class:"k", text:"교정"})]);
    ANSWERS.forEach(function(a){
      ed.appendChild(h("button", {class:"opt" + (a === "판단 불가" ? " sp" : ""), type:"button", "aria-pressed":String(cur === a), text:a,
        onclick:function(){
          var e2 = edits[c.chunk_id] || (edits[c.chunk_id] = {});
          var next = cur === a ? "" : a;
          if (!next || next === x.answer) delete e2[k]; else e2[k] = next;
          if (!Object.keys(e2).length) delete edits[c.chunk_id];
          save(); renderList(); renderDetail(true);
        }}));
    });
    wrap.appendChild(ed);
    var eb = changed ? evBox(c, k) : null;
    if (eb) wrap.appendChild(eb);
    return wrap;
  }

  // ---------- detail ----------
  function renderDetail(keep){
    var evP = document.getElementById("evpane"), decP = document.getElementById("decpane");
    var y = {d:detailEl.scrollTop, ev:evP ? evP.scrollTop : 0, dec:decP ? decP.scrollTop : 0};
    var ctxEl = document.getElementById("ctxtext"), ctxY = ctxEl ? ctxEl.scrollTop : 0;
    detailEl.textContent = "";
    var c = byId[selId];
    // 교정을 되돌려 근거 대상이 사라졌으면 근거 지정을 끝낸다.
    if (evMode && (!c || evMode.chunk_id !== c.chunk_id || evKeys(c).indexOf(evMode.key) < 0)) evMode = null;
    if (!c){
      detailEl.appendChild(h("div", {class:"emptystate"}, [h("h2", {text:"검수할 chunk가 없습니다"}), h("p", {text:"필터를 바꾸거나 해제해 보세요."})]));
      return;
    }
    var unkWarn = c.unknown_ratio !== null && c.unknown_ratio !== undefined && flag.unknown_ratio_min !== undefined && c.unknown_ratio >= flag.unknown_ratio_min;
    var confWarn = c.min_confidence !== null && c.min_confidence !== undefined && flag.confidence_min !== undefined && c.min_confidence < flag.confidence_min;
    function num(x){ return x === null || x === undefined ? "-" : Number(x).toFixed(2); }
    var nAttn = attnCount(c);
    detailEl.appendChild(h("div", {class:"dh"}, [
      h("div", {class:"dh-main"}, [
        h("h2", {text:c.file_name}),
        h("div", {class:"path mono", text:c.rel_path + "  ·  슬라이드 " + c.slide_no + "  ·  " + c.chunk_id + (c.dup_group ? "  ·  중복 묶음 " + c.dup_group : "")})
      ]),
      h("div", {class:"metrics"}, [
        h("div", {class:"tags"}, (c.reason_codes || []).map(function(r){
          var t = tagFor(r); t.textContent = r + " · " + (reasonLabels[r] || ""); t.style.fontSize = "10.5px"; return t;
        })),
        h("span", {class:"metric"}, [h("span", {class:"k", text:"unknown 비율"}), h("b", {class:"mono" + (unkWarn ? " warnc" : ""), text:num(c.unknown_ratio)})]),
        h("span", {class:"metric"}, [h("span", {class:"k", text:"최소 확신도"}), h("b", {class:"mono" + (confWarn ? " warnc" : ""), text:num(c.min_confidence)})]),
        h("span", {class:"metric", title:"확신도 낮음·unknown·검증 X·대조 O인 축·질문 수"}, [h("span", {class:"k", text:"확인 필요"}), h("b", {class:"mono" + (nAttn ? " warnc" : ""), text:String(nAttn)})])
      ])
    ]));

    var st = status[c.chunk_id];
    var nSame = sameFileFlagged(c).length;
    // 판정·이동은 두 칸 아래 고정 줄(dock). 어디까지 스크롤했든 바로 누를 수 있다.
    var dock = h("div", {class:"dock", role:"group", "aria-label":"이 chunk 판정과 이동"}, [h("div", {class:"dock-st"}, [
      h("button", {class:"btn" + (st === "confirmed" ? " on-ok" : ""), type:"button", "aria-pressed":String(st === "confirmed"), text:"확인, 이상 없음",
        onclick:function(){ setStatus(c, "confirmed"); }}),
      h("button", {class:"btn" + (st === "undecidable_image" ? " on-img" : ""), type:"button", "aria-pressed":String(st === "undecidable_image"), text:"판단 불가: 정보가 이미지에만 있음",
        onclick:function(){ setStatus(c, "undecidable_image"); }})]),
      h("div", {class:"dock-nav"}, [
        h("button", {class:"btn", type:"button", text:"◂ 이전 (k)", onclick:function(){ step(-1); }}),
        h("button", {class:"btn", type:"button", text:"다음 ▸ (j)", onclick:function(){ step(1); }})])
    ]);

    // 근거 칸
    var left = h("section", {class:"pane ev", id:"evpane", "aria-label":"근거"});
    var sp = slidePreview(c);
    if (sp){
      var sc = h("div", {class:"card"}, [
        h("div", {class:"slide-h"}, [
          h("h3", {text:"슬라이드 미리보기 (근사 배치)"}),
          h("button", {class:"btn", type:"button", text:"크게 보기", onclick:function(){ openSlideZoom(c); }})
        ]),
        sp,
        h("div", {class:"slide-note", text:"텍스트·표·삽입 그림을 원래 위치에 놓은 근사 화면입니다. 글꼴·색·도형·차트 그래프는 원본과 다릅니다."})
      ]);
      left.appendChild(sc);
    }
    var bodyCard = h("div", {class:"card"}, [h("h3", {text:"본문"})]);
    var bodyEl = textNode(c);
    if (evMode) bodyEl.classList.add("evon");
    bodyCard.appendChild(bodyEl);
    bodyCard.appendChild(h("div", {class:"legend"}, [
      h("span", {}, [h("mark", {class:"q", text:"근거"}), " 근거 인용"]),
      h("span", {}, [h("mark", {class:"s", text:"동의어"}), " 동의어 일치 (마우스를 올리면 표준어)"])
    ]));
    synBox = h("div", {class:"syn"});
    bodyCard.appendChild(synBox);
    left.appendChild(bodyCard);
    if (c.images && c.images.length){
      var ic = h("div", {class:"card"}, [h("h3", {text:"이미지 " + c.images.length + "개"})]);
      var box = h("div", {class:"imgs"});
      c.images.forEach(function(u, i){
        var im = document.createElement("img"); im.src = u; im.alt = "이미지 " + (i + 1);
        im.addEventListener("click", function(){ openZoom(u); });
        box.appendChild(im);
      });
      ic.appendChild(box); left.appendChild(ic);
    }
    left.appendChild(sibCard(c));
    var cc = evOn ? ctxCard(c) : null;
    if (cc) left.appendChild(cc);
    if (!c.label_failed && c.extracted && c.extracted.length){
      var tb = h("table"), thead = h("thead"), tr0 = h("tr");
      ["항목", "값", "근거"].forEach(function(t){ tr0.appendChild(h("th", {text:t})); });
      thead.appendChild(tr0); tb.appendChild(thead);
      var tbody = h("tbody");
      c.extracted.forEach(function(x){
        var tr = h("tr"); tr.appendChild(h("td", {text:x.item})); tr.appendChild(h("td", {text:x.value})); tr.appendChild(h("td", {text:x.quote || ""}));
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody);
      left.appendChild(h("div", {class:"card"}, [h("h3", {text:"추출된 날짜·담당자"}), tb]));
    }
    // 대조 질문(Q-CTL-): 이 chunk에 붙지 않은 라벨로 만든 질문. 답 교정은 확정 라벨에 들어가지 않고
    // Domain-Engr-bot 검수 결과(품질 신호)로만 간다. 축 교정으로 이어지므로 판정 칸 맨 위에 둔다.
    var ctls = controlsOf(c), ctlCard = null;
    if (ctls.length){
      ctlCard = h("div", {class:"card"}, [h("h3", {text:"대조 질문 (붙지 않은 라벨) " + ctls.length + "개"}),
        h("div", {class:"note", text:"봇 답이 틀렸으면 답을 고치고 근거를 넣으세요. 대조 답 교정은 Domain-Engr-bot 검수 결과로 가며 라벨은 바꾸지 않습니다. " +
          "O가 맞아 라벨이 빠진 것이면 아래 축에서 값을 따로 더하세요."})]);
      ctls.forEach(function(x){ ctlCard.appendChild(controlCard(c, x)); });
    }

    // 판정 칸
    var right = h("section", {class:"pane", id:"decpane", "aria-label":"판정"});
    if (nSame) right.appendChild(h("div", {class:"samefile"}, [
      h("button", {class:"btn", type:"button", text:"같은 파일 " + nSame + "장에 이 라벨 적용",
        title:"검수 목록에 있는 같은 파일 슬라이드에 이 슬라이드의 분류 축 값과 공통 질문 답을 똑같이 넣습니다",
        onclick:function(){ applyToSameFile(c); }}),
      h("span", {text:"분류 축 값과 공통 질문 답을 같은 파일 불량 슬라이드에 똑같이 넣습니다"})
    ]));
    if (ctlCard) right.appendChild(ctlCard);
    var axCard = h("div", {class:"card"}, [h("h3", {}, ["분류 · 상태 축",
      rvOn ? rvButton(c, "new_axis", "", "새 축 제안", "margin-left:auto") : null])]);
    var naPanel = rvOn ? rvPanel(c, "new_axis", "", null, true) : null;
    if (naPanel) axCard.appendChild(naPanel);
    if (c.classify_failed) axCard.appendChild(h("div", {class:"note", text:"1차 분류가 실패했습니다. 봇 값 없이 판정 칸만 표시합니다."}));
    // 축 나누기: 확인 필요 ∪ 이번 검수에서 고친 축은 펼친 쪽, 나머지 편집 가능 축은 접힌 묶음. 읽기 전용 축은 지금처럼 펼친 쪽.
    // 1차 분류가 실패한 chunk는 봇 값이 없어 모든 축을 사람이 채워야 하므로 접지 않는다.
    var ce = edits[c.chunk_id] || {};
    var axAttnN = 0, hotAxes = [], calmAxes = [];
    axes.forEach(function(ax){
      if (ax.locked) return;
      if (!canEdit(ax) || c.classify_failed){ hotAxes.push(ax); return; }
      var a = attnAxis(c, ax).length;
      if (a) axAttnN++;
      (a || ce["a:" + ax.name] ? hotAxes : calmAxes).push(ax);
    });
    var jumpAxes = axes.filter(function(ax){ return !ax.removed && !ax.locked; });
    var nActive = jumpAxes.length;
    if (nActive > 12){
      // 축이 많으면 위에 점프 칩을 두어 아코디언을 길게 내리지 않고 바로 펼친다
      axCard.appendChild(h("div", {class:"chips axjump", role:"group", "aria-label":"축으로 이동"}, jumpAxes.map(function(ax){
        return h("button", {class:"chip" + (attnAxis(c, ax).length ? " attn" : "") + (accOpen === "a:" + ax.name ? " on" : ""), type:"button", text:ax.name,
          onclick:function(){
            if (calmAxes.indexOf(ax) >= 0) openHigh["a:" + c.chunk_id] = true;
            accOpen = "a:" + ax.name; renderDetail(true);
            var el = document.querySelector('#decpane [data-acc="' + accOpen.replace(/"/g, '\\"') + '"]');
            if (el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
          }});
      })));
    }
    hotAxes.forEach(function(ax){ axCard.appendChild(axisCard(c, ax)); });
    if (calmAxes.length) axCard.appendChild(calmGroup(c, "a", axAttnN, calmAxes.map(function(ax){ return axisCard(c, ax); })));
    var lockedAxes = axes.filter(function(ax){ return ax.locked; });
    if (lockedAxes.length) axCard.appendChild(h("details", {class:"lockgrp"}, [
      h("summary", {text:"이번 축 변경 대상이 아닌 축 " + lockedAxes.length + "개 (읽기 전용)"})
    ].concat(lockedAxes.map(function(ax){ return axisCard(c, ax); }))));
    if (!axes.length) axCard.appendChild(h("div", {class:"muted", text:"축 정의가 없습니다."}));
    right.appendChild(axCard);

    var qids = questionIds(c);
    var qCard = h("div", {class:"card"}, [h("h3", {}, ["질문별 답",
      rvOn ? rvButton(c, "question", "", "필요한 질문 제안", "margin-left:auto") : null])]);
    var nqPanel = rvOn ? rvPanel(c, "question", "", null, true) : null;
    if (nqPanel) qCard.appendChild(nqPanel);
    if (c.classify_failed) qCard.appendChild(h("div", {class:"note", text:COM_Q ? "분류 실패 chunk는 질문 " + COM_Q + "만 판정합니다." : "분류 실패 chunk라 판정할 공통 질문이 없습니다."}));
    if (c.label_failed) qCard.appendChild(h("div", {class:"note", text:"3차 라벨링이 실패했습니다. 봇 답 없이 판정 칸만 표시합니다."}));
    var qAttnN = 0, hotQ = [], calmQ = [];
    if (!c.label_failed && !c.classify_failed && qids.some(function(q){ return isOX(c, q); }))
      qCard.appendChild(h("div", {class:"note", text:"O/X 답은 확신도와 관계없이 모두 펼쳐 둡니다. '표본 확인'은 확신도가 높은 O/X 중 무작위로 고른 카드라 더 꼼꼼히 봐 주세요."}));
    qids.forEach(function(q){
      // 3차 라벨링이 실패한 chunk는 봇 답이 없으므로 접지 않는다(분류 실패면 공통 질문 하나뿐이다)
      if (c.label_failed || c.classify_failed){ hotQ.push(q); return; }
      var a = attnQ(c, q).length;
      if (a) qAttnN++;
      // O/X 답은 확신도가 높아도(0.99여도 틀린다) 접지 않고 늘 펼친 쪽에 둔다. N/A·판단 불가만 접는다.
      (a || ce["q:" + q] || isOX(c, q) ? hotQ : calmQ).push(q);
    });
    hotQ.forEach(function(q){ qCard.appendChild(questionCard(c, q)); });
    if (calmQ.length) qCard.appendChild(calmGroup(c, "q", qAttnN, calmQ.map(function(q){ return questionCard(c, q); })));
    if (!qids.length) qCard.appendChild(h("div", {class:"muted", text:"이 chunk에 매핑된 질문이 없습니다."}));
    if (!AXU) right.appendChild(qCard);  // axis-update 실행은 2·3차를 다시 돌리지 않으므로 질문 답을 검수하지 않는다

    detailEl.appendChild(h("div", {class:"work"}, [left, right]));
    detailEl.appendChild(dock);
    renderSynBox();
    detailEl.scrollTop = keep ? y.d : 0;
    left.scrollTop = keep ? y.ev : 0;
    right.scrollTop = keep ? y.dec : 0;
    var ctxNew = document.getElementById("ctxtext");
    if (ctxNew && keep) ctxNew.scrollTop = ctxY;
  }
  function setStatus(c, s){
    if (status[c.chunk_id] === s) delete status[c.chunk_id]; else status[c.chunk_id] = s;
    save(); renderList(); renderDetail(true);
  }
  function step(d){
    var f = flat(visibleChunks());
    var i = -1;
    f.forEach(function(c, k){ if (c.chunk_id === selId) i = k; });
    var n = f[i + d];
    if (n){
      select(n.chunk_id);
      var el = itemsEl.querySelector('.item[data-id="' + n.chunk_id.replace(/"/g, '\\"') + '"]');
      if (el && el.scrollIntoView) el.scrollIntoView({block:"nearest", inline:"nearest"});
    }
  }
  document.addEventListener("keydown", function(ev){
    if (locked) return;
    var t = ev.target && ev.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (zoom.classList.contains("on")){
      // 확대 중에는 검수 이동(j/k)을 막는다. 같은 파일 슬라이드면 ←/→로 넘긴다.
      if (ev.key === "Escape") closeZoom();
      else if (sibZoom && ev.key === "ArrowRight") openSibZoom(sibZoom.list, sibZoom.i + 1);
      else if (sibZoom && ev.key === "ArrowLeft") openSibZoom(sibZoom.list, sibZoom.i - 1);
      else return;
      ev.preventDefault();
      return;
    }
    if (sibNav && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")){
      sibNav.show(sibNav.i + (ev.key === "ArrowRight" ? 1 : -1));
      ev.preventDefault();
      return;
    }
    if (ev.key === "j") step(1); else if (ev.key === "k") step(-1);
  });

  function init(){
    load();
    statEl = h("div");
    filtersEl = h("div", {class:"filters"});
    itemsEl = h("div", {class:"items", role:"list", "aria-label":"불량 chunk 목록"});
    reasonEl = h("div", {class:"rsum"});
    listEl = h("aside", {class:"list"}, [filtersEl, itemsEl, reasonEl]);
    detailEl = h("main", {class:"detail"});
    root.appendChild(h("div", {class:"app"}, [
      h("header", {class:"bar"}, [
        h("h1", {text:"검수"}),
        AXU ? h("span", {class:"rvbadge", title:"대상 축: " + (AXU.target || []).join(", "),
          text:"축 변경 검수 · 대상 축 " + (AXU.target || []).length + "개만 수정"}) : null,
        h("div", {class:"meta mono", text:"실행 " + DATA.run_id + "  ·  생성 " + (DATA.generated_at || "-") + "  ·  기준 unknown ≥ " + (flag.unknown_ratio_min !== undefined ? flag.unknown_ratio_min : "-") + ", 확신도 < " + (flag.confidence_min !== undefined ? flag.confidence_min : "-")}),
        h("div", {class:"sp", style:"flex:1"}),
        statEl,
        inboxEl = h("span", {class:"meta", role:"status"}),
        h("button", {class:"btn", type:"button", text:"텍스트로 복사", onclick:copyText}),
        h("button", {class:"btn", type:"button", text:"JSON 저장", onclick:download}),
        doneBtn = h("button", {class:"btn primary", type:"button", text:"검수 완료", disabled:true,
          title:"labelbot serve로 연 검수 화면에서만 누를 수 있습니다. 파일로 열었으면 JSON 저장 뒤 채팅으로 '검수 끝났어'라고 알려 주세요",
          onclick:reviewDone})
      ]),
      h("div", {class:"cols"}, [listEl, detailEl])
    ]));
    var f = flat(visibleChunks());
    selId = f.length ? f[0].chunk_id : null;
    accOpen = firstAccFor(byId[selId]);
    document.querySelector(".bar").appendChild(filtersEl);   // 목록이 좁은 레일이라 필터는 위 바에 둔다
    renderList(); renderDetail();
    inboxCheck();
  }
  init();
})();
</script>
</body>
</html>
